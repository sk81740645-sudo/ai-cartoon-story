<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BaatAI - AI Assistant</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f7f7f8;
  height:100vh;
  overflow:hidden;
}

button,input{
  font-family:Arial,sans-serif;
}

.hidden{
  display:none!important;
}

/* =========================
   AUTH
========================= */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f5f7fb;
}

.auth-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.auth-logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px;
}

.auth-subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  margin-bottom:22px;
  border-bottom:1px solid #e5e7eb;
}

.tab{
  flex:1;
  padding:12px;
  border:none;
  background:transparent;
  cursor:pointer;
  font-size:16px;
}

.tab.active{
  color:#2563eb;
  border-bottom:2px solid #2563eb;
  font-weight:bold;
}

.auth-form label{
  display:block;
  margin:12px 0 6px;
  font-size:14px;
  font-weight:bold;
}

.auth-form input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.auth-submit{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.auth-submit:disabled{
  background:#9ca3af;
}

.auth-message{
  text-align:center;
  margin-top:15px;
  min-height:20px;
  font-size:14px;
}

.switch-text{
  text-align:center;
  margin-top:15px;
  color:#555;
  font-size:14px;
}

.switch-btn{
  border:none;
  background:none;
  color:#2563eb;
  cursor:pointer;
  font-weight:bold;
}

/* =========================
   APP
========================= */

.app{
  height:100vh;
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:260px;
  background:#171717;
  color:white;
  padding:18px;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}

.logo{
  font-size:27px;
  font-weight:bold;
  margin-bottom:22px;
}

.new-chat{
  width:100%;
  padding:13px;
  border:1px solid #404040;
  background:#212121;
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  text-align:left;
}

.new-chat:hover{
  background:#303030;
}

.previous-title{
  margin-top:25px;
  margin-bottom:10px;
  font-size:13px;
  color:#9ca3af;
}

.chat-list{
  flex:1;
  overflow-y:auto;
}

.chat-item{
  padding:11px;
  margin-bottom:5px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-item:hover{
  background:#2f2f2f;
}

.chat-item.active{
  background:#343434;
}

.logout-btn{
  width:100%;
  padding:12px;
  border:1px solid #404040;
  background:#212121;
  color:white;
  border-radius:10px;
  cursor:pointer;
  margin-top:12px;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.header{
  height:65px;
  background:white;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-size:20px;
  font-weight:bold;
}

.menu-btn{
  display:none;
  border:none;
  background:transparent;
  font-size:28px;
  cursor:pointer;
  margin-right:12px;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  overflow-y:auto;
  padding:25px 15px 160px;
}

.welcome{
  text-align:center;
  margin-top:100px;
}

.welcome h1{
  font-size:34px;
  margin-bottom:10px;
}

.welcome p{
  color:#6b7280;
}

.message{
  max-width:850px;
  margin:18px auto;
  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.ai{
  align-items:flex-start;
}

.bubble{
  max-width:78%;
  padding:13px 17px;
  border-radius:15px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:#2563eb;
  color:white;
  border-bottom-right-radius:4px;
}

.ai .bubble{
  background:white;
  color:#171717;
  border:1px solid #e5e7eb;
  border-bottom-left-radius:4px;
}

.message-image{
  max-width:320px;
  max-height:320px;
  object-fit:contain;
  border-radius:12px;
  margin-bottom:8px;
  border:1px solid #ddd;
}

/* =========================
   INPUT
========================= */

.input-area{
  position:absolute;
  bottom:0;
  left:260px;
  right:0;
  background:linear-gradient(
    transparent,
    #f7f7f8 20%
  );
  padding:20px 15px;
}

.input-box{
  max-width:850px;
  margin:auto;
  background:white;
  border:1px solid #d9d9d9;
  border-radius:18px;
  padding:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.preview-area{
  padding:8px;
  display:flex;
}

.preview-box{
  position:relative;
  width:85px;
  height:85px;
}

.preview-box img{
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #ddd;
}

.remove-image{
  position:absolute;
  right:-7px;
  top:-7px;
  width:24px;
  height:24px;
  border:none;
  border-radius:50%;
  background:#222;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.input-row{
  display:flex;
  align-items:center;
  gap:7px;
}

#messageInput{
  flex:1;
  border:none;
  outline:none;
  padding:12px 8px;
  font-size:16px;
  min-width:0;
}

.icon-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:10px;
  background:transparent;
  cursor:pointer;
  font-size:22px;
}

.icon-btn:hover{
  background:#f0f0f0;
}

#sendBtn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#111;
  color:white;
  cursor:pointer;
  font-size:18px;
}

#sendBtn:disabled{
  background:#aaa;
  cursor:not-allowed;
}

#imageInput{
  display:none;
}

.input-help{
  max-width:850px;
  margin:8px auto 0;
  text-align:center;
  font-size:11px;
  color:#777;
}

/* =========================
   MENU OVERLAY
========================= */

.menu-overlay{
  display:none;
}

/* =========================
   MOBILE CHATGPT STYLE MENU
========================= */

@media(max-width:700px){

  .menu-btn{
    display:block;
  }

  .sidebar{
    display:flex;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:280px;
    z-index:2000;

    transform:translateX(-100%);
    transition:transform .25s ease;

    box-shadow:5px 0 25px rgba(0,0,0,.25);
  }

  .sidebar.active{
    transform:translateX(0);
  }

  .menu-overlay{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:1500;
  }

  .menu-overlay.hidden{
    display:none;
  }

  .chat{
    padding:15px 10px 160px;
  }

  .bubble{
    max-width:90%;
  }

  .welcome{
    margin-top:70px;
  }

  .welcome h1{
    font-size:28px;
  }

  .input-area{
    left:0;
    padding:10px;
  }

  .input-help{
    display:none;
  }

  .message-image{
    max-width:250px;
  }

}

</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<section id="authScreen">

<div class="auth-box">

<div class="auth-logo">
🤖 BaatAI
</div>

<div class="auth-subtitle">
BaatAI इस्तेमाल करने के लिए Login करें
</div>

<div class="tabs">

<button
class="tab active"
id="loginTab"
onclick="showLogin()">
Login
</button>

<button
class="tab"
id="signupTab"
onclick="showSignup()">
Sign Up
</button>

</div>

<form id="loginForm" class="auth-form">

<label>Email</label>

<input
id="loginEmail"
type="email"
placeholder="अपना Email डालें"
required>

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="अपना Password डालें"
required>

<button
id="loginBtn"
class="auth-submit"
type="submit">
Login
</button>

</form>

<form
id="signupForm"
class="auth-form hidden">

<label>Name</label>

<input
id="signupName"
type="text"
placeholder="अपना नाम डालें"
required>

<label>Email</label>

<input
id="signupEmail"
type="email"
placeholder="अपना Email डालें"
required>

<label>Password</label>

<input
id="signupPassword"
type="password"
placeholder="कम से कम 6 अक्षर"
minlength="6"
required>

<button
id="signupBtn"
class="auth-submit"
type="submit">
Create Account
</button>

</form>

<div
id="authMessage"
class="auth-message">
</div>

<div
id="loginSwitch"
class="switch-text">

नया account बनाना है?

<button
class="switch-btn"
onclick="showSignup()">
Sign Up
</button>

</div>

<div
id="signupSwitch"
class="switch-text hidden">

पहले से account है?

<button
class="switch-btn"
onclick="showLogin()">
Login
</button>

</div>

</div>

</section>


<!-- =========================
     MENU OVERLAY
========================= -->

<div
id="menuOverlay"
class="menu-overlay hidden"
onclick="closeMenu()">
</div>


<!-- =========================
     APP
========================= -->

<div
id="appScreen"
class="app hidden">

<aside
id="sidebar"
class="sidebar">

<div class="logo">
🤖 BaatAI
</div>

<button
class="new-chat"
onclick="newChat()">
＋ New Chat
</button>

<div class="previous-title">
Previous Chats
</div>

<div
id="chatList"
class="chat-list">
</div>

<button
class="logout-btn"
onclick="logout()">
🚪 Logout
</button>

</aside>


<main class="main">

<header class="header">

<button
class="menu-btn"
onclick="toggleMenu()">
☰
</button>

<span>
🤖 BaatAI
</span>

</header>


<section
id="chat"
class="chat">

<div
id="welcome"
class="welcome">

<h1>Hello 👋</h1>

<p>
BaatAI से कुछ भी पूछिए या फोटो upload करके सवाल पूछिए।
</p>

</div>

</section>


<!-- =========================
     INPUT
========================= -->

<div class="input-area">

<div class="input-box">

<div
id="previewArea"
class="preview-area hidden">

<div class="preview-box">

<img
id="previewImage"
src=""
alt="Image Preview">

<button
class="remove-image"
onclick="removeImage()">
×
</button>

</div>

</div>


<div class="input-row">

<button
class="icon-btn"
onclick="openImagePicker()"
title="Image Upload">
📎
</button>

<input
id="imageInput"
type="file"
accept="image/*"
onchange="handleImage(event)">

<input
id="messageInput"
type="text"
placeholder="Message BaatAI..."
autocomplete="off">

<button
id="sendBtn"
onclick="sendMessage()">
➤
</button>

</div>

</div>

<div class="input-help">
BaatAI कभी-कभी गलत जानकारी दे सकता है। महत्वपूर्ण जानकारी verify करें।
</div>

</div>

</main>

</div>


<script>

/* =========================
   API
========================= */

const CHAT_API="/api/chat";
const LOGIN_API="/api/login";
const SIGNUP_API="/api/signup";


/* =========================
   VARIABLES
========================= */

let currentUser=null;
let currentChatId=null;
let selectedImage=null;


/* =========================
   ELEMENTS
========================= */

const authScreen=
document.getElementById("authScreen");

const appScreen=
document.getElementById("appScreen");

const chat=
document.getElementById("chat");

const input=
document.getElementById("messageInput");

const sendBtn=
document.getElementById("sendBtn");

const imageInput=
document.getElementById("imageInput");

const previewArea=
document.getElementById("previewArea");

const previewImage=
document.getElementById("previewImage");

const chatList=
document.getElementById("chatList");


/* =========================
   AUTH MESSAGE
========================= */

function showAuthMessage(
message,
success=false
){

const box=
document.getElementById(
"authMessage"
);

box.textContent=message;

box.style.color=
success
?"#16a34a"
:"#dc2626";

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

document
.getElementById("loginForm")
.classList.remove("hidden");

document
.getElementById("signupForm")
.classList.add("hidden");

document
.getElementById("loginTab")
.classList.add("active");

document
.getElementById("signupTab")
.classList.remove("active");

document
.getElementById("loginSwitch")
.classList.remove("hidden");

document
.getElementById("signupSwitch")
.classList.add("hidden");

}


/* =========================
   SHOW SIGNUP
========================= */

function showSignup(){

document
.getElementById("signupForm")
.classList.remove("hidden");

document
.getElementById("loginForm")
.classList.add("hidden");

document
.getElementById("signupTab")
.classList.add("active");

document
.getElementById("loginTab")
.classList.remove("active");

document
.getElementById("signupSwitch")
.classList.remove("hidden");

document
.getElementById("loginSwitch")
.classList.add("hidden");

}


/* =========================
   SAVE USER
========================= */

function saveUser(user){

currentUser=user;

localStorage.setItem(
"baatai_user",
JSON.stringify(user)
);

}


/* =========================
   SHOW APP
========================= */

function showApp(user){

currentUser=user;

authScreen.classList.add("hidden");

appScreen.classList.remove("hidden");

loadPreviousChats();

setTimeout(()=>{
input.focus();
},200);

}


/* =========================
   CHECK LOGIN
========================= */

window.addEventListener(
"load",
()=>{

const saved=
localStorage.getItem(
"baatai_user"
);

if(!saved){

showLogin();
return;

}

try{

const user=
JSON.parse(saved);

if(user && user.id){

showApp(user);

}else{

localStorage.removeItem(
"baatai_user"
);

showLogin();

}

}catch{

localStorage.removeItem(
"baatai_user"
);

showLogin();

}

}
);


/* =========================
   SIGNUP
========================= */

document
.getElementById("signupForm")
.addEventListener(
"submit",
async(event)=>{

event.preventDefault();

const name=
document
.getElementById("signupName")
.value
.trim();

const email=
document
.getElementById("signupEmail")
.value
.trim();

const password=
document
.getElementById("signupPassword")
.value;

if(!name || !email || !password){

showAuthMessage(
"सभी जानकारी भरें।"
);

return;

}

if(password.length<6){

showAuthMessage(
"Password कम से कम 6 अक्षर का होना चाहिए।"
);

return;

}

const btn=
document.getElementById(
"signupBtn"
);

btn.disabled=true;

btn.textContent=
"Account बन रहा है...";

try{

const response=
await fetch(
SIGNUP_API,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
name,
email,
password
})
}
);

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Signup failed"
);

}

showLogin();

document
.getElementById("loginEmail")
.value=email;

showAuthMessage(
"Account बन गया! अब Login करें। ✅",
true
);

}catch(error){

showAuthMessage(
error.message
);

}

btn.disabled=false;

btn.textContent=
"Create Account";

}
);


/* =========================
   LOGIN
========================= */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async(event)=>{

event.preventDefault();

const email=
document
.getElementById("loginEmail")
.value
.trim();

const password=
document
.getElementById("loginPassword")
.value;

const btn=
document.getElementById(
"loginBtn"
);

btn.disabled=true;

btn.textContent=
"Login हो रहा है...";

try{

const response=
await fetch(
LOGIN_API,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
email,
password
})
}
);

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Login failed"
);

}

if(!data.user){

throw new Error(
"User information नहीं मिली।"
);

}

saveUser(data.user);

showApp(data.user);

}catch(error){

showAuthMessage(
error.message
);

}

btn.disabled=false;

btn.textContent="Login";

}
);


/* =========================
   LOGOUT
========================= */

function logout(){

localStorage.removeItem(
"baatai_user"
);

currentUser=null;
currentChatId=null;

closeMenu();

appScreen.classList.add(
"hidden"
);

authScreen.classList.remove(
"hidden"
);

showLogin();

}


/* =========================
   CHATGPT STYLE MENU
========================= */

function toggleMenu(){

const sidebar=
document.getElementById(
"sidebar"
);

const overlay=
document.getElementById(
"menuOverlay"
);

sidebar.classList.toggle(
"active"
);

overlay.classList.toggle(
"hidden"
);

}


/* =========================
   CLOSE MENU
========================= */

function closeMenu(){

const sidebar=
document.getElementById(
"sidebar"
);

const overlay=
document.getElementById(
"menuOverlay"
);

sidebar.classList.remove(
"active"
);

overlay.classList.add(
"hidden"
);

}


/* =========================
   IMAGE PICKER
========================= */

function openImagePicker(){

imageInput.click();

}


/* =========================
   IMAGE SELECT
========================= */

function handleImage(event){

const file=
event.target.files[0];

if(!file){
return;
}

if(!file.type.startsWith("image/")){

alert(
"कृपया image file चुनें।"
);

imageInput.value="";

return;

}

if(file.size>10*1024*1024){

alert(
"Image 10MB से छोटी होनी चाहिए।"
);

imageInput.value="";

return;

}

const reader=
new FileReader();

reader.onload=
function(e){

selectedImage=
e.target.result;

previewImage.src=
selectedImage;

previewArea.classList.remove(
"hidden"
);

};

reader.readAsDataURL(file);

}


/* =========================
   REMOVE IMAGE
========================= */

function removeImage(){

selectedImage=null;

previewImage.src="";

previewArea.classList.add(
"hidden"
);

imageInput.value="";

}


/* =========================
   ENTER
========================= */

input.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
text,
type,
image=null
){

const div=
document.createElement(
"div"
);

div.className=
"message "+type;

if(image){

const img=
document.createElement(
"img"
);

img.src=image;

img.className=
"message-image";

div.appendChild(img);

}

if(text){

const bubble=
document.createElement(
"div"
);

bubble.className="bubble";

bubble.textContent=text;

div.appendChild(bubble);

}

chat.appendChild(div);

chat.scrollTop=
chat.scrollHeight;

return div;

}


/* =========================
   CREATE CHAT
========================= */

async function createChat(){

if(!currentUser){
return null;
}

try{

const response=
await fetch(
"/api/chats",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
userId:currentUser.id,
title:"New Chat"
})
}
);

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Chat create failed"
);

}

currentChatId=
data.chat.id;

await loadPreviousChats();

return currentChatId;

}catch(error){

console.error(
"CREATE CHAT ERROR:",
error
);

return null;

}

}


/* =========================
   PREVIOUS CHATS
========================= */

async function loadPreviousChats(){

if(!currentUser){
return;
}

try{

const response=
await fetch(
"/api/chats/"+
currentUser.id
);

const data=
await response.json();

if(!response.ok){
return;
}

chatList.innerHTML="";

data.chats.forEach(
(chatData)=>{

const item=
document.createElement(
"div"
);

item.className=
"chat-item";

if(
String(chatData.id)===
String(currentChatId)
){

item.classList.add(
"active"
);

}

item.textContent=
chatData.title ||
"New Chat";

item.onclick=
()=>{
openChat(
chatData.id
);
};

chatList.appendChild(item);

}
);

}catch(error){

console.error(
"LOAD CHATS ERROR:",
error
);

}

}


/* =========================
   OPEN PREVIOUS CHAT
========================= */

async function openChat(chatId){

if(!currentUser){
return;
}

try{

const response=
await fetch(
"/api/chats/"+
currentUser.id+
"/"+
chatId
);

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Chat load failed"
);

}

currentChatId=chatId;

chat.innerHTML="";

data.messages.forEach(
(msg)=>{

addMessage(
msg.content,
msg.role==="user"
?"user"
:"ai",
msg.image_data
);

}
);

await loadPreviousChats();

closeMenu();

}catch(error){

console.error(
"OPEN CHAT ERROR:",
error
);

}

}


/* =========================
   SAVE MESSAGE
========================= */

async function saveMessage(
role,
content,
imageData=null
){

if(
!currentChatId ||
!currentUser
){

return;

}

try{

await fetch(
"/api/messages",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

userId:
currentUser.id,

chatId:
currentChatId,

role,

content:
content || "",

imageData:
imageData || null

})
}
);

}catch(error){

console.error(
"SAVE MESSAGE ERROR:",
error
);

}

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

const message=
input.value.trim();

if(
!message &&
!selectedImage
){

return;

}

if(!currentUser){

return;

}


/* CREATE CHAT */

if(!currentChatId){

const id=
await createChat();

if(!id){

alert(
"Chat create नहीं हो सकी।"
);

return;

}

}


/* REMOVE WELCOME */

const welcome=
document.getElementById(
"welcome"
);

if(welcome){
welcome.remove();
}


/* IMAGE */

const imageToSend=
selectedImage;


/* USER MESSAGE */

addMessage(
message ||
"इस image को देखो।",
"user",
imageToSend
);

await saveMessage(
"user",
message ||
"इस image को देखो।",
imageToSend
);


/* CLEAR */

input.value="";

removeImage();

sendBtn.disabled=true;


/* THINKING */

const typing=
addMessage(
"🤖 सोच रहा हूँ...",
"ai"
);


try{

const response=
await fetch(
CHAT_API,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

message:
message ||
"इस image को ध्यान से देखकर बताओ कि इसमें क्या है।",

image:
imageToSend || null

})
}
);

const data=
await response.json();

typing.remove();

if(!response.ok){

throw new Error(
data.error ||
"Server error"
);

}

const reply=
data.reply ||
"मुझे कोई जवाब नहीं मिला।";

addMessage(
reply,
"ai"
);

await saveMessage(
"ai",
reply,
null
);

await loadPreviousChats();

}catch(error){

console.error(
"CHAT ERROR:",
error
);

typing.remove();

addMessage(
"AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।",
"ai"
);

}

sendBtn.disabled=false;

input.focus();

}
