<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>BaatAI</title>

<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;

  overflow:hidden;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#000;
}


/* =========================
   APP
========================= */

.app{
  position:relative;

  width:100%;
  height:100dvh;

  overflow:hidden;

  background:#000;
}


/* =========================
   VIDEO BACKGROUND
========================= */

#bgVideo{
  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:0;

  pointer-events:none;

  background:#000;
}

.videoOverlay{
  position:fixed;

  inset:0;

  z-index:1;

  background:
    rgba(0,8,12,.62);

  pointer-events:none;
}


/* =========================
   HEADER
========================= */

.header{
  position:relative;

  z-index:30;

  width:100%;
  height:72px;

  display:flex;

  align-items:center;

  padding:0 14px;

  background:
    rgba(0,8,12,.72);

  backdrop-filter:blur(8px);

  border-bottom:
    1px solid
    rgba(0,229,255,.25);
}


/* =========================
   MENU
========================= */

.menuBtn{
  width:42px;
  height:42px;

  margin-right:8px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:0;

  border-radius:10px;

  background:transparent;

  color:#fff;

  font-size:32px;

  cursor:pointer;

  position:relative;

  z-index:100;

  pointer-events:auto;
}


/* =========================
   BRAND
========================= */

.brand{
  display:flex;

  align-items:center;

  gap:8px;

  min-width:0;
}

.robot{
  font-size:30px;

  line-height:1;
}

.brandName{
  color:#fff;

  font-size:22px;

  font-weight:700;

  line-height:24px;
}

.brandSub{
  color:#00e5ff;

  font-size:11px;

  line-height:14px;
}


/* =========================
   HEADER RIGHT
========================= */

.headerRight{
  display:flex;

  align-items:center;

  margin-left:auto;
}


/* =========================
   LIGHT BUTTON
========================= */

.lightBtn{
  height:42px;

  padding:0 12px;

  border:
    1px solid
    #00e5ff;

  border-radius:11px;

  background:
    rgba(0,40,48,.7);

  color:#fff;

  font-size:14px;

  cursor:pointer;

  position:relative;

  z-index:100;

  pointer-events:auto;
}


/* =========================
   PROFILE
========================= */

.profileBtn{
  width:42px;
  height:42px;

  margin-left:8px;

  border:
    1px solid
    #00e5ff;

  border-radius:50%;

  background:
    rgba(0,50,60,.75);

  color:#fff;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  position:relative;

  z-index:100;

  pointer-events:auto;
}


/* =========================
   MAIN
========================= */

.main{
  position:relative;

  z-index:10;

  width:100%;

  height:
    calc(100dvh - 72px);

  overflow:hidden;
}


/* =========================
   WELCOME TITLE
========================= */

.welcome{
  height:60px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding-top:3px;
}

.welcome h1{
  color:#00e5ff;

  font-size:27px;

  font-weight:600;

  text-shadow:
    0 0 12px
    rgba(0,229,255,.45);
}

.welcomeLine{
  width:52px;

  height:1px;

  background:#00e5ff;

  margin:
    0 10px 3px;
}


/* =========================
   CHAT
========================= */

.chat{
  width:100%;

  height:
    calc(100% - 60px);

  padding:
    4px 18px 120px;

  overflow-y:auto;

  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:
    rgba(0,229,255,.35);

  border-radius:10px;
}


/* =========================
   MESSAGE
========================= */

.message{
  width:100%;

  display:flex;

  margin:
    10px 0;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}


/* =========================
   BUBBLE
========================= */

.bubble{
  max-width:86%;

  padding:
    12px 15px;

  border-radius:17px;

  color:#f5ffff;

  font-size:16px;

  line-height:1.5;

  word-break:break-word;

  white-space:pre-wrap;

  background:
    rgba(0,15,20,.78);

  border:
    1px solid
    rgba(0,229,255,.35);

  backdrop-filter:blur(5px);
}

.message.user .bubble{
  background:
    rgba(0,65,75,.45);

  border-color:
    rgba(0,229,255,.7);

  border-bottom-right-radius:5px;
}

.message.assistant .bubble{
  border-bottom-left-radius:5px;
}


/* =========================
   WELCOME CARD
========================= */

.welcomeMessage{
  width:100%;

  max-width:600px;

  margin:
    15px auto;

  padding:
    22px 18px;

  text-align:left;

  border:
    1px solid
    rgba(0,229,255,.45);

  border-radius:20px;

  background:
    rgba(0,18,23,.72);

  color:#f1ffff;

  font-size:16px;

  line-height:1.65;

  backdrop-filter:blur(7px);

  box-shadow:
    0 0 18px
    rgba(0,229,255,.04);
}

.welcomeMessage strong{
  font-size:18px;
}


/* =========================
   TYPING
========================= */

.typing{
  display:flex;

  align-items:center;

  gap:5px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#00e5ff;

  animation:
    typing 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes typing{

  0%,
  60%,
  100%{
    transform:translateY(0);

    opacity:.4;
  }

  30%{
    transform:translateY(-5px);

    opacity:1;
  }

}


/* =========================
   INPUT AREA
========================= */

.inputArea{
  position:absolute;

  z-index:50;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  padding:
    7px 12px
    max(8px,env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      rgba(0,7,10,.98) 45%
    );

  pointer-events:none;
}

.inputBox{
  width:100%;

  max-width:700px;

  min-height:58px;

  margin:auto;

  display:flex;

  align-items:center;

  gap:5px;

  padding:
    5px 6px;

  border:
    1px solid
    #00e5ff;

  border-radius:30px;

  background:
    rgba(0,20,25,.9);

  box-shadow:
    0 0 15px
    rgba(0,229,255,.08);

  backdrop-filter:blur(10px);

  pointer-events:auto;
}


/* =========================
   ICON BUTTON
========================= */

.iconBtn{
  width:44px;
  height:44px;

  flex:0 0 44px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    #00e5ff;

  border-radius:50%;

  background:
    rgba(0,45,55,.75);

  color:#00e5ff;

  font-size:19px;

  cursor:pointer;

  position:relative;

  z-index:100;

  pointer-events:auto;
}

.iconBtn:active{
  transform:scale(.93);
}


/* =========================
   TEXTAREA
========================= */

#messageInput{
  flex:1;

  min-width:0;

  height:42px;

  max-height:100px;

  resize:none;

  overflow-y:auto;

  border:0;

  outline:0;

  background:transparent;

  color:#fff;

  padding:
    10px 5px;

  font-size:16px;

  line-height:22px;
}

#messageInput::placeholder{
  color:#9aaeb2;
}


/* =========================
   SEND
========================= */

.sendBtn{
  width:46px;
  height:46px;

  flex:0 0 46px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:0;

  border-radius:50%;

  background:#fff;

  color:#001014;

  font-size:24px;

  font-weight:bold;

  cursor:pointer;

  position:relative;

  z-index:100;

  pointer-events:auto;
}

.sendBtn:active{
  transform:scale(.92);
}


/* =========================
   IMAGE INPUT
========================= */

#imageInput{
  display:none;
}

.uploadedImage{
  display:block;

  width:100%;

  max-width:270px;

  max-height:320px;

  object-fit:cover;

  margin-bottom:8px;

  border-radius:13px;

  border:
    1px solid
    rgba(0,229,255,.4);
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;

  top:0;
  left:-285px;

  width:275px;
  height:100dvh;

  z-index:90;

  padding:
    82px 14px 20px;

  overflow-y:auto;

  background:
    rgba(0,12,17,.98);

  border-right:
    1px solid
    #00e5ff;

  box-shadow:
    8px 0 30px
    rgba(0,0,0,.5);

  transition:
    left .25s ease;
}

.sidebar.open{
  left:0 !important;
}


/* =========================
   SIDEBAR BUTTONS
========================= */

.newChatBtn,
.menuItem{
  width:100%;

  min-height:45px;

  margin-bottom:8px;

  padding:
    10px 13px;

  border:
    1px solid
    rgba(0,229,255,.45);

  border-radius:10px;

  background:
    rgba(0,40,48,.72);

  color:#fff;

  text-align:left;

  font-size:14px;

  cursor:pointer;

  position:relative;

  z-index:100;

  pointer-events:auto;
}

.newChatBtn:hover,
.menuItem:hover{
  background:
    rgba(0,229,255,.15);
}


/* =========================
   HISTORY
========================= */

.historyTitle{
  margin:
    18px 4px 9px;

  color:#00e5ff;

  font-size:13px;

  font-weight:bold;
}

.historyList{
  width:100%;
}

.historyItem{
  width:100%;

  padding:10px;

  margin-bottom:6px;

  border-radius:9px;

  background:
    rgba(255,255,255,.06);

  color:#ddd;

  font-size:13px;

  cursor:pointer;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.historyItem:hover{
  background:
    rgba(0,229,255,.12);
}

.historyEmpty{
  color:#7f9295;

  font-size:12px;

  padding:10px 4px;
}


/* =========================
   PROFILE POPUP
========================= */

.profilePopup{
  position:fixed;

  z-index:120;

  top:78px;
  right:12px;

  width:210px;

  padding:15px;

  border:
    1px solid
    #00e5ff;

  border-radius:14px;

  background:
    rgba(0,15,20,.98);

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.45);

  display:none;
}

.profilePopup.show{
  display:block;
}

.profilePopup h3{
  color:#00e5ff;

  font-size:16px;

  margin-bottom:8px;
}

.profilePopup p{
  color:#ddd;

  font-size:13px;

  line-height:1.5;

  margin-bottom:10px;
}

.closePopup{
  width:100%;

  padding:9px;

  border:
    1px solid
    #00e5ff;

  border-radius:9px;

  background:transparent;

  color:#fff;

  cursor:pointer;
}


/* =========================
   MIC LISTENING
========================= */

.micBtn.listening{
  background:
    rgba(255,0,0,.18);

  border-color:#ff4444;

  color:#ff4444;

  animation:
    micPulse 1s infinite;
}

@keyframes micPulse{

  50%{
    box-shadow:
      0 0 14px
      rgba(255,0,0,.5);
  }

}


/* =========================
   LIGHT MODE
========================= */

body.light{
  background:#f4fbfc;
}

body.light .videoOverlay{
  background:
    rgba(235,250,252,.82);
}

body.light .header{
  background:
    rgba(255,255,255,.88);

  border-bottom-color:
    rgba(0,140,160,.25);
}

body.light .menuBtn,
body.light .brandName{
  color:#111;
}

body.light .brandSub{
  color:#008fa5;
}

body.light .lightBtn{
  background:
    rgba(255,255,255,.9);

  color:#111;
}

body.light .profileBtn{
  background:
    rgba(220,248,250,.9);

  color:#111;
}

body.light .welcome h1{
  color:#008da3;
}

body.light .welcomeMessage{
  background:
    rgba(255,255,255,.82);

  color:#111;

  border-color:
    rgba(0,130,150,.35);
}

body.light .bubble{
  color:#111;

  background:
    rgba(255,255,255,.8);
}

body.light .inputArea{
  background:
    linear-gradient(
      transparent,
      rgba(245,252,253,.98) 45%
    );
}

body.light .inputBox{
  background:
    rgba(255,255,255,.92);
}

body.light #messageInput{
  color:#111;
}

body.light #messageInput::placeholder{
  color:#667;
}

body.light .sidebar{
  background:
    rgba(248,253,254,.99);

  color:#111;
}

body.light .newChatBtn,
body.light .menuItem{
  color:#111;

  background:
    rgba(220,245,247,.75);
}

body.light .historyItem{
  color:#222;

  background:
    rgba(0,0,0,.05);
}

body.light .profilePopup{
  background:
    rgba(255,255,255,.98);
}

body.light .profilePopup p{
  color:#333;
}

body.light .closePopup{
  color:#111;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header{
    height:64px;

    padding:
      0 9px;
  }

  .main{
    height:
      calc(100dvh - 64px);
  }

  .menuBtn{
    width:39px;
    height:39px;

    font-size:29px;
  }

  .robot{
    font-size:27px;
  }

  .brandName{
    font-size:20px;
  }

  .brandSub{
    font-size:10px;
  }

  .lightBtn{
    height:38px;

    padding:
      0 9px;

    font-size:12px;
  }

  .profileBtn{
    width:38px;
    height:38px;
  }

  .welcome{
    height:57px;
  }

  .welcome h1{
    font-size:25px;
  }

  .welcomeLine{
    width:38px;
  }

  .chat{
    height:
      calc(100% - 57px);

    padding:
      4px 10px 105px;
  }

  .welcomeMessage{
    padding:
      17px 14px;

    margin:
      10px auto;

    font-size:15px;

    line-height:1.55;
  }

  .welcomeMessage strong{
    font-size:17px;
  }

  .bubble{
    max-width:88%;

    font-size:15px;

    padding:
      10px 12px;
  }

  .inputArea{
    padding:
      5px 8px
      max(7px,env(safe-area-inset-bottom));
  }

  .inputBox{
    min-height:55px;

    padding:
      4px 5px;

    gap:3px;
  }

  .iconBtn{
    width:40px;
    height:40px;

    flex-basis:40px;

    font-size:17px;
  }

  #messageInput{
    height:39px;

    font-size:15px;

    padding:
      8px 4px;
  }

  .sendBtn{
    width:42px;
    height:42px;

    flex-basis:42px;

    font-size:21px;
  }

  .sidebar{
    width:270px;

    padding-top:72px;
  }

  .profilePopup{
    top:58px;

    right:8px;

    width:190px;
  }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

  .brandName{
    font-size:18px;
  }

  .brandSub{
    font-size:9px;
  }

  .lightBtn{
    padding:
      0 7px;

    font-size:11px;
  }

  .profileBtn{
    width:36px;
    height:36px;
  }

  .iconBtn{
    width:38px;
    height:38px;

    flex-basis:38px;
  }

  .sendBtn{
    width:40px;
    height:40px;

    flex-basis:40px;
  }

}


/* =========================
   IMPORTANT CLICK FIX
========================= */

.videoOverlay,
#bgVideo{
  pointer-events:none !important;
}

.menuBtn,
.lightBtn,
.profileBtn,
.newChatBtn,
.menuItem,
.iconBtn,
.sendBtn,
.closePopup{
  pointer-events:auto !important;
}

</style>

</head>


<body>

<div class="app">


  <!-- ================= VIDEO ================= -->

  <video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline
  >
    <source
      src="background.mp4"
      type="video/mp4"
    >
  </video>

  <div class="videoOverlay"></div>


  <!-- ================= SIDEBAR ================= -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <button
      class="newChatBtn"
      id="newChatBtn"
    >
      ＋ New Chat
    </button>


    <button
      class="menuItem"
      id="clearHistoryBtn"
    >
      🗑️ Clear History
    </button>


    <button
      class="menuItem"
      id="themeMenuBtn"
    >
      ☀️ Light / Dark
    </button>


    <div class="historyTitle">
      Chat History
    </div>


    <div
      id="historyList"
      class="historyList"
    ></div>

  </aside>


  <!-- ================= HEADER ================= -->

  <header class="header">


    <button
      class="menuBtn"
      id="menuBtn"
      aria-label="Menu"
    >
      ☰
    </button>


    <div class="brand">

      <div class="robot">
        🤖
      </div>

      <div>

        <div class="brandName">
          BaatAI
        </div>

        <div class="brandSub">
          AI Study
        </div>

      </div>

    </div>


    <div class="headerRight">


      <button
        class="lightBtn"
        id="lightBtn"
      >
        ☀️ Light
      </button>


      <button
        class="profileBtn"
        id="profileBtn"
      >
        S
      </button>


    </div>

  </header>


  <!-- ================= MAIN ================= -->

  <main class="main">


    <section class="welcome">

      <div class="welcomeLine"></div>

      <h1>
        Welcome
      </h1>

      <div class="welcomeLine"></div>

    </section>


    <!-- ================= CHAT ================= -->

    <section
      class="chat"
      id="chat"
    >

      <div class="welcomeMessage">

        <strong>
          👋 Welcome to BaatAI
        </strong>

        <br><br>

        Ask me anything. I can help you with
        study, coding, ideas, stories and much more.

      </div>

    </section>


    <!-- ================= INPUT ================= -->

    <div class="inputArea">

      <div class="inputBox">


        <!-- CAMERA -->

        <button
          class="iconBtn"
          id="cameraBtn"
          title="Upload Image"
        >
          📷
        </button>


        <input
          type="file"
          id="imageInput"
          accept="image/*"
        >


        <!-- MESSAGE -->

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message BaatAI..."
          autocomplete="off"
        ></textarea>


        <!-- MIC -->

        <button
          class="iconBtn micBtn"
          id="micBtn"
          title="Voice"
        >
          🎤
        </button>


        <!-- SEND -->

        <button
          class="sendBtn"
          id="sendBtn"
          title="Send"
        >
          ➤
        </button>


      </div>

    </div>

  </main>


  <!-- ================= PROFILE ================= -->

  <div
    class="profilePopup"
    id="profilePopup"
  >

    <h3>
      👤 BaatAI User
    </h3>

    <p>
      Welcome to BaatAI AI Assistant.
    </p>

    <button
      class="closePopup"
      id="closePopup"
    >
      Close
    </button>

  </div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const menuBtn =
  document.getElementById("menuBtn");

const sidebar =
  document.getElementById("sidebar");

const lightBtn =
  document.getElementById("lightBtn");

const themeMenuBtn =
  document.getElementById("themeMenuBtn");

const profileBtn =
  document.getElementById("profileBtn");

const profilePopup =
  document.getElementById("profilePopup");

const closePopup =
  document.getElementById("closePopup");

const newChatBtn =
  document.getElementById("newChatBtn");

const clearHistoryBtn =
  document.getElementById("clearHistoryBtn");

const historyList =
  document.getElementById("historyList");

const chat =
  document.getElementById("chat");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const imageInput =
  document.getElementById("imageInput");

const bgVideo =
  document.getElementById("bgVideo");


/* =====================================================
   MENU
===================================================== */

menuBtn.onclick = function(e){

  e.stopPropagation();

  sidebar.classList.toggle("open");

};


/* =====================================================
   CLOSE MENU OUTSIDE
===================================================== */

document.addEventListener("click",function(e){

  if(
    sidebar.classList.contains("open") &&
    !sidebar.contains(e.target) &&
    !menuBtn.contains(e.target)
  ){

    sidebar.classList.remove("open");

  }

});


/* =====================================================
   THEME
===================================================== */

function updateThemeButton(){

  if(
    document.body.classList.contains("light")
  ){

    lightBtn.textContent =
      "🌙 Dark";

  }else{

    lightBtn.textContent =
      "☀️ Light";

  }

}


function toggleTheme(){

  document.body.classList.toggle("light");

  const theme =
    document.body.classList.contains("light")
      ? "light"
      : "dark";

  localStorage.setItem(
    "baatai-theme",
    theme
  );

  updateThemeButton();

}


const savedTheme =

/* =====================================================
   HISTORY
===================================================== */

let chatHistory =
  JSON.parse(
    localStorage.getItem(
      "baatai-history"
    ) || "[]"
  );


function saveHistory(){

  localStorage.setItem(
    "baatai-history",
    JSON.stringify(chatHistory)
  );

}


function renderHistory(){

  historyList.innerHTML = "";

  if(chatHistory.length === 0){

    historyList.innerHTML = `
      <div class="historyEmpty">
        No previous chats
      </div>
    `;

    return;

  }


  chatHistory
    .slice()
    .reverse()
    .forEach(function(item){

      const div =
        document.createElement("div");

      div.className =
        "historyItem";

      div.textContent =
        item.text.length > 32
          ? item.text.substring(0,32) + "..."
          : item.text;


      div.onclick = function(){

        messageInput.value =
          item.text;

        sidebar.classList.remove(
          "open"
        );

        messageInput.focus();

      };


      historyList.appendChild(div);

    });

}


renderHistory();


function addHistory(text){

  if(!text.trim()) return;

  chatHistory.push({

    text:text,

    time:Date.now()

  });


  if(chatHistory.length > 30){

    chatHistory =
      chatHistory.slice(-30);

  }


  saveHistory();

  renderHistory();

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

clearHistoryBtn.onclick = function(){

  const ok =
    confirm(
      "Clear all chat history?"
    );

  if(!ok) return;

  chatHistory = [];

  localStorage.removeItem(
    "baatai-history"
  );

  renderHistory();

  sidebar.classList.remove(
    "open"
  );

};

/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  text,
  sender,
  image
){

  const message =
    document.createElement("div");

  message.className =
    "message " + sender;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  if(image){

    const img =
      document.createElement("img");

    img.src =
      image;

    img.className =
      "uploadedImage";

    bubble.appendChild(img);

  }


  if(text){

    const textDiv =
      document.createElement("div");

    textDiv.textContent =
      text;

    bubble.appendChild(textDiv);

  }


  message.appendChild(
    bubble
  );

  chat.appendChild(
    message
  );


  chat.scrollTo({

    top:chat.scrollHeight,

    behavior:"smooth"

  });

}


/* =====================================================
   TYPING
===================================================== */

function showTyping(){

  const message =
    document.createElement("div");

  message.className =
    "message assistant";

  message.id =
    "typingMessage";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble typing";


  bubble.innerHTML = `
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;


  message.appendChild(
    bubble
  );

  chat.appendChild(
    message
  );


  chat.scrollTo({

    top:chat.scrollHeight,

    behavior:"smooth"

  });

}


function hideTyping(){

  const typing =
    document.getElementById(
      "typingMessage"
    );

  if(typing){

    typing.remove();

  }

}


/* =====================================================
   IMAGE
===================================================== */

let selectedImage = null;


cameraBtn.onclick = function(){

  imageInput.click();

};


imageInput.onchange = function(){

  const file =
    imageInput.files[0];

  if(!file) return;


  if(!file.type.startsWith("image/")){

    alert(
      "Please select an image."
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload = function(){

    selectedImage =
      reader.result;

    messageInput.placeholder =
      "Image selected. Ask BaatAI...";

    messageInput.focus();

  };


  reader.readAsDataURL(file);

};


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const text =
    messageInput.value.trim();

  const imageToSend =
    selectedImage;


  if(!text && !imageToSend){

    return;

  }


  addMessage(
    text || "Image",
    "user",
    imageToSend
  );


  if(text){

    addHistory(text);

  }


  messageInput.value = "";

  messageInput.style.height =
    "39px";

  messageInput.placeholder =
    "Message BaatAI...";


  selectedImage = null;

  imageInput.value = "";


  showTyping();


  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:text,

            image:imageToSend || null

          })

        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const data =
      await response.json();


    hideTyping();


    if(
      data &&
      data.success &&
      data.reply
    ){

      addMessage(
        data.reply,
        "assistant",
        null
      );

    }else{

      addMessage(
        "Sorry, mujhe response nahi mila. Please dobara try karein.",
        "assistant",
        null
      );

    }


  }catch(error){

    console.error(
      "BaatAI Error:",
      error
    );

    hideTyping();


    addMessage(
      "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।",
      "assistant",
      null
    );

  }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendBtn.onclick = function(){

  sendMessage();

};

messageInput.onkeydown = function(e){

  if(

    !e.shiftKey

};

/* =====================================================
   MICROPHONE
===================================================== */

let recognition = null;

let isListening = false;


if(
  "SpeechRecognition" in window ||
  "webkitSpeechRecognition" in window
){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  recognition =
    new SpeechRecognition();


  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.lang =
    "en-IN";


  recognition.onstart =
    function(){

      isListening = true;

      micBtn.textContent =
        "🔴";

      micBtn.classList.add(
        "listening"
      );

    };


  recognition.onend =
    function(){

      isListening = false;

      micBtn.textContent =
        "🎤";

      micBtn.classList.remove(
        "listening"
      );

    };


  recognition.onerror =
    function(){

      isListening = false;

      micBtn.textContent =
        "🎤";

      micBtn.classList.remove(
        "listening"
      );

    };


  recognition.onresult =
    function(event){

      const result =
        event.results[0][0]
          .transcript;


      messageInput.value +=
        (
          messageInput.value
            ? " "
            : ""
        ) + result;


      messageInput.dispatchEvent(
        new Event("input")
      );


      messageInput.focus();

    };


  micBtn.onclick =
    function(){

      if(isListening){

        recognition.stop();

      }else{

        try{

          recognition.start();

        }catch(error){

          console.log(error);

        }

      }

    };


}else{

  micBtn.onclick =
    function(){

      alert(
        "Voice input आपके browser में supported नहीं है।"
      );

    };

}
