<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BaatAI - AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      height: 100vh;
    }

    button,
    input {
      font-family: Arial, sans-serif;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN / SIGN UP
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f5f7fb;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .auth-logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      margin-bottom: 22px;
      border-bottom: 1px solid #e5e7eb;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
    }

    .tab.active {
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
      font-weight: bold;
    }

    .auth-form label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .auth-form input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .auth-form input:focus {
      border-color: #2563eb;
    }

    .auth-submit {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .auth-submit:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .auth-message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
      color: #dc2626;
    }

    /* =========================
       BAATAI APP
    ========================= */

    .app {
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .new-chat,
    .logout-btn {
      width: 100%;
      padding: 13px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .new-chat:hover,
    .logout-btn:hover {
      background: #374151;
    }

    .logout-btn {
      margin-top: 12px;
    }

    .user-info {
      margin-top: 20px;
      padding: 12px;
      border-top: 1px solid #374151;
      color: #d1d5db;
      font-size: 13px;
      word-break: break-word;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      height: 65px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 20px;
      font-size: 21px;
      font-weight: bold;
    }

    .menu-btn {
      display: none;
      border: none;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      margin-right: 12px;
      color: #111827;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .welcome {
      text-align: center;
      margin-top: 100px;
    }

    .welcome h1 {
      font-size: 34px;
      color: #111827;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #6b7280;
      font-size: 16px;
    }

    .message {
      max-width: 850px;
      margin: 15px auto;
      display: flex;
    }

    .user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 13px 17px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai .bubble {
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 15px;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    #messageInput:focus {
      border-color: #2563eb;
    }

    #sendBtn {
      width: 55px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #1d4ed8;
    }

    #sendBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .menu-btn {
        display: block;
      }

      .sidebar {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 1000;
      }

      .sidebar.active {
        display: block;
      }

      .header {
        padding: 0 15px;
      }

      .chat {
        padding: 15px;
      }

      .welcome {
        margin-top: 70px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .bubble {
        max-width: 90%;
      }

      .input-area {
        padding: 10px;
      }

      .auth-box {
        padding: 25px;
      }
    }
  </style>
</head>

<body>
<div id="authScreen" style="
  position:fixed;
  inset:0;
  background:#f5f7fb;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
">

  <div style="
    width:100%;
    max-width:400px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.1);
  ">

    <h1 style="text-align:center;margin-bottom:10px;">
      🤖 BaatAI
    </h1>

    <p style="text-align:center;color:#6b7280;margin-bottom:20px;">
      पहले Login या Sign Up करें
    </p>

    <div id="authMessage" style="
      display:none;
      padding:10px;
      margin-bottom:15px;
      border-radius:8px;
      background:#fee2e2;
      color:#991b1b;
    "></div>

    <div id="signupForm">

      <input
        id="signupName"
        placeholder="आपका नाम"
        style="width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;"
      >

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
        style="width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Password (कम से कम 6 अक्षर)"
        style="width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;"
      >

      <button
        onclick="signupUser()"
        style="width:100%;padding:13px;background:#2563eb;color:white;border:0;border-radius:10px;font-size:16px;">
        Sign Up
      </button>

      <p style="text-align:center;margin-top:15px;">
        पहले से account है?
        <button
          onclick="showLogin()"
          style="border:0;background:none;color:#2563eb;cursor:pointer;">
          Login
        </button>
      </p>

    </div>


    <div id="loginForm" style="display:none;">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        style="width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        style="width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;"
      >

      <button
        onclick="loginUser()"
        style="width:100%;padding:13px;background:#2563eb;color:white;border:0;border-radius:10px;font-size:16px;">
        Login
      </button>

      <p style="text-align:center;margin-top:15px;">
        नया account बनाना है?
        <button
          onclick="showSignup()"
          style="border:0;background:none;color:#2563eb;cursor:pointer;">
          Sign Up
        </button>
      </p>

    </div>

  </div>

</div>
  <!-- =========================
       LOGIN / SIGN UP SCREEN
  ========================= -->

  <section id="authScreen">

    <div class="auth-box">

      <div class="auth-logo">
        🤖 BaatAI
      </div>

      <div class="auth-subtitle">
        BaatAI इस्तेमाल करने के लिए Login करें
      </div>

      <div class="tabs">

        <button
          class="tab active"
          id="loginTab"
          onclick="showLogin()">
          Login
        </button>

        <button
          class="tab"
          id="signupTab"
          onclick="showSignup()">
          Sign Up
        </button>

      </div>


      <!-- LOGIN FORM -->

      <form id="loginForm" class="auth-form">

        <label>Email</label>

        <input
          id="loginEmail"
          type="email"
          placeholder="अपना Email डालें"
          autocomplete="email"
          required
        >

        <label>Password</label>

        <input
          id="loginPassword"
          type="password"
          placeholder="अपना Password डालें"
          autocomplete="current-password"
          required
        >

        <button
          id="loginBtn"
          class="auth-submit"
          type="submit">
          Login
        </button>

      </form>


      <!-- SIGN UP FORM -->

      <form
        id="signupForm"
        class="auth-form hidden">

        <label>Name</label>

        <input
          id="signupName"
          type="text"
          placeholder="अपना नाम डालें"
          autocomplete="name"
          required
        >

        <label>Email</label>

        <input
          id="signupEmail"
          type="email"
          placeholder="अपना Email डालें"
          autocomplete="email"
          required
        >

        <label>Password</label>

        <input
          id="signupPassword"
          type="password"
          placeholder="कम से कम 6 अक्षर"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          id="signupBtn"
          class="auth-submit"
          type="submit">
          Create Account
        </button>

      </form>


      <div
        id="authMessage"
        class="auth-message">
      </div>

    </div>

  </section>


  <!-- =========================
       BAATAI CHAT APP
  ========================= -->

  <div
    id="appScreen"
    class="app hidden">

    <aside
      id="sidebar"
      class="sidebar">

      <div class="logo">
        🤖 BaatAI
      </div>

      <button
        class="new-chat"
        onclick="newChat()">
        ＋ New Chat
      </button>

      <button
        class="logout-btn"
        onclick="logout()">
        🚪 Logout
      </button>

      <div
        id="userInfo"
        class="user-info">
      </div>

    </aside>


    <main class="main">

      <header class="header">

        <button
          class="menu-btn"
          onclick="toggleMenu()">
          ☰
        </button>

        <span>
          🤖 BaatAI
        </span>

      </header>


      <!-- CHAT -->

      <section
        id="chat"
        class="chat">

        <div
          id="welcome"
          class="welcome">

          <h1>Hello 👋</h1>

          <p>
            BaatAI से कुछ भी पूछिए...
          </p>

        </div>

      </section>


      <!-- INPUT -->

      <div class="input-area">

        <div class="input-box">

          <input
            id="messageInput"
            type="text"
            placeholder="अपना सवाल लिखें..."
            autocomplete="off"
          >

          <button
            id="sendBtn"
            onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

    </main>

  </div>


  <script>

    /* =========================
       API
    ========================= */

    const CHAT_API = "/api/chat";
    const LOGIN_API = "/api/login";
    const SIGNUP_API = "/api/signup";


    /* =========================
       ELEMENTS
    ========================= */

    const authScreen =
      document.getElementById("authScreen");

    const appScreen =
      document.getElementById("appScreen");

    const authMessage =
      document.getElementById("authMessage");

    const loginForm =
      document.getElementById("loginForm");

    const signupForm =
      document.getElementById("signupForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const input =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const chat =
      document.getElementById("chat");


    /* =========================
       START
    ========================= */

    window.addEventListener("load", function() {

      const savedUser =
        localStorage.getItem("baatai_user");

      if (savedUser) {

        try {

          const user =
            JSON.parse(savedUser);

          showApp(user);

        } catch {

          localStorage.removeItem("baatai_user");

        }

      }

    });


    /* =========================
       LOGIN TAB
    ========================= */

    function showLogin() {

      loginForm.classList.remove("hidden");

      signupForm.classList.add("hidden");

      document
        .getElementById("loginTab")
        .classList.add("active");

      document
        .getElementById("signupTab")
        .classList.remove("active");

      authMessage.textContent = "";
    }


    /* =========================
       SIGN UP TAB
    ========================= */

    function showSignup() {

      signupForm.classList.remove("hidden");

      loginForm.classList.add("hidden");

      document
        .getElementById("signupTab")
        .classList.add("active");

      document
        .getElementById("loginTab")
        .classList.remove("active");

      authMessage.textContent = "";
    }


    /* =========================
       SIGN UP
    ========================= */

    signupForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const name =
          document
            .getElementById("signupName")
            .value
            .trim();

        const email =
          document
            .getElementById("signupEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("signupPassword")
            .value;


        if (!name || !email || !password) {

          authMessage.textContent =
            "सभी जानकारी भरें।";

          return;
        }


        if (password.length < 6) {

          authMessage.textContent =
            "Password कम से कम 6 अक्षर का होना चाहिए।";

          return;
        }


        signupBtn.disabled = true;

        signupBtn.textContent =
          "Account बना रहा हूँ...";

        authMessage.textContent = "";


        try {

          const response =
            await fetch(
              SIGNUP_API,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  name: name,
                  email: email,
                  password: password
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Account बनाने में समस्या हुई।"
            );

          }


          /*
            Account successfully created.
            अब automatically Login करेंगे।
          */

          authMessage.style.color =
            "#16a34a";

          authMessage.textContent =
            "Account बन गया! Login किया जा रहा है...";


          const loginResponse =
            await fetch(
              LOGIN_API,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email: email,
                  password: password
                })
              }
            );


          const loginData =
            await loginResponse.json();


          if (!loginResponse.ok) {

            throw new Error(
              loginData.error ||
              "Login नहीं हो पाया।"
            );

          }


          saveUser(
            loginData.user
          );

          showApp(
            loginData.user
          );


        } catch (error) {

          console.error(
            "SIGNUP ERROR:",
            error
          );

          authMessage.style.color =
            "#dc2626";

          authMessage.textContent =
            error.message ||
            "Account बनाने में समस्या हुई।";

        }


        signupBtn.disabled = false;

        signupBtn.textContent =
          "Create Account";

      }
    );


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;


        if (!email || !password) {

          authMessage.style.color =
            "#dc2626";

          authMessage.textContent =
            "Email और Password डालें।";

          return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
          "Login हो रहा है...";

        authMessage.textContent = "";


        try {

          const response =
            await fetch(
              LOGIN_API,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email: email,
                  password: password
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Login में समस्या हुई।"
            );

          }


          saveUser(
            data.user
          );

          showApp(
            data.user
          );


        } catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );

          authMessage.style.color =
            "#dc2626";

          authMessage.textContent =
            error.message ||
            "Login में समस्या हुई।";

        }


        loginBtn.disabled = false;

        loginBtn.textContent =
          "Login";

      }
    );


    /* =========================
       SAVE USER
    ========================= */

    function saveUser(user) {

      localStorage.setItem(
        "baatai_user",
        JSON.stringify(user)
      );

    }


    /* =========================
       SHOW APP
    ========================= */

    function showApp(user) {

      authScreen.classList.add(
        "hidden"
      );

      appScreen.classList.remove(
        "hidden"
      );


      const userInfo =
        document.getElementById(
          "userInfo"
        );


      if (user && user.name) {

        userInfo.textContent =
          "👤 " + user.name;

      } else if (user && user.email) {

        userInfo.textContent =
          "👤 " + user.email;

      }


      input.focus();

    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

      localStorage.removeItem(
        "baatai_user"
      );

      appScreen.classList.add(
        "hidden"
      );

      authScreen.classList.remove(
        "hidden"
      );

      document
        .getElementById("loginEmail")
        .value = "";

      document
        .getElementById("loginPassword")
        .value = "";

      showLogin();

    }


    /* =========================
       THREE MENU
    ========================= */

    function toggleMenu() {

      const sidebar =
        document.getElementById(
          "sidebar"
        );

      sidebar.classList.toggle(
        "active"
      );

    }


    /* =========================
       ENTER KEY
    ========================= */

    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      const welcome =
        document.getElementById(
          "welcome"
        );


      if (welcome) {
        welcome.remove();
      }


      addMessage(
        message,
        "user"
      );


      input.value = "";

      sendBtn.disabled = true;


      const typing =
        addMessage(
          "🤖 सोच रहा हूँ...",
          "ai"
        );


      try {

        const response =
          await fetch(
            CHAT_API,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: message
              })
            }
          );


        const data =
          await response.json();


        typing.remove();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Server error"
          );

        }


        addMessage(
          data.reply ||
          "मुझे कोई जवाब नहीं मिला।",
          "ai"
        );


      } catch (error) {

        console.error(
          "CHAT ERROR:",
          error
        );

        typing.remove();


        addMessage(
          "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।",
          "ai"
        );

      }


      sendBtn.disabled = false;

      input.focus();

    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(
      text,
      type
    ) {

      const messageDiv =
        document.createElement(
          "div"
        );


      messageDiv.className =
        "message " + type;


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      bubble.textContent =
        text;


      messageDiv.appendChild(
        bubble
      );


      chat.appendChild(
        messageDiv
      );


      chat.scrollTop =
        chat.scrollHeight;


      return messageDiv;

    }


    /* =========================
       NEW CHAT
    ========================= */

    function newChat() {

      chat.innerHTML = `

        <div
          class="welcome"
          id="welcome">

          <h1>Hello 👋</h1>

          <p>

function showLogin() {
  document.getElementById("signupForm").style.display = "none";
  document.getElementById("loginForm").style.display = "block";
  clearAuthMessage();
}

function showSignup() {
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("signupForm").style.display = "block";
  clearAuthMessage();
}

function showAuthMessage(message) {
  const box = document.getElementById("authMessage");

  box.textContent = message;
  box.style.display = "block";
}

function clearAuthMessage() {
  const box = document.getElementById("authMessage");

  box.textContent = "";
  box.style.display = "none";
}


async function signupUser() {

  clearAuthMessage();

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if (!name || !email || !password) {
    showAuthMessage(
      "कृपया Name, Email और Password भरें।"
    );
    return;
  }

  if (password.length < 6) {
    showAuthMessage(
      "Password कम से कम 6 अक्षर का होना चाहिए।"
    );
    return;
  }

  try {

    const response = await fetch("/api/signup", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        name,
        email,
        password
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Sign Up failed"
      );
    }

    alert(
      "Account बन गया! अब Login करें। ✅"
    );

    document.getElementById("loginEmail").value = email;

    showLogin();

  } catch (error) {

    showAuthMessage(error.message);

  }
}


async function loginUser() {

  clearAuthMessage();

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!email || !password) {
    showAuthMessage(
      "Email और Password डालें।"
    );
    return;
  }

  try {

    const response = await fetch("/api/login", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        email,
        password
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Login failed"
      );
    }

    document.getElementById(
      "authScreen"
    ).style.display = "none";

    alert(
      "Login successful! 🎉"
    );

  } catch (error) {

    showAuthMessage(error.message);

  }
}
