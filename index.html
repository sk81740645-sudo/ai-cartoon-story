<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="BaatAI - AI Assistant for students and everyone">
<title>BaatAI - AI Assistant</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#050505;
  color:#fff;
}

button,
textarea,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* BACKGROUND */

#bgVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
  opacity:.18;
}

.videoOverlay{
  position:fixed;
  inset:0;
  background:
    linear-gradient(
      rgba(0,0,0,.82),
      rgba(0,0,0,.92)
    );
  z-index:-2;
}

/* APP */

.app{
  width:100%;
  height:100%;
  display:flex;
  position:relative;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  height:100%;
  background:rgba(8,8,8,.96);
  border-right:1px solid rgba(0,255,255,.15);
  padding:15px;
  display:flex;
  flex-direction:column;
  position:fixed;
  left:-280px;
  top:0;
  z-index:100;
  transition:.25s ease;
  box-shadow:0 0 30px rgba(0,255,255,.08);
}

.sidebar.open{
  left:0;
}

.sidebarTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.logoSmall{
  color:#00ffff;
  font-size:21px;
  font-weight:bold;
}

.closeSidebar{
  background:none;
  border:0;
  color:#fff;
  font-size:25px;
}

.newChatBtn{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(0,255,255,.35);
  background:rgba(0,255,255,.08);
  color:#fff;
  font-size:15px;
  margin-bottom:12px;
}

.newChatBtn:hover{
  background:rgba(0,255,255,.16);
}

.historyTitle{
  color:#888;
  font-size:12px;
  margin:10px 4px;
  text-transform:uppercase;
}

.history{
  flex:1;
  overflow-y:auto;
}

.historyItem{
  padding:11px;
  border-radius:10px;
  color:#ddd;
  margin-bottom:5px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.historyItem:hover{
  background:rgba(255,255,255,.08);
}

.sidebarBottom{
  border-top:1px solid rgba(255,255,255,.08);
  padding-top:10px;
}

.sideBtn{
  width:100%;
  border:0;
  background:transparent;
  color:#ddd;
  text-align:left;
  padding:11px;
  border-radius:9px;
  margin-bottom:3px;
}

.sideBtn:hover{
  background:rgba(255,255,255,.07);
}

/* MAIN */

.main{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:64px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
}

.headerLeft{
  display:flex;
  align-items:center;
  gap:12px;
}

.menuBtn{
  width:40px;
  height:40px;
  border-radius:10px;
  border:1px solid rgba(0,255,255,.2);
  background:rgba(255,255,255,.05);
  color:#fff;
  font-size:22px;
}

.brand{
  color:#00ffff;
  font-size:22px;
  font-weight:bold;
  text-shadow:0 0 12px rgba(0,255,255,.5);
}

.profileBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid rgba(0,255,255,.35);
  background:rgba(0,255,255,.08);
  color:#00ffff;
  font-weight:bold;
  font-size:16px;
}

/* CONTENT */

.content{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.welcome{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

.welcome h1{
  font-size:clamp(30px,7vw,55px);
  color:#fff;
  text-shadow:
    0 0 15px rgba(0,255,255,.3);
}

.welcome h1 span{
  color:#00ffff;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 130px;
  display:none;
}

.chat.show{
  display:block;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.messageBubble{
  max-width:min(80%,700px);
  padding:12px 15px;
  border-radius:15px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user .messageBubble{
  background:rgba(0,255,255,.12);
  border:1px solid rgba(0,255,255,.2);
}

.message.assistant .messageBubble{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.08);
}

/* IMAGE */

.messageImage{
  max-width:260px;
  max-height:260px;
  display:block;
  border-radius:12px;
  margin-top:8px;
}

/* TYPING */

.typing{
  display:none;
  max-width:850px;
  margin:0 auto 15px;
  color:#888;
  font-size:14px;
}

.typing.show{
  display:block;
}

/* INPUT AREA */

.inputArea{
  position:absolute;
  bottom:15px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  padding:0 12px;
  z-index:20;
}

.inputBox{
  width:min(850px,100%);
  min-height:58px;
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:8px;
  border:1px solid rgba(0,255,255,.2);
  border-radius:18px;
  background:rgba(15,15,15,.92);
  box-shadow:0 0 25px rgba(0,255,255,.07);
  backdrop-filter:blur(12px);
}

.iconBtn,
.sendBtn{
  width:40px;
  height:40px;
  flex-shrink:0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.iconBtn:hover{
  background:rgba(255,255,255,.1);
}

.sendBtn{
  background:#00ffff;
  color:#000;
  border-color:#00ffff;
  font-size:20px;
  font-weight:bold;
}

.sendBtn:hover{
  box-shadow:0 0 15px rgba(0,255,255,.5);
}

#imageInput{
  display:none;
}

#messageInput{
  flex:1;
  min-width:0;
  max-height:120px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:#fff;
  font-size:15px;
  line-height:22px;
  padding:9px 4px;
}

#messageInput::placeholder{
  color:#777;
}

/* CHATGPT STYLE MIC */

.micBtn{
  color:#fff;
  background:rgba(35,35,35,.85);
  border:1px solid rgba(255,255,255,.18);
}

.micBtn svg{
  width:21px;
  height:21px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.micBtn.listening{
  background:rgba(255,50,50,.18);
  border-color:#ff4444;
  color:#ff4444;
  animation:micPulse 1s infinite;
}

@keyframes micPulse{
  50%{
    box-shadow:0 0 15px rgba(255,60,60,.55);
  }
}

/* IMAGE PREVIEW */

.imagePreview{
  display:none;
  position:absolute;
  bottom:82px;
  width:min(850px,calc(100% - 24px));
  left:50%;
  transform:translateX(-50%);
  background:rgba(15,15,15,.95);
  border:1px solid rgba(0,255,255,.2);
  border-radius:14px;
  padding:8px;
  z-index:30;
}

.imagePreview.show{
  display:flex;
}

.imagePreview img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}

.removeImage{
  position:absolute;
  top:2px;
  left:68px;
  width:23px;
  height:23px;
  border-radius:50%;
  border:1px solid #555;
  background:#111;
  color:#fff;
}

/* AUTH */

.authOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:15px;
}

.authOverlay.show{
  display:flex;
}

.authBox{
  width:min(400px,100%);
  background:#101010;
  border:1px solid rgba(0,255,255,.25);
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 35px rgba(0,255,255,.12);
}

.authLogo{
  text-align:center;
  color:#00ffff;
  font-size:28px;
  font-weight:bold;
  margin-bottom:5px;
}

.authTitle{
  text-align:center;
  font-size:21px;
  margin-bottom:20px;
}

.authInput{
  width:100%;
  height:46px;
  margin-bottom:12px;
  padding:0 13px;
  border-radius:10px;
  border:1px solid #333;
  background:#080808;
  color:#fff;
  outline:none;
}

.authInput:focus{
  border-color:#00ffff;
}

.authSubmit{
  width:100%;
  height:46px;
  border:0;
  border-radius:10px;
  background:#00ffff;
  color:#000;
  font-weight:bold;
  font-size:15px;
}

.authSwitch{
  text-align:center;
  margin-top:15px;
  color:#888;
  font-size:14px;
}

.authSwitch button{
  border:0;
  background:none;
  color:#00ffff;
}

.authError{
  color:#ff5555;
  font-size:13px;
  min-height:18px;
  margin-bottom:8px;
  text-align:center;
}

/* PROFILE */

.profilePopup{
  position:fixed;
  top:60px;
  right:12px;
  width:220px;
  background:#111;
  border:1px solid rgba(0,255,255,.2);
  border-radius:14px;
  padding:14px;
  z-index:150;
  display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.profilePopup.show{
  display:block;
}

.profileName{
  font-weight:bold;
  color:#fff;
  margin-bottom:4px;
}

.profileEmail{
  color:#777;
  font-size:12px;
  word-break:break-all;
}

.logoutBtn{
  width:100%;
  margin-top:12px;
  padding:9px;
  border-radius:9px;
  border:1px solid rgba(255,70,70,.3);
  background:rgba(255,70,70,.08);
  color:#ff7777;
}

/* LOGIN BUTTON */

.loginHeaderBtn{
  padding:9px 14px;
  border-radius:10px;
  border:1px solid rgba(0,255,255,.3);
  background:rgba(0,255,255,.08);
  color:#00ffff;
  font-weight:bold;
}

/* LIGHT MODE */

body.light{
  background:#f5f5f5;
  color:#111;
}

body.light .header{
  background:rgba(255,255,255,.8);
  border-color:#ddd;
}

body.light .brand{
  color:#008b8b;
  text-shadow:none;
}

body.light .welcome h1{
  color:#111;
}

body.light .inputBox{
  background:rgba(255,255,255,.94);
  border-color:#ccc;
}

body.light #messageInput{
  color:#111;
}

body.light .sidebar{
  background:#fff;
  color:#111;
}

body.light .sideBtn,
body.light .historyItem{
  color:#222;
}

body.light .authBox{
  background:#fff;
  color:#111;
}

body.light .authInput{
  background:#f5f5f5;
  color:#111;
}

/* MOBILE */

@media(max-width:600px){

  .sidebar{
    width:85%;
    left:-90%;
  }

  .brand{
    font-size:19px;
  }

  .header{
    height:58px;
  }

  .welcome h1{
    font-size:34px;
  }

  .messageBubble{
    max-width:88%;
  }

  .inputArea{
    bottom:10px;
    padding:0 8px;
  }

  .inputBox{
    min-height:54px;
    border-radius:17px;
    padding:7px;
  }

  .iconBtn,
  .sendBtn{
    width:37px;
    height:37px;
  }

}

</style>
</head>

<body>

<video
  id="bgVideo"
  autoplay
  muted
  loop
  playsinline
>
  <source src="background.mp4" type="video/mp4">
</video>

<div class="videoOverlay"></div>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebarTop">
      <div class="logoSmall">BaatAI</div>

      <button
        class="closeSidebar"
        id="closeSidebar"
      >×</button>
    </div>

    <button
      class="newChatBtn"
      id="newChatBtn"
    >
      ＋ New Chat
    </button>

    <div class="historyTitle">
      Chat History
    </div>

    <div
      class="history"
      id="history"
    ></div>

    <div class="sidebarBottom">

      <button
        class="sideBtn"
        id="clearHistoryBtn"
      >
        🗑 Clear History
      </button>

      <button
        class="sideBtn"
        id="themeBtn"
      >
        ☀️ Light Mode
      </button>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="header">

      <div class="headerLeft">

        <button
          class="menuBtn"
          id="menuBtn"
          type="button"
        >
          ☰
        </button>

        <div class="brand">
          BaatAI
        </div>

      </div>

      <div id="authHeaderArea"></div>

    </header>

    <div class="content">

      <section
        class="welcome"
        id="welcome"
      >
        <h1>
          Welcome to <span>BaatAI</span>
        </h1>
      </section>

      <section
        class="chat"
        id="chat"
      ></section>

      <div
        class="typing"
        id="typing"
      >
        BaatAI is thinking...
      </div>

    </div>

    <!-- IMAGE PREVIEW -->

    <div
      class="imagePreview"
      id="imagePreview"
    >
      <img
        id="previewImage"
        src=""
        alt="Selected image"
      >

      <button
        class="removeImage"
        id="removeImage"
        type="button"
      >
        ×
      </button>
    </div>

    <!-- INPUT -->

    <div class="inputArea">

      <div class="inputBox">

        <button
          class="iconBtn"
          id="cameraBtn"
          title="Upload Image"
          type="button"
        >
          📷
        </button>

        <button
          class="iconBtn micBtn"
          id="micBtn"
          title="Voice Input"
          type="button"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect
              x="9"
              y="3"
              width="6"
              height="11"
              rx="3"
            ></rect>

            <path
              d="M5 11a7 7 0 0 0 14 0"
            ></path>

            <path
              d="M12 18v3"
            ></path>

            <path
              d="M8 21h8"
            ></path>
          </svg>
        </button>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
        >

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message BaatAI..."
          autocomplete="off"
        ></textarea>

        <button
          class="sendBtn"
          id="sendBtn"
          title="Send"
          type="button"
        >
          ➤
        </button>

      </div>

    </div>

  </main>

</div>

<!-- AUTH MODAL -->

<div
  class="authOverlay"
  id="authOverlay"
>

  <div class="authBox">

    <div class="authLogo">
      BaatAI
    </div>

    <div
      class="authTitle"
      id="authTitle"
    >
      Login
    </div>

    <div
      class="authError"
      id="authError"
    ></div>

    <div id="nameField"></div>

    <input
      class="authInput"
      id="authEmail"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      class="authInput"
      id="authPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="authSubmit"
      id="authSubmit"
      type="button"
    >
      Login
    </button>

    <div class="authSwitch">

      <span id="authSwitchText">
        Don't have an account?
      </span>

      <button
        id="authSwitchBtn"
        type="button"
      >
        Sign Up
      </button>

    </div>

  </div>

</div>

<!-- PROFILE POPUP -->

<div
  class="profilePopup"
  id="profilePopup"
>

  <div
    class="profileName"
    id="profileName"
  ></div>

  <div
    class="profileEmail"
    id="profileEmail"
  ></div>

  <button
    class="logoutBtn"
    id="logoutBtn"
  >
    Logout
  </button>

</div>

<script>
  /* =========================
   BAATAI APP - PART 2
========================= */

const sidebar =
  document.getElementById("sidebar");

const menuBtn =
  document.getElementById("menuBtn");

const closeSidebar =
  document.getElementById("closeSidebar");

const newChatBtn =
  document.getElementById("newChatBtn");

const clearHistoryBtn =
  document.getElementById("clearHistoryBtn");

const themeBtn =
  document.getElementById("themeBtn");

const history =
  document.getElementById("history");

const welcome =
  document.getElementById("welcome");

const chat =
  document.getElementById("chat");

const typing =
  document.getElementById("typing");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const imageInput =
  document.getElementById("imageInput");

const micBtn =
  document.getElementById("micBtn");

const imagePreview =
  document.getElementById("imagePreview");

const previewImage =
  document.getElementById("previewImage");

const removeImage =
  document.getElementById("removeImage");

const authOverlay =
  document.getElementById("authOverlay");

const authTitle =
  document.getElementById("authTitle");

const authSubmit =
  document.getElementById("authSubmit");

const authSwitchBtn =
  document.getElementById("authSwitchBtn");

const authSwitchText =
  document.getElementById("authSwitchText");

const authEmail =
  document.getElementById("authEmail");

const authPassword =
  document.getElementById("authPassword");

const authError =
  document.getElementById("authError");

const nameField =
  document.getElementById("nameField");

const authHeaderArea =
  document.getElementById("authHeaderArea");

const profilePopup =
  document.getElementById("profilePopup");

const profileName =
  document.getElementById("profileName");

const profileEmail =
  document.getElementById("profileEmail");

const logoutBtn =
  document.getElementById("logoutBtn");


/* =========================
   VARIABLES
========================= */

let currentChatId =
  null;

let currentChatTitle =
  "New Chat";

let selectedImage =
  null;

let authMode =
  "login";

let currentUser =
  null;

let isSending =
  false;


/* =========================
   LOCAL STORAGE
========================= */

function getLocalChats(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "baatai_chats"
      ) || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveLocalChats(chats){

  localStorage.setItem(
    "baatai_chats",
    JSON.stringify(chats)
  );

}


/* =========================
   USER SESSION
========================= */

function getSavedUser(){

  try{

    const user =
      JSON.parse(
        localStorage.getItem(
          "baatai_user"
        )
      );

    return user || null;

  }catch(error){

    return null;

  }

}


function saveUser(user){

  currentUser =
    user;

  localStorage.setItem(
    "baatai_user",
    JSON.stringify(user)
  );

}


function removeUser(){

  currentUser =
    null;

  localStorage.removeItem(
    "baatai_user"
  );

}


/* =========================
   SIDEBAR
========================= */

menuBtn.onclick =
  function(){

    sidebar.classList.add(
      "open"
    );

  };


closeSidebar.onclick =
  function(){

    sidebar.classList.remove(
      "open"
    );

  };


/* =========================
   THEME
========================= */

themeBtn.onclick =
  function(){

    document.body.classList.toggle(
      "light"
    );

    const light =
      document.body.classList.contains(
        "light"
      );

    localStorage.setItem(
      "baatai_theme",
      light
        ? "light"
        : "dark"
    );

    themeBtn.textContent =
      light
        ? "🌙 Dark Mode"
        : "☀️ Light Mode";

  };


function loadTheme(){

  const theme =
    localStorage.getItem(
      "baatai_theme"
    );

  if(theme === "light"){

    document.body.classList.add(
      "light"
    );

    themeBtn.textContent =
      "🌙 Dark Mode";

  }

}


/* =========================
   NEW CHAT
========================= */

function startNewChat(){

  currentChatId =
    Date.now().toString();

  currentChatTitle =
    "New Chat";

  chat.innerHTML =
    "";

  chat.classList.remove(
    "show"
  );

  welcome.style.display =
    "flex";

  selectedImage =
    null;

  imageInput.value =
    "";

  imagePreview.classList.remove(
    "show"
  );

  messageInput.value =
    "";

  messageInput.focus();

  sidebar.classList.remove(
    "open"
  );

}


newChatBtn.onclick =
  function(){

    startNewChat();

  };


/* =========================
   CLEAR HISTORY
========================= */

clearHistoryBtn.onclick =
  function(){

    const ok =
      confirm(
        "Kya aap puri chat history delete karna chahte hain?"
      );

    if(!ok) return;

    localStorage.removeItem(
      "baatai_chats"
    );

    currentChatId =
      null;

    currentChatTitle =
      "New Chat";

    chat.innerHTML =
      "";

    chat.classList.remove(
      "show"
    );

    welcome.style.display =
      "flex";

    renderHistory();

  };


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  role,
  text,
  imageData = null
){

  welcome.style.display =
    "none";

  chat.classList.add(
    "show"
  );

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " + role;

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "messageBubble";

  if(text){

    const textNode =
      document.createTextNode(
        text
      );

    bubble.appendChild(
      textNode
    );

  }

  if(imageData){

    const img =
      document.createElement(
        "img"
      );

    img.src =
      imageData;

    img.className =
      "messageImage";

    bubble.appendChild(
      img
    );

  }

  message.appendChild(
    bubble
  );

  chat.appendChild(
    message
  );

  chat.scrollTop =
    chat.scrollHeight;

}

/* =========================
   HISTORY
========================= */

function renderHistory(){

  const chats =
    getLocalChats();

  history.innerHTML =
    "";

  chats
    .slice()
    .reverse()
    .forEach(
      function(item){

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "historyItem";

        div.textContent =
          item.title ||
          "New Chat";

        div.onclick =
          function(){

            openLocalChat(
              item.id
            );

          };

        history.appendChild(
          div
        );

      }
    );

}


/* =========================
   SAVE CURRENT CHAT
========================= */

function saveCurrentChat(){

  if(!currentChatId)
    return;

  const chats =
    getLocalChats();

  const existing =
    chats.find(
      function(item){

        return item.id ===
          currentChatId;

      }
    );

  if(existing){

    existing.title =
      currentChatTitle;

    existing.messages =
      Array.from(
        chat.querySelectorAll(
          ".message"
        )
      ).map(
        function(message){

          const role =
            message.classList.contains(
              "user"
            )
              ? "user"
              : "assistant";

          return {
            role:role,
            text:
              message
                .querySelector(
                  ".messageBubble"
                )
                ?.innerText || ""
          };

        }
      );

    existing.updatedAt =
      Date.now();

  }else{

    chats.push({

      id:
        currentChatId,

      title:
        currentChatTitle,

      messages:
        Array.from(
          chat.querySelectorAll(
            ".message"
          )
        ).map(
          function(message){

            const role =
              message.classList.contains(
                "user"
              )
                ? "user"
                : "assistant";

            return {
              role:role,
              text:
                message
                  .querySelector(
                    ".messageBubble"
                  )
                  ?.innerText || ""
            };

          }
        ),

      updatedAt:
        Date.now()

    });

  }

  saveLocalChats(
    chats
  );

  renderHistory();

}


/* =========================
   OPEN LOCAL CHAT
========================= */

function openLocalChat(
  id
){

  const chats =
    getLocalChats();

  const selected =
    chats.find(
      function(item){

        return item.id === id;

      }
    );

  if(!selected)
    return;

  currentChatId =
    selected.id;

  currentChatTitle =
    selected.title ||
    "New Chat";

  chat.innerHTML =
    "";

  welcome.style.display =
    "none";

  chat.classList.add(
    "show"
  );

  if(
    Array.isArray(
      selected.messages
    )
  ){

    selected.messages.forEach(
      function(message){

        addMessage(
          message.role,
          message.text
        );

      }
    );

  }

  sidebar.classList.remove(
    "open"
  );

  chat.scrollTop =
    chat.scrollHeight;

}

  /* =========================
   AUTH SUBMIT
========================= */

authSubmit.onclick =
  async function(){

    const email =
      authEmail.value.trim();

    const password =
      authPassword.value.trim();

    authError.textContent =
      "";

    if(!email){

      authError.textContent =
        "Email डालिए।";

      return;

    }

    if(!password){

      authError.textContent =
        "Password डालिए।";

      return;

    }

    if(password.length < 6){

      authError.textContent =
        "Password कम से कम 6 characters का होना चाहिए।";

      return;

    }


    /* =====================
       SIGN UP
    ===================== */

    if(authMode === "signup"){

      const nameInput =
        document.getElementById(
          "authName"
        );

      const name =
        nameInput
          ? nameInput.value.trim()
          : "";

      if(!name){

        authError.textContent =
          "अपना नाम डालिए।";

        return;

      }

      try{

        authSubmit.disabled =
          true;

        authSubmit.textContent =
          "Creating...";


        const response =
          await fetch(
            "/api/signup",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:JSON.stringify({

                name:name,

                email:email,

                password:password

              })

            }
          );


        const data =
          await response.json();


        if(!response.ok){

          throw new Error(
            data.message ||
            data.error ||
            "Sign Up failed."
          );

        }


        /*
          कुछ server signup के बाद
          सीधे user return करते हैं,
          कुछ नहीं।
        */

        if(data.user){

          saveUser(
            data.user
          );

          closeAuth();

          updateAuthHeader();

          return;

        }


        /*
          अगर signup successful है
          लेकिन login नहीं हुआ,
          तो Login screen खोलें।
        */

        authError.style.color =
          "#00ff99";

        authError.textContent =
          "Account बन गया! अब Login करें।";

        setTimeout(
          function(){

            authError.style.color =
              "#ff5555";

            openAuth(
              "login"
            );

          },
          1000
        );


      }catch(error){

        console.error(
          "SIGNUP ERROR:",
          error
        );

        authError.textContent =
          error.message ||
          "Sign Up में समस्या हुई।";

      }finally{

        authSubmit.disabled =
          false;

        authSubmit.textContent =
          "Sign Up";

      }

      return;

    }


    /* =====================
       LOGIN
    ===================== */

    try{

      authSubmit.disabled =
        true;

      authSubmit.textContent =
        "Logging in...";


      const response =
        await fetch(
          "/api/login",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              email:email,

              password:password

            })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.message ||
          data.error ||
          "Login failed."
        );

      }


      /*
        Server से user object
        प्राप्त करें।
      */

      const user =
        data.user ||
        data;


      if(
        !user ||
        !user.email
      ){

        throw new Error(
          "Login response में user information नहीं मिली।"
        );

      }


      saveUser(
        user
      );


      closeAuth();

      updateAuthHeader();

      profilePopup.classList.remove(
        "show"
      );


      /*
        Login के बाद नया chat
        शुरू करें।
      */

      startNewChat();


    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );

      authError.textContent =
        error.message ||
        "Login में समस्या हुई।";

    }finally{

      authSubmit.disabled =
        false;

      authSubmit.textContent =
        authMode === "signup"
          ? "Sign Up"
          : "Login";

    }

  };

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(isSending)
    return;


  const text =
    messageInput.value.trim();


  /*
    Text और image दोनों खाली हैं
    तो message send नहीं होगा।
  */

  if(
    !text &&
    !selectedImage
  ){

    return;

  }


  isSending =
    true;

  sendBtn.disabled =
    true;


  /*
    पहली message से chat title
    बनाना
  */

  if(
    currentChatTitle ===
    "New Chat"
  ){

    if(text){

      currentChatTitle =
        text.length > 35
          ? text.substring(0,35) + "..."
          : text;

    }else{

      currentChatTitle =
        "Image Chat";

    }

  }


  /*
    User message दिखाएँ
  */

  addMessage(
    "user",
    text,
    selectedImage
  );


  const imageToSend =
    selectedImage;


  /*
    Input साफ करें
  */

  messageInput.value =
    "";

  messageInput.style.height =
    "auto";


  selectedImage =
    null;

  imageInput.value =
    "";

  previewImage.src =
    "";

  imagePreview.classList.remove(
    "show"
  );


  showTyping();


  try{

    /*
      Current conversation तैयार करें
    */

    const conversation =
      Array.from(
        chat.querySelectorAll(
          ".message"
        )
      )
      .map(
        function(message){

          const role =
            message.classList.contains(
              "user"
            )
              ? "user"
              : "assistant";

          const bubble =
            message.querySelector(
              ".messageBubble"
            );

          return {

            role:role,

            content:
              bubble
                ? bubble.innerText
                : ""

          };

        }
      )
      .filter(
        function(item){

          return item.content
            .trim()
            .length > 0;

        }
      )
      .slice(-20);


    /*
      BaatAI backend
    */

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:
              text,

            image:
              imageToSend,

            conversation:
              conversation

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        "AI response failed."
      );

    }


    if(
      !data.success
    ){

      throw new Error(
        data.message ||
        "AI response नहीं मिला।"
      );

    }


    hideTyping();


    /*
      AI का जवाब
    */

    addMessage(
      "assistant",
      data.reply ||
      "मुझे कोई जवाब नहीं मिला।"
    );


    /*
      Local history save
    */

    saveCurrentChat();


  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );

    hideTyping();

    addMessage(
      "assistant",
      "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।"
    );

  }finally{

    isSending =
      false;

    sendBtn.disabled =
      false;

    messageInput.focus();

  }

}
  /* =========================
   SEND BUTTON
========================= */

sendBtn.onclick =
  function(){

    sendMessage();

  };


/* =========================
   ENTER TO SEND
========================= */

messageInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey

      event.preventDefault();

);


/* =========================
   MICROPHONE
========================= */

let recognition =
  null;

let isListening =
  false;


if(
  "SpeechRecognition" in window ||
  "webkitSpeechRecognition" in window
){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  recognition =
    new SpeechRecognition();


  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.lang =
    "en-IN";


  /* =====================
     MIC START
  ===================== */

  recognition.onstart =
    function(){

      isListening =
        true;

      micBtn.classList.add(
        "listening"
      );

    };


  /* =====================
     MIC END
  ===================== */

  recognition.onend =
    function(){

      isListening =
        false;

      micBtn.classList.remove(
        "listening"
      );

    };


  /* =====================
     MIC ERROR
  ===================== */

  recognition.onerror =
    function(event){

      console.log(
        "Microphone error:",
        event.error
      );

      isListening =
        false;

      micBtn.classList.remove(
        "listening"
      );

    };


  /* =====================
     SPEECH RESULT
  ===================== */

  recognition.onresult =
    function(event){

      const result =
        event
          .results[0][0]
          .transcript;


      messageInput.value +=
        (
          messageInput.value
            ? " "
            : ""
        ) + result;


      messageInput.dispatchEvent(
        new Event(
          "input"
        )
      );


      messageInput.focus();

    };


  /* =====================
     MIC BUTTON
  ===================== */

  micBtn.onclick =
    function(){

      if(isListening){

        recognition.stop();

        return;

      }


      try{

        recognition.start();

      }catch(error){

        console.log(
          "Mic start error:",
          error
        );

      }

    };

}else{

  micBtn.onclick =
    function(){

      alert(
        "Voice input आपके browser में supported नहीं है। Chrome browser में try करें।"
      );

    };

}
