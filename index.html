<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>BaatAI</title>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#02070a;
  color:#ffffff;
}

/* =========================
   APP
========================= */

.app{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100vh;
  overflow:hidden;
}

/* =========================
   BACKGROUND VIDEO
========================= */

#bgVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  background:#02070a;
}

/* =========================
   VIDEO OVERLAY
========================= */

.videoOverlay{
  position:absolute;
  inset:0;
  z-index:1;

  background:
    linear-gradient(
      to bottom,
      rgba(0,5,8,.42),
      rgba(0,8,12,.62)
    );

  pointer-events:none;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  top:0;
  left:-280px;

  width:270px;
  height:100dvh;

  z-index:100;

  padding:18px;

  background:rgba(2,12,16,.97);

  border-right:
    1px solid rgba(0,229,255,.7);

  box-shadow:
    8px 0 30px rgba(0,229,255,.12);

  transition:left .3s ease;

  overflow-y:auto;
}

.sidebar.open{
  left:0;
}

.sidebarLogo{
  font-size:23px;
  font-weight:bold;
  margin-bottom:22px;
}

.sidebarLogo span{
  color:#00e5ff;
}

.menuItem{
  width:100%;

  padding:12px;

  margin-bottom:9px;

  border:
    1px solid rgba(0,229,255,.35);

  border-radius:11px;

  background:
    rgba(0,30,38,.65);

  color:white;

  text-align:left;

  font-size:15px;

  cursor:pointer;
}

.menuItem:active{
  background:
    rgba(0,229,255,.2);
}

.historyTitle{
  margin:22px 0 10px;

  color:#00e5ff;

  font-size:13px;

  font-weight:bold;
}

.history{
  max-height:55vh;
  overflow-y:auto;
}

.historyItem{
  padding:10px;

  margin-bottom:7px;

  border-radius:8px;

  background:
    rgba(255,255,255,.06);

  color:#e7e7e7;

  font-size:14px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  cursor:pointer;
}

/* =========================
   HEADER
========================= */

.header{
  position:relative;

  z-index:10;

  width:100%;
  height:72px;

  display:flex;

  align-items:center;

  padding:0 12px;

  border-bottom:
    1px solid rgba(0,229,255,.28);

  background:
    rgba(0,7,10,.55);

  backdrop-filter:blur(8px);
}

.menuBtn{
  width:40px;
  height:40px;

  border:0;

  background:transparent;

  color:white;

  font-size:29px;

  cursor:pointer;

  flex-shrink:0;
}

.brand{
  display:flex;

  align-items:center;

  gap:8px;

  flex:1;

  min-width:0;
}

.robot{
  font-size:29px;
}

.brandName{
  font-size:22px;

  font-weight:bold;

  line-height:1.1;
}

.brandSub{
  font-size:12px;

  color:#00e5ff;

  margin-top:2px;
}

.lightBtn{
  height:40px;

  padding:0 11px;

  border:
    1px solid #00e5ff;

  border-radius:12px;

  background:
    rgba(0,30,38,.6);

  color:white;

  font-size:13px;

  cursor:pointer;

  flex-shrink:0;
}

.profileBtn{
  width:40px;
  height:40px;

  margin-left:7px;

  border-radius:50%;

  border:
    1px solid #00e5ff;

  background:
    rgba(0,60,70,.65);

  color:white;

  font-size:16px;

  cursor:pointer;

  flex-shrink:0;
}

/* =========================
   MAIN
========================= */

.main{
  position:relative;

  z-index:2;

  width:100%;

  height:
    calc(100dvh - 72px);

  display:flex;

  flex-direction:column;
}

/* =========================
   WELCOME
========================= */

.welcome{
  flex-shrink:0;

  text-align:center;

  padding:18px 10px 8px;
}

.welcome h1{
  display:inline-block;

  color:#00e5ff;

  font-size:24px;

  font-weight:bold;

  text-shadow:
    0 0 12px rgba(0,229,255,.45);
}

.welcomeLine{
  display:inline-block;

  width:38px;

  height:1px;

  margin:0 8px 7px;

  background:#00e5ff;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;

  width:100%;

  overflow-y:auto;

  padding:
    5px 14px 115px;

  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:#00bcd4;
  border-radius:10px;
}

/* =========================
   MESSAGES
========================= */

.message{
  display:flex;

  width:100%;

  margin:10px 0;
}

.message.user{
  justify-content:flex-end;
}

.message.bot{
  justify-content:flex-start;
}

.bubble{
  max-width:86%;

  padding:13px 16px;

  border-radius:19px;

  font-size:16px;

  line-height:1.5;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
}

.user .bubble{
  border:
    1px solid #00e5ff;

  background:
    rgba(0,50,58,.65);

  border-top-right-radius:5px;
}

.bot .bubble{
  border:
    1px solid rgba(0,229,255,.6);

  background:
    rgba(0,20,25,.7);

  border-top-left-radius:5px;
}

/* =========================
   FIRST WELCOME MESSAGE
========================= */

.welcomeMessage{
  width:100%;

  max-width:600px;

  margin:18px auto 10px;

  padding:18px;

  border:
    1px solid rgba(0,229,255,.6);

  border-radius:18px;

  background:
    rgba(0,20,25,.68);

  font-size:16px;

  line-height:1.55;
}

.uploadedImage{
  display:block;

  width:auto;

  max-width:220px;

  max-height:220px;

  border-radius:12px;

  border:
    1px solid #00e5ff;

  margin-bottom:7px;
}
/* =========================
   TYPING INDICATOR
========================= */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:7px;
  height:7px;

  background:#00e5ff;

  border-radius:50%;

  animation:
    typing 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes typing{

  0%,60%,100%{
    transform:translateY(0);
    opacity:.5;
  }

  30%{
    transform:translateY(-5px);
    opacity:1;
  }

}


/* =========================
   INPUT AREA
========================= */

.inputArea{
  position:absolute;

  z-index:20;

  left:0;
  right:0;
  bottom:0;

  width:100%;

  padding:
    7px 10px
    max(10px, env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      rgba(0,8,12,.96) 42%
    );

  pointer-events:none;
}

.inputBox{
  width:100%;

  max-width:760px;

  min-height:58px;

  margin:auto;

  display:flex;

  align-items:center;

  gap:5px;

  padding:5px 6px;

  border:
    1px solid #00e5ff;

  border-radius:30px;

  background:
    rgba(0,20,25,.86);

  box-shadow:
    0 0 18px
    rgba(0,229,255,.09);

  backdrop-filter:blur(10px);

  pointer-events:auto;
}


/* =========================
   CAMERA + MIC
========================= */

.iconBtn{
  width:44px;
  height:44px;

  flex:0 0 44px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid #00e5ff;

  border-radius:50%;

  background:
    rgba(0,45,55,.75);

  color:#00e5ff;

  font-size:19px;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.iconBtn:active{
  transform:scale(.94);

  background:
    rgba(0,229,255,.2);
}

.micBtn{
  margin:0;
}


/* =========================
   TEXT INPUT
========================= */

#messageInput{
  flex:1;

  width:100%;

  min-width:0;

  height:40px;

  max-height:100px;

  resize:none;

  overflow-y:auto;

  border:0;

  outline:0;

  background:transparent;

  color:white;

  padding:
    9px 5px;

  font-size:16px;

  line-height:22px;
}

#messageInput::placeholder{
  color:#9eadaf;
}

#messageInput::-webkit-scrollbar{
  width:3px;
}


/* =========================
   SEND BUTTON
========================= */

.sendBtn{
  width:46px;
  height:46px;

  flex:0 0 46px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:0;

  border-radius:50%;

  background:#ffffff;

  color:#001014;

  font-size:23px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 0 8px
    rgba(255,255,255,.18);

  transition:
    transform .15s ease;
}

.sendBtn:active{
  transform:scale(.91);
}


/* =========================
   HIDDEN IMAGE INPUT
========================= */

#imageInput{
  display:none;
}


/* =========================
   PROFILE POPUP
========================= */

.profilePopup{
  position:fixed;

  z-index:80;

  top:64px;

  right:12px;

  width:205px;

  padding:15px;

  border:
    1px solid #00e5ff;

  border-radius:14px;

  background:
    rgba(0,15,20,.97);

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.35);

  display:none;
}

.profilePopup.show{
  display:block;
}

.profilePopup h3{
  color:#00e5ff;

  font-size:16px;

  margin-bottom:7px;
}

.profilePopup p{
  color:#ddd;

  font-size:13px;

  margin-bottom:8px;
}

.closePopup{
  width:100%;

  padding:9px;

  border:
    1px solid #00e5ff;

  border-radius:9px;

  background:transparent;

  color:white;

  font-size:13px;

  cursor:pointer;
}


/* =========================
   LIGHT MODE
========================= */

body.light{
  background:#f5fafa;

  color:#111;
}

body.light .videoOverlay{
  background:
    rgba(255,255,255,.72);
}

body.light .header{
  background:
    rgba(255,255,255,.82);

  border-bottom-color:
    rgba(0,120,140,.25);
}

body.light .brandName,
body.light .menuBtn{
  color:#111;
}

body.light .lightBtn{
  color:#111;

  background:
    rgba(255,255,255,.75);
}

body.light .bubble,
body.light .welcomeMessage{
  color:#111;

  background:
    rgba(255,255,255,.78);
}

body.light #messageInput{
  color:#111;
}

body.light #messageInput::placeholder{
  color:#667;
}

body.light .inputBox{
  background:
    rgba(255,255,255,.88);
}

body.light .inputArea{
  background:
    linear-gradient(
      transparent,
      rgba(255,255,255,.96) 42%
    );
}

body.light .sidebar{
  background:
    rgba(248,252,253,.98);

  color:#111;
}

body.light .menuItem{
  color:#111;

  background:
    rgba(220,245,248,.7);
}

body.light .historyItem{
  color:#222;

  background:
    rgba(0,0,0,.05);
}

body.light .profilePopup{
  background:
    rgba(250,255,255,.98);

  color:#111;
}

body.light .profilePopup p{
  color:#333;
}

body.light .closePopup{
  color:#111;
}


/* =========================
   MOBILE COMPACT
========================= */

@media(max-width:700px){

  .header{
    height:64px;

    padding:
      0 9px;
  }

  .menuBtn{
    width:38px;
    height:38px;

    font-size:27px;
  }

  .robot{
    font-size:25px;
  }

  .brand{
    gap:6px;
  }

  .brandName{
    font-size:20px;
  }

  .brandSub{
    font-size:10px;
  }

  .lightBtn{
    height:37px;

    padding:
      0 9px;

    border-radius:10px;

    font-size:12px;
  }

  .profileBtn{
    width:37px;
    height:37px;

    margin-left:5px;

    font-size:14px;
  }


  .main{
    height:
      calc(100dvh - 64px);
  }


  .welcome{
    padding:
      13px 8px 5px;
  }

  .welcome h1{
    font-size:21px;
  }

  .welcomeLine{
    width:30px;

    margin:
      0 6px 6px;
  }


  .chat{
    padding:
      3px 10px 100px;
  }

  .message{
    margin:
      7px 0;
  }

  .bubble{
    max-width:88%;

    padding:
      11px 13px;

    border-radius:16px;

    font-size:15px;

    line-height:1.45;
  }

  .welcomeMessage{
    max-width:100%;

    margin:
      12px auto 8px;

    padding:
      14px;

    border-radius:16px;

    font-size:15px;

    line-height:1.5;
  }


  .inputArea{
    padding:
      5px 7px
      max(8px, env(safe-area-inset-bottom));
  }

  .inputBox{
    min-height:54px;

    padding:
      4px 5px;

    gap:3px;

    border-radius:28px;
  }

  .iconBtn{
    width:40px;
    height:40px;

    flex-basis:40px;

    font-size:17px;
  }

  #messageInput{
    height:38px;

    padding:
      8px 4px;

    font-size:15px;

    line-height:20px;
  }

  .sendBtn{
    width:42px;
    height:42px;

    flex-basis:42px;

    font-size:21px;
  }

  .profilePopup{
    top:58px;

    right:8px;

    width:190px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- ================= VIDEO BACKGROUND ================= -->

  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>

  <div class="videoOverlay"></div>


  <!-- ================= SIDEBAR ================= -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebarTop">

      <button class="newChatBtn" id="newChatBtn">
        ＋ New Chat
      </button>

      <button class="menuItem" id="clearHistoryBtn">
        🗑️ Clear History
      </button>

      <button class="menuItem" id="themeMenuBtn">
        ☀️ Light / Dark
      </button>

    </div>

    <div class="historyTitle">
      Chat History
    </div>

    <div id="historyList" class="historyList"></div>

  </aside>


  <!-- ================= HEADER ================= -->

  <header class="header">

    <button class="menuBtn" id="menuBtn">
      ☰
    </button>

    <div class="brand">

      <div class="robot">
        🤖
      </div>

      <div>
        <div class="brandName">
          BaatAI
        </div>

        <div class="brandSub">
          AI Study
        </div>
      </div>

    </div>


    <div class="headerRight">

      <button class="lightBtn" id="lightBtn">
        ☀️ Light
      </button>

      <button class="profileBtn" id="profileBtn">
        S
      </button>

    </div>

  </header>


  <!-- ================= MAIN ================= -->

  <main class="main">

    <!-- WELCOME -->

    <section class="welcome">

      <div class="welcomeLine"></div>

      <h1>
        Welcome
      </h1>

      <div class="welcomeLine"></div>

    </section>


    <!-- ================= CHAT ================= -->

    <section class="chat" id="chat">

      <div class="welcomeMessage">

        <strong>👋 Welcome to BaatAI</strong>

        <br><br>

        Ask me anything. I can help you with
        study, coding, ideas, stories and much more.

      </div>

    </section>


    <!-- ================= INPUT ================= -->

    <div class="inputArea">

      <div class="inputBox">

        <!-- CAMERA -->

        <button
          class="iconBtn"
          id="cameraBtn"
          title="Upload Image"
        >
          📷
        </button>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
        >


        <!-- TEXT -->

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message BaatAI..."
        ></textarea>


        <!-- MIC -->

        <button
          class="iconBtn micBtn"
          id="micBtn"
          title="Voice"
        >
          🎤
        </button>


        <!-- SEND -->

        <button
          class="sendBtn"
          id="sendBtn"
          title="Send"
        >
          ➤
        </button>

      </div>

    </div>

  </main>


  <!-- ================= PROFILE POPUP ================= -->

  <div class="profilePopup" id="profilePopup">

    <h3>
      👤 BaatAI User
    </h3>

    <p>
      Welcome to BaatAI AI Assistant.
    </p>

    <button
      class="closePopup"
      id="closePopup"
    >
      Close
    </button>

  </div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const menuBtn =
  document.getElementById("menuBtn");

const sidebar =
  document.getElementById("sidebar");

const lightBtn =
  document.getElementById("lightBtn");

const themeMenuBtn =
  document.getElementById("themeMenuBtn");

const profileBtn =
  document.getElementById("profileBtn");

const profilePopup =
  document.getElementById("profilePopup");

const closePopup =
  document.getElementById("closePopup");

const newChatBtn =
  document.getElementById("newChatBtn");

const clearHistoryBtn =
  document.getElementById("clearHistoryBtn");

const historyList =
  document.getElementById("historyList");

const chat =
  document.getElementById("chat");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const imageInput =
  document.getElementById("imageInput");


/* =====================================================
   SIDEBAR
===================================================== */

menuBtn.addEventListener("click", () => {

  sidebar.classList.toggle("open");

});


/* Close sidebar when clicking outside */

document.addEventListener("click", (e) => {

  if (
    sidebar.classList.contains("open") &&
    !sidebar.contains(e.target) &&
    !menuBtn.contains(e.target)
  ) {

    sidebar.classList.remove("open");

  }

});


/* =====================================================
   DARK / LIGHT MODE
===================================================== */

function updateThemeButton(){

  if(document.body.classList.contains("light")){

    lightBtn.innerHTML = "🌙 Dark";

  }else{

    lightBtn.innerHTML = "☀️ Light";

  }

}


function toggleTheme(){

  document.body.classList.toggle("light");

  const isLight =
    document.body.classList.contains("light");

  localStorage.setItem(
    "baatai-theme",
    isLight ? "light" : "dark"
  );

  updateThemeButton();

}


/* Load saved theme */

const savedTheme =
  localStorage.getItem("baatai-theme");

if(savedTheme === "light"){

  document.body.classList.add("light");

}

updateThemeButton();


lightBtn.addEventListener(
  "click",
  toggleTheme
);

themeMenuBtn.addEventListener(
  "click",
  toggleTheme
);


/* =====================================================
   PROFILE
===================================================== */

profileBtn.addEventListener("click", (e) => {

  e.stopPropagation();

  profilePopup.classList.toggle("show");

});


closePopup.addEventListener("click", () => {

  profilePopup.classList.remove("show");

});


document.addEventListener("click", (e) => {

  if(
    profilePopup.classList.contains("show") &&
    !profilePopup.contains(e.target) &&
    !profileBtn.contains(e.target)
  ){

    profilePopup.classList.remove("show");

  }

});


/* =====================================================
   CHAT HISTORY
===================================================== */

let chatHistory =
  JSON.parse(
    localStorage.getItem("baatai-history") || "[]"
  );


function saveHistory(){

  localStorage.setItem(
    "baatai-history",
    JSON.stringify(chatHistory)
  );

}


function renderHistory(){

  historyList.innerHTML = "";

  if(chatHistory.length === 0){

    historyList.innerHTML = `
      <div class="historyEmpty">
        No previous chats
      </div>
    `;

    return;

  }


  chatHistory
    .slice()
    .reverse()
    .forEach((item, index) => {

      const div =
        document.createElement("div");

      div.className = "historyItem";

      div.textContent =
        item.text.substring(0, 32) +
        (item.text.length > 32 ? "..." : "");

      div.addEventListener("click", () => {

        messageInput.value =
          item.text;

        sidebar.classList.remove("open");

        messageInput.focus();

      });

      historyList.appendChild(div);

    });

}


renderHistory();


/* =====================================================
   ADD HISTORY
===================================================== */

function addHistory(text){

  if(!text.trim()) return;

  chatHistory.push({

    text:text,

    time:Date.now()

  });


  if(chatHistory.length > 30){

    chatHistory =
      chatHistory.slice(-30);

  }


  saveHistory();

  renderHistory();

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

clearHistoryBtn.addEventListener("click", () => {

  const ok =
    confirm("Clear all chat history?");

  if(!ok) return;

  chatHistory = [];

  localStorage.r
