<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BaatAI - AI Assistant</title>

<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


/* =========================
   APP
========================= */

.app{
  width:100%;
  height:100vh;
  display:flex;
  position:relative;
  overflow:hidden;
  background:#f5f7fb;
}


/* =========================
   BACKGROUND VIDEO
========================= */

#bgVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  pointer-events:none;
}

.videoOverlay{
  position:fixed;
  inset:0;
  background:
    rgba(255,255,255,0.82);
  z-index:1;
  pointer-events:none;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:270px;
  height:100%;
  background:
    rgba(255,255,255,0.96);
  border-right:
    1px solid #e5e7eb;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:5;
  flex-shrink:0;
}

.sidebarTop{
  padding:18px;
  border-bottom:
    1px solid #eeeeee;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:700;
  color:#1769ff;
  margin-bottom:16px;
}

.logoIcon{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:#eef4ff;
  font-size:23px;
}

.newChatBtn{
  width:100%;
  border:none;
  border-radius:12px;
  padding:12px;
  background:#1769ff;
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.newChatBtn:hover{
  background:#0959e8;
}


/* =========================
   HISTORY
========================= */

.historyHeader{
  padding:
    18px 18px 10px;
  font-size:13px;
  color:#777;
  font-weight:600;
}

.historyList{
  flex:1;
  overflow-y:auto;
  padding:0 10px;
}

.historyItem{
  padding:12px;
  margin-bottom:5px;
  border-radius:10px;
  cursor:pointer;
}

.historyItem:hover{
  background:#f1f5ff;
}

.historyItem.active{
  background:#eaf1ff;
}

.historyTitle{
  font-size:14px;
  color:#222;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.historyTime{
  font-size:11px;
  color:#999;
  margin-top:4px;
}

.sidebarBottom{
  padding:14px;
  border-top:
    1px solid #eeeeee;
}

.clearHistoryBtn{
  width:100%;
  border:none;
  background:#f3f4f6;
  color:#444;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}


/* =========================
   MAIN
========================= */

.main{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:4;
  min-width:0;
}


/* =========================
   HEADER
========================= */

.header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:
    0 18px;
  background:
    rgba(255,255,255,0.92);
  border-bottom:
    1px solid #e5e7eb;
  flex-shrink:0;
}

.headerLeft{
  display:flex;
  align-items:center;
  gap:12px;
}

.menuBtn{
  display:none;
  border:none;
  background:transparent;
  font-size:25px;
  cursor:pointer;
}

.headerTitle{
  font-size:20px;
  font-weight:700;
  color:#222;
}

.headerSubtitle{
  font-size:12px;
  color:#888;
  margin-top:2px;
}

.profileBtn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:#1769ff;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}


/* =========================
   CHAT AREA
========================= */

.chat{
  flex:1;
  overflow-y:auto;
  padding:
    30px 20px 130px;
  scroll-behavior:smooth;
}

.welcome{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#333;
}

.welcomeIcon{
  width:75px;
  height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  background:#eaf1ff;
  font-size:42px;
  margin-bottom:18px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:8px;
}

.welcome p{
  color:#777;
}


/* =========================
   MESSAGES
========================= */

.message{
  max-width:800px;
  width:max-content;
  padding:12px 15px;
  margin:
    10px auto;
  border-radius:16px;
  line-height:1.55;
  font-size:15px;
  word-break:break-word;
}

.userMessage{
  margin-right:0;
  margin-left:auto;
  background:#1769ff;
  color:white;
  border-bottom-right-radius:5px;
}

.aiMessage{
  margin-left:0;
  margin-right:auto;
  background:white;
  color:#222;
  border:
    1px solid #e6e8ed;
  border-bottom-left-radius:5px;
}


/* =========================
   INPUT AREA
========================= */

.inputArea{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:
    14px 18px 20px;
  background:
    linear-gradient(
      to top,
      rgba(245,247,251,1),
      rgba(245,247,251,0.85),
      transparent
    );
}

.inputBox{
  max-width:900px;
  margin:auto;
  min-height:58px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px;
  background:white;
  border:
    1px solid #dfe3ea;
  border-radius:18px;
  box-shadow:
    0 5px 25px
    rgba(0,0,0,0.08);
}

.iconBtn,
.sendBtn{
  flex-shrink:0;
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.iconBtn{
  background:#f1f4f8;
  color:#333;
}

.iconBtn:hover{
  background:#e5eaf1;
}

.micBtn svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
}

.micBtn.active{
  background:#ff3b30;
  color:white;
}

.sendBtn{
  background:#1769ff;
  color:white;
  font-size:20px;
}

.sendBtn:hover{
  background:#0959e8;
}

#imageInput{
  display:none;
}

#messageInput{
  flex:1;
  border:none;
  outline:none;
  resize:none;
  min-height:42px;
  max-height:160px;
  padding:
    10px 6px;
  font-size:15px;
  font-family:inherit;
  background:transparent;
}


/* =========================
   IMAGE PREVIEW
========================= */

#imagePreview{
  max-width:900px;
  margin:
    0 auto 8px;
  display:none;
}


/* =========================
   PROFILE POPUP
========================= */

.profilePopup{
  position:absolute;
  top:62px;
  right:18px;
  width:260px;
  background:white;
  border:
    1px solid #e3e6eb;
  border-radius:14px;
  padding:18px;
  box-shadow:
    0 10px 35px
    rgba(0,0,0,0.15);
  z-index:20;
  display:none;
}

.profilePopup.show{
  display:block;
}

.profilePopup h3{
  margin-bottom:8px;
}

.profilePopup p{
  color:#777;
  font-size:14px;
  word-break:break-word;
}

.closePopup{
  margin-top:15px;
  width:100%;
  border:none;
  padding:9px;
  border-radius:9px;
  background:#f1f3f6;
  cursor:pointer;
}


/* =========================
   AUTH OVERLAY
========================= */

.authOverlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:
    rgba(10,20,40,0.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.authOverlay.show{
  display:flex;
}

.authBox{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:24px;
  padding:30px;
  box-shadow:
    0 20px 60px
    rgba(0,0,0,0.25);
  text-align:center;
}

.authLogo{
  width:68px;
  height:68px;
  margin:
    0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:#eaf1ff;
  font-size:38px;
}

.authTitle{
  font-size:25px;
  font-weight:700;
  color:#1d2433;
}

.authSubtitle{
  color:#777;
  font-size:14px;
  margin:
    7px 0 20px;
}

.authTabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.authTab{
  flex:1;
  border:none;
  padding:11px;
  border-radius:10px;
  background:#f1f3f7;
  cursor:pointer;
  font-weight:600;
}

.authTab.active{
  background:#1769ff;
  color:white;
}

.authInput{
  width:100%;
  height:48px;
  border:
    1px solid #dfe3ea;
  border-radius:11px;
  outline:none;
  padding:
    0 14px;
  margin-bottom:10px;
  font-size:14px;
}

.authInput:focus{
  border-color:#1769ff;
}

.authSubmit{
  width:100%;
  height:48px;
  border:none;
  border-radius:11px;
  background:#1769ff;
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:4px;
}

.authClose{
  width:100%;
  border:none;
  background:transparent;
  color:#777;
  padding:12px;
  cursor:pointer;
}

.authMessage{
  min-height:20px;
  margin-bottom:8px;
  font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    bottom:0;
    z-index:50;
    transition:
      left 0.25s ease;
    box-shadow:
      5px 0 25px
      rgba(0,0,0,0.15);
  }

  .sidebar.open{
    left:0;
  }

  .menuBtn{
    display:block;
  }

  .header{
    height:62px;
  }

  .headerTitle{
    font-size:18px;
  }

  .chat{
    padding:
      20px 12px 125px;
  }

  .message{
    max-width:88%;
    font-size:14px;
  }

  .inputArea{
    padding:
      10px 8px 12px;
  }

  .inputBox{
    border-radius:16px;
  }

  .welcome h1{
    font-size:24px;
  }

  .authBox{
    padding:24px 18px;
    border-radius:20px;
  }

}


/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
  width:6px;
}

::-webkit-scrollbar-thumb{
  background:#cbd1da;
  border-radius:10px;
}

</style>

</head>


<body>

<div class="app">


<!-- =========================
     BACKGROUND VIDEO
========================= -->

<video
  id="bgVideo"
  autoplay
  muted
  loop
  playsinline
>
  <source
    src=""
    type="video/mp4"
  >
</video>

<div class="videoOverlay"></div>


<!-- =========================
     SIDEBAR
========================= -->

<aside
  class="sidebar"
  id="sidebar"
>

  <div class="sidebarTop">

    <div class="logo">

      <div class="logoIcon">
        🤖
      </div>

      <span>
        BaatAI
      </span>

    </div>


    <button
      class="newChatBtn"
      id="newChatBtn"
      type="button"
    >
      + New Chat
    </button>

  </div>


  <div class="historyHeader">
    Previous Chats
  </div>


  <div
    class="historyList"
    id="historyList"
  ></div>


  <div class="sidebarBottom">

    <button
      class="clearHistoryBtn"
      id="clearHistoryBtn"
      type="button"
    >
      🗑️ Clear History
    </button>

  </div>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">


  <!-- HEADER -->

  <header class="header">

    <div class="headerLeft">

      <button
        class="menuBtn"
        id="menuBtn"
        type="button"
      >
        ☰
      </button>


      <div>

        <div class="headerTitle">
          BaatAI
        </div>

        <div class="headerSubtitle">
          AI Assistant
        </div>

      </div>

    </div>


    <button
      class="profileBtn"
      id="profileBtn"
      type="button"
    >
      S
    </button>

  </header>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat"
  ></div>


  <!-- IMAGE PREVIEW -->

  <div
    id="imagePreview"
  ></div>


  <!-- INPUT -->

  <div class="inputArea">

    <div class="inputBox">


      <button
        class="iconBtn"
        id="cameraBtn"
        title="Upload Image"
        type="button"
      >
        📷
      </button>


      <button
        class="iconBtn micBtn"
        id="micBtn"
        title="Voice Input"
        type="button"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <rect
            x="9"
            y="3"
            width="6"
            height="11"
            rx="3"
          ></rect>

          <path
            d="M5 11a7 7 0 0 0 14 0"
          ></path>

          <path
            d="M12 18v3"
          ></path>

          <path
            d="M8 21h8"
          ></path>

        </svg>

      </button>


      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >


      <textarea
        id="messageInput"
        rows="1"
        placeholder="Message BaatAI..."
        autocomplete="off"
      ></textarea>


      <button
        class="sendBtn"
        id="sendBtn"
        title="Send"
        type="button"
      >
        ➤
      </button>


    </div>

  </div>


  <!-- PROFILE POPUP -->

  <div
    class="profilePopup"
    id="profilePopup"
  >

    <h3 id="profileTitle">
      👤 BaatAI User
    </h3>

    <p id="profileText">
      Welcome to BaatAI AI Assistant.
    </p>

    <button
      class="closePopup"
      id="closePopup"
      type="button"
    >
      Close
    </button>

  </div>


</main>


<!-- =========================
     LOGIN / SIGNUP
========================= -->

<div
  class="authOverlay"
  id="authOverlay"
>

  <div class="authBox">


    <div class="authLogo">
      🤖
    </div>


    <div class="authTitle">
      Welcome to BaatAI
    </div>


    <div class="authSubtitle">
      Login or create your BaatAI account
    </div>


    <div class="authTabs">

      <button
        class="authTab active"
        id="loginTab"
        type="button"
      >
        Login
      </button>


      <button
        class="authTab"
        id="signupTab"
        type="button"
      >
        Sign Up
      </button>

    </div>


    <div
      class="authMessage"
      id="authMessage"
    ></div>


    <input
      class="authInput"
      id="authName"
      type="text"
      placeholder="Your Name"
      autocomplete="name"
    >


    <input
      class="authInput"
      id="authEmail"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >


    <input
      class="authInput"
      id="authPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      class="authSubmit"
      id="authSubmit"
      type="button"
    >
      Login
    </button>


    <button
      class="authClose"
      id="authClose"
      type="button"
    >
      Continue as Guest
    </button>


  </div>

</div>
<script>

/* =========================
   ELEMENTS
========================= */

const menuBtn =
  document.getElementById("menuBtn");

const sidebar =
  document.getElementById("sidebar");

const profileBtn =
  document.getElementById("profileBtn");

const profilePopup =
  document.getElementById("profilePopup");

const profileTitle =
  document.getElementById("profileTitle");

const profileText =
  document.getElementById("profileText");

const closePopup =
  document.getElementById("closePopup");

const newChatBtn =
  document.getElementById("newChatBtn");

const clearHistoryBtn =
  document.getElementById("clearHistoryBtn");

const historyList =
  document.getElementById("historyList");

const chatMessages =
  document.getElementById("chat");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const imageInput =
  document.getElementById("imageInput");

const imagePreview =
  document.getElementById("imagePreview");

const bgVideo =
  document.getElementById("bgVideo");


/* =========================
   AUTH ELEMENTS
========================= */

const authOverlay =
  document.getElementById("authOverlay");

const loginTab =
  document.getElementById("loginTab");

const signupTab =
  document.getElementById("signupTab");

const authName =
  document.getElementById("authName");

const authEmail =
  document.getElementById("authEmail");

const authPassword =
  document.getElementById("authPassword");

const authSubmit =
  document.getElementById("authSubmit");

const authClose =
  document.getElementById("authClose");

const authMessage =
  document.getElementById("authMessage");


/* =========================
   AUTH MODE
========================= */

let authMode =
  "login";


/* =========================
   SELECTED IMAGE
========================= */

let selectedImage =
  null;


/* =========================
   OPEN LOGIN
========================= */

function openLogin(){

  authMode =
    "login";

  loginTab.classList.add(
    "active"
  );

  signupTab.classList.remove(
    "active"
  );

  authName.style.display =
    "none";

  authSubmit.textContent =
    "Login";

  authMessage.textContent =
    "";

  authOverlay.classList.add(
    "show"
  );

}


/* =========================
   OPEN SIGNUP
========================= */

function openSignup(){

  authMode =
    "signup";

  signupTab.classList.add(
    "active"
  );

  loginTab.classList.remove(
    "active"
  );

  authName.style.display =
    "block";

  authSubmit.textContent =
    "Create Account";

  authMessage.textContent =
    "";

  authOverlay.classList.add(
    "show"
  );

}


/* =========================
   LOGIN TAB
========================= */

loginTab.onclick =
  function(){

    openLogin();

  };


/* =========================
   SIGNUP TAB
========================= */

signupTab.onclick =
  function(){

    openSignup();

  };


/* =========================
   CLOSE AUTH
========================= */

authClose.onclick =
  function(){

    authOverlay.classList.remove(
      "show"
    );

  };


/* =========================
   AUTH SUBMIT
========================= */

authSubmit.onclick =
  async function(){

    const name =
      authName.value.trim();

    const email =
      authEmail.value.trim();

    const password =
      authPassword.value;


    authMessage.textContent =
      "";

    if(!email || !password){

      authMessage.textContent =
        "Email और Password डालें।";

      return;

    }


    if(
      authMode === "signup" &&
      !name
    ){

      authMessage.textContent =
        "अपना Name डालें।";

      return;

    }


    if(
      authMode === "signup" &&
      password.length < 6
    ){

      authMessage.textContent =
        "Password कम से कम 6 अक्षर का होना चाहिए।";

      return;

    }


    authSubmit.disabled =
      true;

    authSubmit.textContent =
      authMode === "login"
        ? "Logging in..."
        : "Creating...";


    try{

      const endpoint =
        authMode === "login"
          ? "https://baatai-ai.onrender.com/api/login"
          : "https://baatai-ai.onrender.com/api/signup";


      const body =
        authMode === "login"
          ? {
              email:
                email,
              password:
                password
            }
          : {
              name:
                name,
              email:
                email,
              password:
                password
            };


      const response =
        await fetch(
          endpoint,
          {
            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(body)
          }
        );


      const text =
        await response.text();


      let data;

      try{

        data =
          JSON.parse(text);

      }catch(error){

        throw new Error(
          "Server response सही नहीं है।"
        );

      }


      if(!response.ok){

        throw new Error(
          data.error ||
          "Request failed."
        );

      }


      if(
        data.user
      ){

        localStorage.setItem(
          "baatai_user",
          JSON.stringify(
            data.user
          )
        );

      }


      authMessage.textContent =
        authMode === "login"
          ? "Login successful ✅"
          : "Account created successfully ✅";


      updateProfileButton();


      setTimeout(
        function(){

          authOverlay.classList.remove(
            "show"
          );

          authName.value =
            "";

          authEmail.value =
            "";

          authPassword.value =
            "";

        },
        700
      );


    }catch(error){

      console.error(
        "AUTH ERROR:",
        error
      );

      authMessage.textContent =
        error.message ||
        "Something went wrong.";

    }finally{

      authSubmit.disabled =
        false;

      authSubmit.textContent =
        authMode === "login"
          ? "Login"
          : "Create Account";

    }

  };


/* =========================
   PROFILE
========================= */

profileBtn.onclick =
  function(event){

    event.stopPropagation();


    const savedUser =
      localStorage.getItem(
        "baatai_user"
      );


    if(savedUser){

      try{

        const user =
          JSON.parse(
            savedUser
          );


        profileTitle.textContent =
          "👤 " +
          (
            user.name ||
            "BaatAI User"
          );


        profileText.textContent =
          user.email ||
          "Welcome to BaatAI.";


        profilePopup.classList.toggle(
          "show"
        );


        return;

      }catch(error){

        console.log(
          error
        );

      }

    }


    openLogin();

  };


/* =========================
   CLOSE PROFILE
========================= */

closePopup.onclick =
  function(){

    profilePopup.classList.remove(
      "show"
    );

  };


/* =========================
   OUTSIDE PROFILE CLICK
========================= */

document.addEventListener(
  "click",
  function(event){

    if(
      profilePopup.classList.contains(
        "show"
      ) &&
      !profilePopup.contains(
        event.target
      ) &&
      !profileBtn.contains(
        event.target
      )
    ){

      profilePopup.classList.remove(

      );

/* =========================
   PROFILE BUTTON
========================= */

function updateProfileButton(){

  const savedUser =
    localStorage.getItem(
      "baatai_user"
    );


  if(!savedUser){

    profileBtn.textContent =
      "S";

    return;

  }


  try{

    const user =
      JSON.parse(
        savedUser
      );


    const name =
      user.name ||
      "BaatAI";

        .charAt(0)
        .toUpperCase();

  }catch(error){

    profileBtn.textContent =
      "S";

  }

}
  <!-- =========================
     PART 3/4
     CHAT + HISTORY + IMAGE
========================= -->

/* =========================
   CHAT MESSAGE FUNCTION
========================= */

function addMessage(text, role = "assistant", image = null) {

  const div = document.createElement("div");

  div.className =
    "message " +
    (role === "user" ? "user" : "assistant");

  if (image) {

    const img =
      document.createElement("img");

    img.src = image;

    img.style.maxWidth = "220px";
    img.style.borderRadius = "12px";
    img.style.display = "block";
    img.style.marginBottom = "8px";

    div.appendChild(img);

  }

  if (text) {

    const textDiv =
      document.createElement("div");

    textDiv.textContent = text;

    div.appendChild(textDiv);

  }

  chatMessages.appendChild(div);

  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


/* =========================
   LOAD CHAT HISTORY
========================= */

function loadHistory() {

  historyList.innerHTML = "";

  const saved =
    JSON.parse(
      localStorage.getItem(
        "baatai_history"
      ) || "[]"
    );

  if (saved.length === 0) {

    historyList.innerHTML = `
      <div
        style="
          padding:15px;
          color:#777;
          font-size:14px;
          text-align:center;
        "
      >
        No previous chats
      </div>
    `;

    return;
  }

  saved.forEach((item, index) => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.style.width = "100%";
    button.style.border = "0";
    button.style.background = "transparent";
    button.style.padding = "12px";
    button.style.textAlign = "left";
    button.style.cursor = "pointer";
    button.style.borderRadius = "10px";

    button.textContent =
      item.title || "New Chat";

    button.onclick = () => {

      loadSavedChat(index);

      if (
        window.innerWidth <= 800
      ) {

        sidebar.classList.remove(
          "open"
        );

      }

    };

    historyList.appendChild(
      button
    );

  });

}


/* =========================
   SAVE CHAT
========================= */

function saveChat() {

  const messages =
    Array.from(
      chatMessages.children
    ).map(element => {

      return {
        text:
          element.innerText || "",

        role:
          element.classList.contains(
            "user"
          )
            ? "user"
            : "assistant"
      };

    });

  if (messages.length === 0) {
    return;
  }

  const firstUserMessage =
    messages.find(
      message =>
        message.role === "user"
    );

  const title =
    firstUserMessage?.text
      ?.slice(0, 40)
      || "New Chat";

  let history =
    JSON.parse(
      localStorage.getItem(
        "baatai_history"
      ) || "[]"
    );

  history.unshift({

    title: title,

    messages: messages,

    createdAt:
      new Date().toISOString()

  });

  /*
    केवल आखिरी 50 chats रखें
  */

  history =
    history.slice(0, 50);

  localStorage.setItem(
    "baatai_history",
    JSON.stringify(history)
  );

  loadHistory();

}


/* =========================
   LOAD SAVED CHAT
========================= */

function loadSavedChat(index) {

  const history =
    JSON.parse(
      localStorage.getItem(
        "baatai_history"
      ) || "[]"
    );

  const selected =
    history[index];

  if (!selected) {
    return;
  }

  chatMessages.innerHTML = "";

  selected.messages.forEach(
    message => {

      addMessage(
        message.text,
        message.role
      );

    }
  );

}


/* =========================
   NEW CHAT
========================= */

newChatBtn.addEventListener(
  "click",
  () => {

    chatMessages.innerHTML = "";

    messageInput.value = "";

    selectedImage = null;

    imagePreview.innerHTML = "";

    imagePreview.style.display =
      "none";

    messageInput.focus();

  }
);


/* =========================
   CLEAR CHAT HISTORY
========================= */

clearHistoryBtn.addEventListener(
  "click",
  () => {

    const confirmDelete =
      confirm(
        "Kya aap sabhi previous chats delete karna chahte hain?"
      );

    if (!confirmDelete) {
      return;
    }

    localStorage.removeItem(
      "baatai_history"
    );

    historyList.innerHTML = "";

    loadHistory();

  }
);


/* =========================
   IMAGE UPLOAD
========================= */

cameraBtn.addEventListener(
  "click",
  () => {

    imageInput.click();

  }
);


/* =========================
   IMAGE SELECT
========================= */

imageInput.addEventListener(
  "change",
  () => {

    const file =
      imageInput.files[0];

    if (!file) {
      return;
    }

    const reader =
      new FileReader();

    reader.onload = function(event) {

      selectedImage =
        event.target.result;

      imagePreview.innerHTML = "";

      const img =
        document.createElement("img");

      img.src =
        selectedImage;

      img.style.maxWidth =
        "120px";

      img.style.maxHeight =
        "120px";

      img.style.borderRadius =
        "12px";

      img.style.objectFit =
        "cover";

      imagePreview.appendChild(
        img
      );

      imagePreview.style.display =
        "block";

    };

    reader.readAsDataURL(file);

  }
);


/* =========================
   REMOVE SELECTED IMAGE
========================= */

imagePreview.addEventListener(
  "click",
  () => {

    selectedImage = null;

    imageInput.value = "";

    imagePreview.innerHTML = "";

    imagePreview.style.display =
      "none";

  }
);


/* =========================
   MOBILE MENU
========================= */

menuBtn.addEventListener(
  "click",
  () => {

    sidebar.classList.toggle(
      "open"
    );

  }
);


/* =========================
   CLOSE MOBILE SIDEBAR
========================= */

document.addEventListener(
  "click",
  event => {

    if (
      window.innerWidth <= 800 &&
      sidebar.classList.contains("open") &&
      !sidebar.contains(event.target) &&
      !menuBtn.contains(event.target)
    ) {

      sidebar.classList.remove(
        "open"
      );

    }

  }
);


/* =========================
   TEXTAREA AUTO RESIZE
========================= */

messageInput.addEventListener(
  "input",
  () => {

    messageInput.style.height =
      "auto";

    messageInput.style.height =
      messageInput.scrollHeight +
      "px";

  }
);


/* =========================
   ENTER KEY
========================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   INITIAL HISTORY LOAD
========================= */

loadHistory();

updateProfileButton();
  <!-- =========================
     PART 4/4
     SEND + API + MIC + INIT
========================= */


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const message =
    messageInput.value.trim();

  const imageToSend =
    selectedImage;


  if (!message && !imageToSend) {
    return;
  }


  /* =========================
     ANONYMOUS VISITOR ID
  ========================= */

  let visitorId =
    localStorage.getItem(
      "baatai-visitor-id"
    );


  if (!visitorId) {

    visitorId =
      crypto.randomUUID();

    localStorage.setItem(
      "baatai-visitor-id",
      visitorId
    );

  }


  /* =========================
     SHOW USER MESSAGE
  ========================= */

  addMessage(
    message,
    "user",
    imageToSend
  );


  messageInput.value = "";

  messageInput.style.height =
    "auto";


  selectedImage = null;

  imageInput.value = "";

  imagePreview.innerHTML = "";

  imagePreview.style.display =
    "none";


  /* =========================
     THINKING MESSAGE
  ========================= */

  const thinking =
    document.createElement("div");

  thinking.className =
    "message assistant";

  thinking.textContent =
    "🤖 सोच रहा हूँ...";

  chatMessages.appendChild(
    thinking
  );

  chatMessages.scrollTop =
    chatMessages.scrollHeight;


  sendBtn.disabled = true;


  try {

    /* =========================
       BAATAI API
    ========================= */

    const response =
      await fetch(
        "https://baatai-ai.onrender.com/api/chat",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                message,

              image:
                imageToSend || null,

              visitorId:
                visitorId

            })

        }
      );


    const data =
      await response.json();


    /* =========================
       REMOVE THINKING
    ========================= */

    thinking.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "AI response नहीं मिला।"
      );

    }


    /* =========================
       AI RESPONSE
    ========================= */

    const reply =
      data.reply ||
      data.message ||
      "कोई जवाब नहीं मिला।";


    addMessage(
      reply,
      "assistant"
    );


    /* =========================
       SAVE CHAT
    ========================= */

    saveChat();


  } catch (error) {

    console.error(
      "CHAT ERROR:",
      error
    );


    thinking.remove();


    addMessage(
      "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।",
      "assistant"
    );

  } finally {

    sendBtn.disabled = false;

    messageInput.focus();

  }

}


/* =========================
   SEND BUTTON
========================= */

sendBtn.addEventListener(
  "click",
  () => {

    sendMessage();

  }
);


/* =========================
   VOICE INPUT
========================= */

let recognition = null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "hi-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart =
    () => {

      micBtn.classList.add(
        "recording"
      );

      micBtn.title =
        "Listening...";

    };


  recognition.onresult =
    event => {

      const transcript =
        event
          .results[0][0]
          .transcript;

      messageInput.value =
        transcript;

      messageInput.dispatchEvent(
        new Event("input")
      );

    };


  recognition.onerror =
    event => {

      console.error(
        "MIC ERROR:",
        event.error
      );

      micBtn.classList.remove(
        "recording"
      );

      micBtn.title =
        "Voice Input";

    };


  recognition.onend =
    () => {

      micBtn.classList.remove(
        "recording"
      );

      micBtn.title =
        "Voice Input";

    };


  micBtn.addEventListener(
    "click",
    () => {

      try {

        recognition.start();

      } catch (error) {

        console.log(
          "Microphone already active"
        );

      }

    }
  );


} else {

  micBtn.addEventListener(
    "click",
    () => {

      alert(
        "आपके browser में Voice Input support नहीं है।"
      );

    }
  );

}


/* =========================
   BACKGROUND VIDEO
========================= */

if (bgVideo) {

  bgVideo.muted = true;

  bgVideo.loop = true;

  bgVideo.playsInline = true;

}

   INITIAL PROFILE
========================= */

updateProfileButton();


/* =========================
   INITIAL HISTORY
========================= */

loadHistory();


/* =========================
   PAGE READY
========================= */

console.log(
  "BaatAI is ready 🚀"
);

</script>
