<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BaatAI - AI Chatbot</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0f0f12;
  color: white;
  height: 100vh;
}

.app {
  display: flex;
  height: 100vh;
}

/* SIDEBAR */

.sidebar {
  width: 250px;
  background: #17171c;
  border-right: 1px solid #292930;
  padding: 20px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 30px;
}

.new-chat {
  width: 100%;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 10px;
  background: #222229;
  color: white;
  cursor: pointer;
  margin-bottom: 20px;
}

.info {
  color: #999;
  font-size: 14px;
  line-height: 1.5;
}

/* MAIN */

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-bottom: 1px solid #292930;
  font-size: 20px;
  font-weight: bold;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px;
}

.message {
  max-width: 850px;
  margin: 0 auto 20px;
  padding: 16px 18px;
  border-radius: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.user {
  background: #25252d;
}

.bot {
  background: #19191f;
  border: 1px solid #292930;
}

.label {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 6px;
}

/* WELCOME */

.welcome {
  max-width: 700px;
  margin: 100px auto;
  text-align: center;
}

.welcome h1 {
  font-size: 40px;
  margin-bottom: 15px;
}

.welcome p {
  color: #aaa;
  font-size: 17px;
}

/* INPUT */

.input-area {
  padding: 15px 20px 20px;
  border-top: 1px solid #292930;
}

.input-box {
  max-width: 850px;
  margin: auto;
  display: flex;
  gap: 10px;
}

#input {
  flex: 1;
  min-height: 52px;
  max-height: 150px;
  resize: none;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #3a3a43;
  background: #19191f;
  color: white;
  outline: none;
  font-size: 16px;
}

#send {
  width: 55px;
  border: none;
  border-radius: 12px;
  background: #7c3aed;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

#send:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.typing {
  color: #aaa;
  font-size: 14px;
  max-width: 850px;
  margin: 0 auto 15px;
}

/* MOBILE */

@media (max-width: 700px) {

  .sidebar {
    display: none;
  }

  .header {
    justify-content: center;
  }

  .chat {
    padding: 15px;
  }

  .message {
    margin-bottom: 15px;
  }

  .welcome {
    margin: 80px 20px;
  }

  .welcome h1 {
    font-size: 32px;
  }

  .input-area {
    padding: 10px;
  }

}

</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      🤖 BaatAI
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="info">
      आपका दोस्ताना AI assistant।<br><br>
      हिंदी, English और Hinglish में सवाल पूछें।
    </div>

  </aside>


  <main class="main">

    <header class="header">
      🤖 BaatAI
    </header>


    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <h1>Namaste! 👋</h1>

        <p>
          मैं BaatAI हूँ।<br>
          मुझसे कुछ भी पूछिए।
        </p>

      </div>

    </section>


    <div class="typing" id="typing"></div>


    <div class="input-area">

      <div class="input-box">

        <textarea
          id="input"
          placeholder="कुछ पूछिए..."
          rows="1"
        ></textarea>

        <button id="send">
          ➤
        </button>

      </div>

    </div>

  </main>

</div>


<script>

const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const chat = document.getElementById("chat");
const typing = document.getElementById("typing");
const welcome = document.getElementById("welcome");


function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  const label = document.createElement("div");

  label.className = "label";

  label.textContent =
    type === "user" ? "👤 You" : "🤖 BaatAI";

  const content = document.createElement("div");

  content.textContent = text;

  message.appendChild(label);
  message.appendChild(content);

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


async function sendMessage() {

  const text = input.value.trim();

  if (!text) {
    return;
  }

  if (welcome) {
    welcome.style.display = "none";
  }

  addMessage(text, "user");

  input.value = "";

  sendBtn.disabled = true;

  typing.textContent = "🤖 BaatAI जवाब तैयार कर रहा है...";

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.error || "Server error"
      );

    }


    typing.textContent = "";

    addMessage(
      data.reply,
      "bot"
    );


  } catch (error) {

    console.error(error);

    typing.textContent = "";

    addMessage(
      "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।",
      "bot"
    );

  }


  sendBtn.disabled = false;

  input.focus();
}


sendBtn.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


function newChat() {

  chat.innerHTML = `

    <div class="welcome" id="welcome">

      <h1>Namaste! 👋</h1>

      <p>
        मैं BaatAI हूँ।<br>
        मुझसे कुछ भी पूछिए।
      </p>

    </div>

  `;

  input.value = "";

  input.focus();
}


</script>

</body>
</html>
