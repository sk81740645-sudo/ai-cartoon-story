<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Cartoon Story Maker</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#7b2cff,#008cff,#00c6ff);
    color:#222;
}

.header{
    text-align:center;
    color:white;
    padding:35px 15px 25px;
}

.header h1{
    font-size:38px;
    margin-bottom:12px;
}

.header p{
    font-size:20px;
    line-height:1.5;
}

.container{
    width:94%;
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 35px rgba(0,0,0,.2);
    margin-bottom:25px;
}

.label{
    display:block;
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
}

textarea{
    width:100%;
    height:180px;
    border:3px solid #ddd;
    border-radius:20px;
    padding:18px;
    font-size:20px;
    resize:vertical;
    outline:none;
}

textarea:focus{
    border-color:#7b2cff;
}

.mainBtn{
    width:100%;
    margin-top:20px;
    padding:18px;
    border:none;
    border-radius:18px;
    background:linear-gradient(90deg,#7b2cff,#008cff);
    color:white;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

.mainBtn:active{
    transform:scale(.98);
}

.storyBox{
    display:none;
    background:#fafafa;
    border-radius:22px;
    padding:25px;
    margin-top:25px;
}

.storyTitle{
    color:#7b2cff;
    font-size:27px;
    margin-bottom:18px;
}

.storyText{
    font-size:20px;
    line-height:1.9;
    white-space:pre-line;
}

.copyBtn{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:none;
    border-radius:15px;
    background:#222;
    color:white;
    font-size:19px;
    font-weight:bold;
}

.videoSection{
    display:none;
    background:white;
    border-radius:25px;
    padding:25px;
    margin-bottom:30px;
    box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.videoSection h2{
    color:#7b2cff;
    text-align:center;
    margin-bottom:15px;
}

.videoBtn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:17px;
    background:linear-gradient(90deg,#ff0080,#7928ff);
    color:white;
    font-size:21px;
    font-weight:bold;
}

.status{
    text-align:center;
    margin:15px 0;
    font-size:17px;
    font-weight:bold;
}

video{
    width:100%;
    border-radius:18px;
    display:none;
    margin-top:15px;
    background:#111;
}

.downloadBtn{
    display:none;
    width:100%;
    text-align:center;
    padding:16px;
    margin-top:15px;
    background:#222;
    color:white;
    border-radius:15px;
    text-decoration:none;
    font-size:19px;
    font-weight:bold;
}

.footer{
    color:white;
    text-align:center;
    padding:20px;
    font-size:16px;
}

</style>
</head>


<body>

<div class="header">

    <h1>🎬 AI Cartoon Story</h1>

    <p>
        ✨ अपनी कहानी बनाइए और Cartoon Video के लिए तैयार कीजिए
    </p>

</div>


<div class="container">

    <!-- STORY INPUT -->

    <div class="card">

        <label class="label">
            📝 कहानी का विषय लिखें
        </label>

        <textarea
            id="topic"
            placeholder="जैसे: राजा और घोड़े की कहानी"
        ></textarea>

        <button
            class="mainBtn"
            onclick="createStory()"
        >
            ✨ कहानी बनाएं
        </button>

    </div>


    <!-- STORY -->

    <div
        class="storyBox"
        id="storyBox"
    >

        <h2 class="storyTitle">
            📖 आपकी Cartoon Story
        </h2>

        <div
            class="storyText"
            id="storyText"
        ></div>

        <button
            class="copyBtn"
            onclick="copyStory()"
        >
            📋 कहानी Copy करें
        </button>

    </div>


    <!-- VIDEO -->

    <div
        class="videoSection"
        id="videoSection"
    >

        <h2>
            🎬 Cartoon Video बनाएं
        </h2>

        <p
            style="
            text-align:center;
            margin-bottom:18px;
            color:#555;
            "
        >
            अपनी बनाई हुई कहानी का वीडियो तैयार करें
        </p>

        <button
            class="videoBtn"
            id="videoBtn"
            onclick="generateVideo()"
        >
            🎬 Video Generate करें
        </button>

        <div
            class="status"
            id="status"
        ></div>

        <video
            id="video"
            controls
        ></video>

        <a
            id="downloadBtn"
            class="downloadBtn"
            download="ai-cartoon-story.webm"
        >
            ⬇️ Video Download करें
        </a>

    </div>

</div>


<div class="footer">

    ❤️ AI Cartoon Story • बच्चों के लिए मजेदार कहानियां

</div>



<script>

/* =========================
   STORY GENERATOR
========================= */

let currentStory = "";


function createStory(){

    const topic =
        document.getElementById("topic").value.trim();

    if(topic === ""){

        alert("कृपया पहले कहानी का विषय लिखें।");

        return;
    }


    currentStory =
`एक दिन ${topic} की एक बहुत प्यारी कहानी शुरू हुई।

एक छोटा बच्चा अपने दोस्तों के साथ खेल रहा था।
अचानक उसे एक सुंदर और अनोखी चीज दिखाई दी।

बच्चे ने ध्यान से देखा और उसके पास गया।
वह बहुत खुश हुआ और उसने अपने दोस्तों को भी बुलाया।

सभी दोस्तों ने मिलकर उस चीज की मदद करने का फैसला किया।

उन्होंने मिलकर मेहनत की और आखिरकार समस्या हल हो गई।

सब बच्चे बहुत खुश हुए और एक-दूसरे से बोले कि हमें हमेशा दूसरों की मदद करनी चाहिए।

उस दिन बच्चों ने सीखा कि दोस्ती, प्यार और मदद करने से हर मुश्किल आसान हो सकती है।

सीख:
हमें हमेशा दूसरों की मदद करनी चाहिए और अपने दोस्तों के साथ प्यार से रहना चाहिए।`;


    document.getElementById("storyText").innerText =
        currentStory;

    document.getElementById("storyBox").style.display =
        "block";

    document.getElementById("videoSection").style.display =
        "block";


    document.getElementById("videoSection")
        .scrollIntoView({
            behavior:"smooth"
        });
}


/* =========================
   COPY STORY
========================= */

function copyStory(){

    if(!currentStory){

        alert("पहले कहानी बनाएं।");

        return;
    }

    navigator.clipboard.writeText(currentStory)
    .then(function(){

        alert("✅ कहानी Copy हो गई!");

    })
    .catch(function(){

        alert("कहानी Copy नहीं हो पाई।");

    });

}


/* =========================
   VIDEO GENERATOR
========================= */

function generateVideo(){

    if(!currentStory){

        alert("पहले कहानी बनाएं।");

        return;
    }


    const button =
        document.getElementById("videoBtn");

    const status =
        document.getElementById("status");

    const video =
        document.getElementById("video");

    const download =
        document.getElementById("downloadBtn");


    button.disabled = true;

    button.innerText =
        "⏳ Video बन रही है...";


    status.innerText =
        "🎬 Cartoon Video तैयार हो रही है...";


    /*
       CANVAS
    */

    const canvas =
        document.createElement("canvas");

    canvas.width = 720;
    canvas.height = 1280;


    const ctx =
        canvas.getContext("2d");


    /*
       VIDEO STREAM
    */

    const stream =
        canvas.captureStream(30);


    let recorder;


    try{

        recorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:"video/webm"
                }
            );

    }

    catch(error){

        alert(
            "आपके Browser में Video Generation Support नहीं है। Chrome इस्तेमाल करें।"
        );

        button.disabled = false;

        button.innerText =
            "🎬 Video Generate करें";

        return;
    }


    let chunks = [];


    recorder.ondataavailable =
        function(event){

            if(event.data.size > 0){

                chunks.push(event.data);

            }

        };


    recorder.onstop =
        function(){

            const blob =
                new Blob(
                    chunks,
                    {
                        type:"video/webm"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            video.src = url;

            video.style.display =
                "block";


            download.href =
                url;

            download.style.display =
                "block";


            status.innerText =
                "✅ Video तैयार हो गई!";


            button.disabled =
                false;


            button.innerText =
                "🎬 Video फिर से बनाएं";


            video.scrollIntoView({
                behavior:"smooth"
            });

        };


    recorder.start();


    /*
       STORY TEXT
    */

    let lines =
        currentStory.match(/.{1,32}/g) || [];


    /*
       VIDEO LENGTH
    */

    const duration =
        10000;

    const start =
        Date.now();


    /*
       DRAW VIDEO
    */

    function draw(){

        const elapsed =
            Date.now() - start;


        const progress =
            Math.min(
                elapsed / duration,
                1
            );


        /*
           BACKGROUND
        */

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                720,
                1280
            );


        gradient.addColorStop(
            0,
            "#7b2cff"
        );

        gradient.addColorStop(
            0.5,
            "#008cff"
        );

        gradient.addColorStop(
            1,
            "#00c6ff"
        );


        ctx.fillStyle =
            gradient;

        ctx.fillRect(
            0,
            0,
            720,
            1280
        );


        /*
           TITLE
        */

        ctx.fillStyle =
            "white";

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 52px Arial";


        ctx.fillText(
            "🎬 AI Cartoon Story",
            360,
            150
        );


        /*
           CHARACTER
        */

        ctx.font =
            "100px Arial";

        ctx.fillText(
            "🧒",
            360,
            330
        );


        /*
           STORY
        */

        ctx.font =
            "bold 30px Arial";


        const visible =
            Math.floor(
                lines.length * progress
            );


        for(
            let i=0;
            i<visible && i<14;
            i++
        ){

            ctx.fillText(
                lines[i],
                360,
                470 + i*48
            );

        }


        /*
           FOOTER
        */

        ctx.font =
            "28px Arial";


        ctx.fillText(
            "✨ बच्चों के लिए मजेदार कहानी ✨",
            360,
            1150
        );


        if(progress < 1){

            requestAnimationFrame(draw);

        }

        else{

            recorder.stop();

        }

    }


    draw();

}

</script>

</body>
</html>
