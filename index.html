<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BaatAI - AI Chatbot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{width:100%;height:100vh;overflow:hidden;background:#f5f7fb}
.app{width:100%;height:100vh;display:flex}
.sidebar{width:260px;height:100vh;background:#111827;color:#fff;padding:20px;display:flex;flex-direction:column;flex-shrink:0;transition:.3s}
.logo{font-size:28px;font-weight:bold;margin-bottom:28px}.logo span{color:#00bfff}
.new-chat{width:100%;padding:14px;border:1px solid #374151;border-radius:12px;background:#1f2937;color:#fff;font-size:16px;cursor:pointer}
.history-title{margin-top:30px;color:#9ca3af;font-size:16px}.history-list{margin-top:12px;overflow-y:auto}
.history-item{padding:10px;border-radius:8px;color:#d1d5db;font-size:14px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-bottom{margin-top:auto;color:#9ca3af;font-size:14px;line-height:1.7}
.main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;background:#f8fafc}
.topbar{width:100%;height:65px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 18px;flex-shrink:0}
.menu-btn{display:none;border:0;background:none;font-size:27px;margin-right:14px;cursor:pointer}.top-title{font-size:21px;font-weight:bold;color:#111827}
.chat{flex:1;overflow-y:auto;padding:30px 20px}
.welcome{max-width:650px;margin:70px auto;text-align:center}.welcome-icon{font-size:60px;margin-bottom:15px}
.welcome h1{font-size:32px;color:#111827;margin-bottom:12px}.welcome p{color:#6b7280;font-size:17px;line-height:1.7}
.message{display:flex;gap:10px;margin-bottom:20px;max-width:850px;margin-left:auto;margin-right:auto}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:19px}
.user .avatar{background:#2563eb}.bot .avatar{background:#06b6d4}
.bubble{max-width:80%;padding:14px 17px;border-radius:15px;line-height:1.6;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.user .bubble{background:#2563eb;color:#fff;border-bottom-right-radius:5px}
.bot .bubble{background:#fff;color:#1f2937;border:1px solid #e5e7eb;border-bottom-left-radius:5px}
.typing{display:flex;gap:5px;align-items:center}.dot{width:7px;height:7px;background:#6b7280;border-radius:50%;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.input-area{width:100%;padding:12px 20px 15px;background:#f8fafc;flex-shrink:0}
.input-box{max-width:850px;margin:auto;background:#fff;border:1px solid #d1d5db;border-radius:16px;padding:7px;display:flex;align-items:flex-end;box-shadow:0 3px 12px rgba(0,0,0,.06)}
textarea{flex:1;border:0;outline:0;resize:none;padding:12px;font-size:16px;min-height:45px;max-height:120px}
.send-btn{width:46px;height:46px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:22px;cursor:pointer}
.disclaimer{text-align:center;font-size:11px;color:#9ca3af;margin-top:7px}
@media(max-width:700px){
.sidebar{position:fixed;left:-270px;top:0;z-index:1000;box-shadow:5px 0 20px rgba(0,0,0,.25)}
.sidebar.open{left:0}.menu-btn{display:block}.chat{padding:20px 12px}.input-area{padding:8px 10px 12px}
.welcome{margin:60px auto}.welcome h1{font-size:28px}.welcome-icon{font-size:50px}.bubble{max-width:88%}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="logo">🤖 <span>BaatAI</span></div>
<button class="new-chat" onclick="newChat()">＋ New Chat</button>
<div class="history-title">Chat History</div>
<div class="history-list" id="historyList"></div>
<div class="sidebar-bottom">BaatAI v1.0<br>आपका AI साथी 🤖</div>
</aside>

<main class="main">
<header class="topbar">
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<div class="top-title">🤖 BaatAI</div>
</header>

<section class="chat" id="chat">
<div class="welcome" id="welcome">
<div class="welcome-icon">🤖</div>
<h1>नमस्ते! 👋</h1>
<p>मैं BaatAI हूँ।<br>मुझसे कुछ भी पूछिए।</p>
</div>
</section>

<div class="input-area">
<div class="input-box">
<textarea id="messageInput" placeholder="BaatAI से कुछ पूछें..." rows="1"></textarea>
<button class="send-btn" onclick="sendMessage()">➤</button>
</div>
<p class="disclaimer">BaatAI अभी Demo Mode में है</p>
</div>
</main>
</div>

<script>
const input=document.getElementById("messageInput");
const chat=document.getElementById("chat");
const sidebar=document.getElementById("sidebar");
const historyList=document.getElementById("historyList");

function sendMessage(){
const text=input.value.trim();
if(!text)return;
const welcome=document.getElementById("welcome");
if(welcome)welcome.style.display="none";
addMessage(text,"user");
saveHistory(text);
input.value="";
showTyping();
setTimeout(()=>{removeTyping();addMessage(getAIReply(text),"bot")},900);
}

function addMessage(text,type){
const message=document.createElement("div");
message.className="message "+type;
const avatar=document.createElement("div");
avatar.className="avatar";
avatar.innerText=type==="user"?"👤":"🤖";
const bubble=document.createElement("div");
bubble.className="bubble";
bubble.innerText=text;
message.appendChild(avatar);
message.appendChild(bubble);
chat.appendChild(message);
chat.scrollTop=chat.scrollHeight;
}

function getAIReply(text){
const lower=text.toLowerCase();
if(lower.includes("hello")||lower.includes("hi")||lower.includes("नमस्ते")||lower.includes("हेलो"))
return "नमस्ते! 👋 मैं BaatAI हूँ। आप मुझसे कोई भी सवाल पूछ सकते हैं। 🤖";
if(lower.includes("तुम्हारा नाम")||lower.includes("आपका नाम")||lower.includes("your name"))
return "मेरा नाम BaatAI है 🤖। मैं आपका AI साथी हूँ!";
if(lower.includes("flipkart"))
return "Flipkart भारत की एक बड़ी e-commerce website है। यहाँ मोबाइल, इलेक्ट्रॉनिक्स, कपड़े और बहुत सारे products online खरीदे जा सकते हैं। 🛒";
if(lower.includes("youtube")||lower.includes("यूट्यूब"))
return "YouTube के लिए मैं आपको video ideas, scripts, titles, descriptions और hashtags बनाने में मदद कर सकता हूँ। 🎬";
if(lower.includes("website")||lower.includes("वेबसाइट"))
return "हाँ! मैं आपको HTML, CSS और JavaScript से website बनाने में मदद कर सकता हूँ। 💻";
if(lower.includes("code")||lower.includes("coding")||lower.includes("कोड"))
return "मैं HTML, CSS और JavaScript में code बनाने और समझाने में आपकी मदद कर सकता हूँ। 💻🤖";
if(lower.includes("ai")||lower.includes("एआई"))
return "AI यानी Artificial Intelligence ऐसी technology है जो जानकारी समझने, जवाब देने और कई तरह के काम करने में मदद कर सकती है। 🤖";
if(lower.includes("help")||lower.includes("मदद"))
return "बिल्कुल! 😊 आप बताइए आपको किस चीज में मदद चाहिए?";
return 'आपने पूछा:\n\n"'+text+'"\n\nअभी BaatAI Demo Mode में है। 🤖\n\nअगले चरण में हम इसमें असली AI जोड़ेंगे, जिससे BaatAI आपके सवालों के वास्तविक AI जवाब दे सकेगा।';
}

function showTyping(){
removeTyping();
const message=document.createElement("div");
message.className="message bot";message.id="typingMessage";
const avatar=document.createElement("div");avatar.className="avatar";avatar.innerText="🤖";
const bubble=document.createElement("div");bubble.className="bubble";
bubble.innerHTML='<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
message.appendChild(avatar);message.appendChild(bubble);chat.appendChild(message);
chat.scrollTop=chat.scrollHeight;
}
function removeTyping(){const typing=document.getElementById("typingMessage");if(typing)typing.remove();}
function newChat(){
chat.innerHTML='<div class="welcome" id="welcome"><div class="welcome-icon">🤖</div><h1>नमस्ते! 👋</h1><p>मैं BaatAI हूँ।<br>मुझसे कुछ भी पूछिए।</p></div>';
input.value="";closeMenu();
}
function toggleMenu(){sidebar.classList.toggle("open")}
function closeMenu(){sidebar.classList.remove("open")}
function saveHistory(text){
const item=document.createElement("div");item.className="history-item";item.innerText=text;
historyList.prepend(item);
if(historyList.children.length>10)historyList.lastChild.remove();
}
input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
input.addEventListener("input",function(){
this.style.height="auto";
this.style.height=Math.min(this.scrollHeight,120)+"px";
});
</script>
</body>
</html>
