<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BaatAI - AI Assistant</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    /* Sidebar */

    .sidebar {
      width: 250px;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .new-chat:hover {
      background: #374151;
    }

    /* Main */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      height: 65px;
      background: white;
      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;

      padding: 0 20px;

      font-size: 21px;
      font-weight: bold;
    }

    /* Chat */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .welcome {
      text-align: center;
      margin-top: 100px;
    }

    .welcome h1 {
      font-size: 34px;
      color: #111827;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #6b7280;
      font-size: 16px;
    }

    .message {
      max-width: 850px;
      margin: 15px auto;
      display: flex;
    }

    .user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 13px 17px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai .bubble {
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    /* Input */

    .input-area {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 15px;
    }

    .input-box {
      max-width: 850px;
      margin: auto;

      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;

      padding: 14px 16px;

      border: 1px solid #d1d5db;
      border-radius: 12px;

      outline: none;

      font-size: 16px;
    }

    #messageInput:focus {
      border-color: #2563eb;
    }

    #sendBtn {
      width: 55px;

      border: none;
      border-radius: 12px;

      background: #2563eb;
      color: white;

      font-size: 20px;

      cursor: pointer;
    }

    #sendBtn:hover {
      background: #1d4ed8;
    }

    #sendBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* Mobile */

    @media (max-width: 700px) {

      .sidebar {
        display: none;
      }

      .header {
        justify-content: center;
      }

      .chat {
        padding: 15px;
      }

      .welcome {
        margin-top: 70px;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .bubble {
        max-width: 90%;
      }

      .input-area {
        padding: 10px;
      }
    }
    .menu-btn {
  display: none;
  border: none;
  background: transparent;
  font-size: 28px;
  cursor: pointer;
  margin-right: 12px;
  color: #111827;
}

@media (max-width: 700px) {
  .menu-btn {
    display: block;
  }

  .sidebar {
    display: none;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 1000;
  }

  .sidebar.active {
    display: block;
  }
}

  </style>
</head>

<body>

  <div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

      <div class="logo">
        🤖 BaatAI
      </div>

      <button class="new-chat" onclick="newChat()">
        ＋ New Chat
      </button>

    </aside>


    <!-- Main -->

    <main class="main">

      <header class="header">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  🤖 BaatAI
      </header>


      <!-- Chat -->

      <section class="chat" id="chat">

        <div class="welcome" id="welcome">

          <h1>Hello 👋</h1>

          <p>
            BaatAI से कुछ भी पूछिए...
          </p>

        </div>

      </section>


      <!-- Input -->

      <div class="input-area">

        <div class="input-box">

          <input
            id="messageInput"
            type="text"
            placeholder="अपना सवाल लिखें..."
            autocomplete="off"
          >

          <button
            id="sendBtn"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>

    </main>

  </div>


  <script>

    // BaatAI का अपना backend
    const API_URL = "/api/chat";


    const input =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const chat =
      document.getElementById("chat");

    const welcome =
      document.getElementById("welcome");


    // Enter key

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    });


    // Send message

    async function sendMessage() {

      const message = input.value.trim();

      if (!message) {
        return;
      }


      // Remove welcome

      if (document.getElementById("welcome")) {
        document.getElementById("welcome").remove();
      }


      // Show user message

      addMessage(message, "user");

      input.value = "";

      sendBtn.disabled = true;


      // Typing

      const typing =
        addMessage("🤖 सोच रहा हूँ...", "ai");


      try {

        const response = await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })

        });


        const data = await response.json();


        typing.remove();


        if (!response.ok) {

          throw new Error(
            data.error || "Server error"
          );

        }


        addMessage(
          data.reply || "मुझे कोई जवाब नहीं मिला।",
          "ai"
        );


      } catch (error) {

        console.error(error);

        typing.remove();

        addMessage(
          "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।",
          "ai"
        );

      }


      sendBtn.disabled = false;

      input.focus();

    }


    // Add message

    function addMessage(text, type) {

      const messageDiv =
        document.createElement("div");

      messageDiv.className =
        "message " + type;


      const bubble =
        document.createElement("div");

      bubble.className = "bubble";

      bubble.textContent = text;


      messageDiv.appendChild(bubble);

      chat.appendChild(messageDiv);


      chat.scrollTop =
        chat.scrollHeight;


      return messageDiv;

    }


    // New chat

    function newChat() {

      chat.innerHTML = `

        <div class="welcome" id="welcome">

          <h1>Hello 👋</h1>

          <p>
            BaatAI से कुछ भी पूछिए...
          </p>

        </div>

      `;

      input.value = "";

      input.focus();

    }
    function toggleMenu() {
  const sidebar = document.querySelector(".sidebar");
  sidebar.classList.toggle("active");
    }

  </script>

</body>
</html>
