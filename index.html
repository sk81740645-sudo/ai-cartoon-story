*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#000;
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#000;
}


/* =====================================================
   BACKGROUND VIDEO
===================================================== */

#bgVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  pointer-events:none;
  background:#000;
}

.videoOverlay{
  position:fixed;
  inset:0;
  z-index:1;
  background:rgba(0,8,12,.62);
  pointer-events:none;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  position:relative;
  z-index:30;
  width:100%;
  height:72px;
  display:flex;
  align-items:center;
  padding:0 14px;
  background:rgba(0,8,12,.72);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(0,229,255,.25);
}

.menuBtn{
  width:42px;
  height:42px;
  margin-right:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:32px;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.robot{
  font-size:30px;
  line-height:1;
}

.brandName{
  color:#fff;
  font-size:22px;
  font-weight:700;
  line-height:24px;
}

.brandSub{
  color:#00e5ff;
  font-size:11px;
  line-height:14px;
}

.headerRight{
  display:flex;
  align-items:center;
  margin-left:auto;
}

.lightBtn{
  height:42px;
  padding:0 12px;
  border:1px solid #00e5ff;
  border-radius:11px;
  background:rgba(0,40,48,.7);
  color:#fff;
  font-size:14px;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.profileBtn{
  width:42px;
  height:42px;
  margin-left:8px;
  border:1px solid #00e5ff;
  border-radius:50%;
  background:rgba(0,50,60,.75);
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  z-index:100;
}


/* =====================================================
   MAIN
===================================================== */

.main{
  position:relative;
  z-index:10;
  width:100%;
  height:calc(100dvh - 72px);
  overflow:hidden;
}

.welcome{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:3px;
}

.welcome h1{
  color:#00e5ff;
  font-size:27px;
  font-weight:600;
  text-shadow:0 0 12px rgba(0,229,255,.45);
}

.welcomeLine{
  width:52px;
  height:1px;
  background:#00e5ff;
  margin:0 10px 3px;
}


/* =====================================================
   CHAT
===================================================== */

.chat{
  width:100%;
  height:calc(100% - 60px);
  padding:4px 18px 120px;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:rgba(0,229,255,.35);
  border-radius:10px;
}

.message{
  width:100%;
  display:flex;
  margin:10px 0;
}

.message.userMessage{
  justify-content:flex-end;
}

.message.aiMessage{
  justify-content:flex-start;
}

.message.userMessage,
.message.aiMessage{
  width:100%;
}

.message.userMessage::before,
.message.aiMessage::before{
  display:none;
}

.bubble{
  max-width:86%;
  padding:12px 15px;
  border-radius:17px;
  color:#f5ffff;
  font-size:16px;
  line-height:1.5;
  word-break:break-word;
  white-space:pre-wrap;
  background:rgba(0,15,20,.78);
  border:1px solid rgba(0,229,255,.35);
  backdrop-filter:blur(5px);
}

.message.userMessage .bubble{
  background:rgba(0,65,75,.45);
  border-color:rgba(0,229,255,.7);
  border-bottom-right-radius:5px;
}

.message.aiMessage .bubble{
  border-bottom-left-radius:5px;
}


/* =====================================================
   WELCOME MESSAGE
===================================================== */

.welcomeMessage{
  width:100%;
  max-width:600px;
  margin:15px auto;
  padding:22px 18px;
  text-align:left;
  border:1px solid rgba(0,229,255,.45);
  border-radius:20px;
  background:rgba(0,18,23,.72);
  color:#f1ffff;
  font-size:16px;
  line-height:1.65;
  backdrop-filter:blur(7px);
}

.welcomeMessage strong{
  font-size:18px;
}


/* =====================================================
   CHAT WELCOME
===================================================== */

.chatWelcome{
  width:100%;
  max-width:600px;
  margin:15px auto;
  padding:22px 18px;
  text-align:center;
  border:1px solid rgba(0,229,255,.45);
  border-radius:20px;
  background:rgba(0,18,23,.72);
  color:#f1ffff;
  backdrop-filter:blur(7px);
}

.chatWelcomeIcon{
  font-size:42px;
  margin-bottom:10px;
}

.chatWelcome h2{
  color:#00e5ff;
  margin-bottom:8px;
}

.chatWelcome p{
  color:#c8d7da;
  font-size:14px;
}


/* =====================================================
   INPUT AREA
===================================================== */

.inputArea{
  position:absolute;
  z-index:50;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  padding:7px 12px max(8px,env(safe-area-inset-bottom));
  background:linear-gradient(
    transparent,
    rgba(0,7,10,.98) 45%
  );
  pointer-events:none;
}

.inputBox{
  width:100%;
  max-width:700px;
  min-height:58px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 6px;
  border:1px solid #00e5ff;
  border-radius:30px;
  background:rgba(0,20,25,.9);
  box-shadow:0 0 15px rgba(0,229,255,.08);
  backdrop-filter:blur(10px);
  pointer-events:auto;
  position:relative;
}

.iconBtn{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #00e5ff;
  border-radius:50%;
  background:rgba(0,45,55,.75);
  color:#00e5ff;
  font-size:19px;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.iconBtn:active{
  transform:scale(.93);
}

#messageInput{
  flex:1;
  min-width:0;
  height:42px;
  max-height:100px;
  resize:none;
  overflow-y:auto;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px 5px;
  font-size:16px;
  line-height:22px;
}

#messageInput::placeholder{
  color:#9aaeb2;
}

.sendBtn{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#001014;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.sendBtn:active{
  transform:scale(.92);
}

#imageInput{
  display:none;
}

.imagePreview{
  position:absolute;
  left:10px;
  bottom:65px;
  z-index:110;
  display:none;
  padding:5px;
  border-radius:12px;
  background:rgba(0,15,20,.95);
  border:1px solid #00e5ff;
}

.imagePreview img{
  display:block;
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:9px;
}

.uploadedImage{
  display:block;
  width:100%;
  max-width:270px;
  max-height:320px;
  object-fit:cover;
  margin-bottom:8px;
  border-radius:13px;
  border:1px solid rgba(0,229,255,.4);
}


/* =====================================================
   MIC
===================================================== */

.micBtn{
  color:#fff;
  background:rgba(35,35,35,.85);
  border:1px solid rgba(255,255,255,.18);
}

.micBtn svg{
  width:21px;
  height:21px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.micBtn.listening{
  background:rgba(255,50,50,.18);
  border-color:#ff4444;
  color:#ff4444;
  animation:micPulse 1s infinite;
}

@keyframes micPulse{
  50%{
    box-shadow:0 0 15px rgba(255,60,60,.55);
  }
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  position:fixed;
  top:0;
  left:-285px;
  width:275px;
  height:100dvh;
  z-index:90;
  padding:82px 14px 20px;
  overflow-y:auto;
  background:rgba(0,12,17,.98);
  border-right:1px solid #00e5ff;
  box-shadow:8px 0 30px rgba(0,0,0,.5);
  transition:left .25s ease;
}

.sidebar.open{
  left:0;
}

.newChatBtn,
.menuItem{
  width:100%;
  min-height:45px;
  margin-bottom:8px;
  padding:10px 13px;
  border:1px solid rgba(0,229,255,.45);
  border-radius:10px;
  background:rgba(0,40,48,.72);
  color:#fff;
  text-align:left;
  font-size:14px;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.newChatBtn:hover,
.menuItem:hover{
  background:rgba(0,229,255,.15);
}


/* =====================================================
   HISTORY
===================================================== */

.historyTitle{
  margin:18px 4px 9px;
  color:#00e5ff;
  font-size:13px;
  font-weight:bold;
}

.historyList{
  width:100%;
}

.historyItem{
  width:100%;
  padding:11px;
  margin-bottom:7px;
  border-radius:10px;
  background:rgba(255,255,255,.06);
  color:#ddd;
  cursor:pointer;
  overflow:hidden;
  transition:.2s;
}

.historyItem:hover{
  background:rgba(0,229,255,.12);
}

.historyItem.active{
  background:rgba(0,229,255,.15);
  border:1px solid rgba(0,229,255,.3);
}

.historyItemTitle{
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#fff;
}

.historyItemSnippet{
  margin-top:4px;
  font-size:11px;
  color:#91a6aa;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.historyItemTime{
  margin-top:5px;
  font-size:10px;
  color:#00e5ff;
}

.historyEmpty{
  color:#7f9295;
  font-size:12px;
  padding:10px 4px;
}


/* =====================================================
   PROFILE POPUP
===================================================== */

.profilePopup{
  position:fixed;
  z-index:120;
  top:78px;
  right:12px;
  width:220px;
  padding:15px;
  border:1px solid #00e5ff;
  border-radius:14px;
  background:rgba(0,15,20,.98);
  box-shadow:0 8px 30px rgba(0,0,0,.45);
  display:none;
}

.profilePopup.show{
  display:block;
}

.profilePopup h3{
  color:#00e5ff;
  font-size:16px;
  margin-bottom:8px;
}

.profilePopup p{
  color:#ddd;
  font-size:13px;
  line-height:1.5;
  margin-bottom:10px;
}

.closePopup{
  width:100%;
  padding:9px;
  border:1px solid #00e5ff;
  border-radius:9px;
  background:transparent;
  color:#fff;
  cursor:pointer;
}

.logoutBtn{
  width:100%;
  margin-top:8px;
  padding:9px;
  border:1px solid #ff5555;
  border-radius:9px;
  background:rgba(255,50,50,.08);
  color:#ff7777;
  cursor:pointer;
}


/* =====================================================
   LIGHT MODE
===================================================== */

body.light{
  background:#f4fbfc;
}

body.light .videoOverlay{
  background:rgba(235,250,252,.82);
}

  background:rgba(255,255,255,.88);
  border-bottom-color:rgba(0,140,160,.25);
}

body.light .menuBtn,
body.light .brandName{
  color:#111;
}

}

}

}

body.light .welcome h1{
  color:#008da3;
}

  background:rgba(255,255,255,.82);

  border-color:rgba(0,130,150,.35);
}

  background:rgba(255,255,255,.82);

}

  );
}

}

}

}

}

body.light .menuItem{

}

}

}

  color:#333;
}

body.light .closePopup{
  color:#111;
}

body.light .imagePreview{
  background:#fff;
}


/* =====================================================
   AUTH
===================================================== */

.authOverlay{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.authOverlay.show{
  display:flex;
}

.authBox{
  width:100%;
  max-width:390px;
  padding:25px;
  border:1px solid #00e5ff;
  border-radius:22px;
  background:rgba(0,18,24,.97);
  box-shadow:0 0 35px rgba(0,229,255,.18);
}

.authLogo{
  text-align:center;
  margin-bottom:8px;
  font-size:38px;
}

.authTitle{
  text-align:center;
  color:#fff;
  font-size:25px;
  font-weight:bold;
}

.authSubtitle{
  text-align:center;
  color:#91a6aa;
  font-size:13px;
  margin:7px 0 20px;
}

.authTabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.authTab{
  flex:1;
  padding:11px;
  border:1px solid rgba(0,229,255,.4);
  border-radius:10px;
  background:rgba(0,40,48,.7);
  color:#fff;
  cursor:pointer;
}

.authTab.active{
  background:#00e5ff;
  color:#001014;
  font-weight:bold;
}

.authInput{
  width:100%;
  height:46px;
  margin-bottom:12px;
  padding:0 13px;
  border:1px solid rgba(0,229,255,.4);
  border-radius:10px;
  outline:none;
  background:rgba(0,8,12,.8);
  color:#fff;
  font-size:15px;
}

.authInput::placeholder{
  color:#819397;
}

.authSubmit{
  width:100%;
  height:47px;
  border:0;
  border-radius:11px;
  background:#00e5ff;
  color:#001014;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.authSubmit:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.authClose{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:1px solid rgba(0,229,255,.4);
  border-radius:10px;
  background:transparent;
  color:#fff;
  cursor:pointer;
}

.authMessage{
  display:none;
  margin-bottom:12px;
  padding:10px;
  border-radius:9px;
  font-size:13px;
  text-align:center;
}

.authMessage.show{
  display:block;
}

.authMessage.error{
  background:rgba(255,60,60,.15);
  color:#ff8585;
}

.authMessage.success{
  background:rgba(0,255,150,.12);
  color:#6fffc0;
}

body.light .authBox{
  background:rgba(255,255,255,.98);
}

body.light .authTitle{
  color:#111;
}

body.light .authInput{
  background:#fff;
  color:#111;
}

body.light .authClose{
  color:#111;
}

   MOBILE
===================================================== */

@media(max-width:700px){

  .header{
    height:64px;
    padding:0 9px;
  }

  .main{
    height:calc(100dvh - 64px);
  }

  .menuBtn{
    width:39px;
    height:39px;
    font-size:29px;
  }

  .robot{
    font-size:27px;
  }

  .brandName{
    font-size:20px;
  }

  .brandSub{
    font-size:10px;
  }

  .lightBtn{
    height:38px;
    padding:0 9px;
    font-size:12px;
  }

  .profileBtn{
    width:38px;
    height:38px;
  }

  .welcome{
    height:57px;
  }

  .welcome h1{
    font-size:25px;
  }

  .welcomeLine{
    width:38px;
  }

    height:calc(100% - 57px);

  }

    padding:17px 14px;

  }

    font-size:17px;
  }

  .chatWelcome{
    padding:18px 14px;
  }

  .bubble{
    max-width:88%;
    font-size:15px;
    padding:10px 12px;
  }

  .inputArea{
    padding:5px 8px max(7px,env(safe-area-inset-bottom));
  }

  .inputBox{
    min-height:55px;
    padding:4px 5px;

  }

  .iconBtn{
    width:40px;
    height:40px;

  }

    width:42px;

  .brandName{
    font-size:18px;

    font-size:9px;

    font-size:11px;
  }

  .profileBtn{
    width:36px;
    height:36px;
  }

  .iconBtn{
    width:38px;
    height:38px;
    flex-basis:38px;
  }

  .sendBtn{
    width:40px;
    height:40px;
    flex-basis:40px;
  }

}

/* =====================================================
   AUTH API
===================================================== */

authSubmit.addEventListener(
  "click",
  async function(){

    const name =
      authName.value.trim();

    const email =
      authEmail.value.trim();

    const password =
      authPassword.value;

    const isSignup =
      authMode === "signup";


    clearAuthMessage();


    if(
      isSignup &&
      !name
    ){

      showAuthMessage(
        "Please enter your name.",
        "error"
      );

      return;

    }


    if(
      !email ||
      !password
    ){

      showAuthMessage(
        "Please enter email and password.",
        "error"
      );

      return;

    }


    if(
      isSignup &&
      password.length < 6
    ){

      showAuthMessage(
        "Password कम से कम 6 अक्षर का होना चाहिए।",
        "error"
      );

      return;

    }


    authSubmit.disabled =
      true;

    authSubmit.textContent =
      isSignup
        ? "Creating Account..."
        : "Logging in...";


    try{

      const endpoint =
        isSignup
          ? "/api/signup"
          : "/api/login";


      const response =
        await fetch(
          API_BASE + endpoint,
          {
            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                isSignup
                  ? {
                      name:
                        name,

                      email:
                        email,

                      password:
                        password
                    }
                  : {
                      email:
                        email,

                      password:
                        password
                    }
              )

          }
        );


      const responseText =
        await response.text();


      let data;

      try{

        data =
          JSON.parse(
            responseText
          );

      }catch(error){

        throw new Error(
          responseText ||
          "Server ने सही response नहीं दिया।"
        );

      }


      if(
        !response.ok
      ){

        throw new Error(
          data.error ||
          "Authentication failed."
        );

      }


      if(
        data.user
      ){

        localStorage.setItem(
          "baatai_user",
          JSON.stringify(
            data.user
          )
        );

      }


      showAuthMessage(
        isSignup
          ? "Account created successfully! ✅"
          : "Login successful! ✅",
        "success"
      );


      updateProfileButton();


      setTimeout(
        function(){

          authOverlay.classList.remove(
            "show"
          );

          authName.value =
            "";

          authEmail.value =
            "";

          authPassword.value =
            "";

        },
        800
      );


    }catch(error){

      console.error(
        "AUTH ERROR:",
        error
      );

      showAuthMessage(
        error.message ||
        "Login में समस्या हुई।",
        "error"
      );

    }finally{

      authSubmit.disabled =
        false;

      authSubmit.textContent =
        authMode === "signup"
          ? "Create Account"
          : "Login";

    }

  }
);

/* =====================================================
   CHAT TITLE
===================================================== */

function makeTitle(text){

  if(!text){

    return "New Chat";

  }

  text =
    text.trim();

  if(
    text.length <= 30
  ){

    return text;

  }

  return (
    text.substring(0,30) +
    "..."
  );

}


/* =====================================================
   RELATIVE TIME
===================================================== */

function relativeTime(time){

  const now =
    Date.now();

  const then =
    new Date(time).getTime();

  if(
    isNaN(then)
  ){

    return "Just now";

  }

  const diff =
    Math.floor(
      (now - then) / 1000
    );


  if(diff < 60){

    return "Just now";

  }


  if(diff < 3600){

    return (
      Math.floor(
        diff / 60
      ) +
      " min ago"
    );

  }


  if(diff < 86400){

    return (
      Math.floor(
        diff / 3600
      ) +
      " hr ago"
    );

  }


  return (
    Math.floor(
      diff / 86400
    ) +
    " days ago"
  );

}


/* =====================================================
   CREATE CHAT
===================================================== */

function createLocalChat(){

  const newChat = {

    id:
      "chat-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8),

    title:
      "New Chat",

    messages: [],

    createdAt:
      new Date().toISOString(),

    updatedAt:
      new Date().toISOString()

  };


  chats.unshift(
    newChat
  );


  currentChat =
    newChat;


  saveChats();

  renderHistory();


  return newChat;

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

  historyList.innerHTML =
    "";


  if(!chats.length){

    historyList.innerHTML = `
      <div class="historyEmpty">
        No previous chats
      </div>
    `;

    return;

  }


  chats.forEach(
    function(chat){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "historyItem";


      if(
        currentChat &&
        currentChat.id === chat.id
      ){

        item.classList.add(
          "active"
        );

      }


      const title =
        escapeHtml(
          chat.title ||
          "New Chat"
        );


      const lastMessage =
        chat.messages &&
        chat.messages.length
          ? chat.messages[
              chat.messages.length - 1
            ]
          : null;


      const snippet =
        lastMessage &&
        lastMessage.content
          ? escapeHtml(
              lastMessage.content
            )
          : "No messages";


      item.innerHTML = `

        <div class="historyItemTitle">
          ${title}
        </div>

        <div class="historyItemSnippet">
          ${snippet}
        </div>

        <div class="historyItemTime">
          ${relativeTime(
            chat.updatedAt
          )}
        </div>

      `;


      item.addEventListener(
        "click",
        function(){

          openChat(
            chat.id
          );

        }
      );


      historyList.appendChild(
        item
      );

    }
  );

}

/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(chatId){

  const foundChat =
    chats.find(
      function(c){

        return c.id === chatId;

      }
    );


  if(!foundChat){

    return;

  }


  currentChat =
    foundChat;


  chatMessages.innerHTML =
    "";


  if(
    !currentChat.messages ||
    !currentChat.messages.length
  ){

    showWelcome();

  }else{

    currentChat.messages.forEach(
      function(message){

        addMessage(
          message.role,
          message.content,
          message.image
        );

      }
    );

  }


  renderHistory();


  if(
    window.innerWidth <= 800
  ){

    sidebar.classList.remove(
      "open"
    );

  }

}

/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  content,
  image = null
){

  const welcome =
    document.getElementById(
      "welcome"
    );


  if(welcome){

    welcome.remove();

  }


  const messageDiv =
    document.createElement(
      "div"
    );


  messageDiv.className =
    role === "user"
      ? "message userMessage"
      : "message aiMessage";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  if(image){

    const img =
      document.createElement(
        "img"
      );


    img.src =
      image;

    img.className =
      "uploadedImage";

    img.alt =
      "Uploaded image";


    bubble.appendChild(
      img
    );

  }


  if(content){

    const textDiv =
      document.createElement(
        "div"
      );


    textDiv.innerHTML =
      formatMessage(
        content
      );


    bubble.appendChild(
      textDiv
    );

  }


  messageDiv.appendChild(
    bubble
  );


  chatMessages.appendChild(
    messageDiv
  );


  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


/* =====================================================
   FORMAT MESSAGE
===================================================== */

function formatMessage(text){

  if(!text){

    return "";

  }


  return escapeHtml(
    text
  )
  .replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  )
  .replace(
    /\n/g,
    "<br>"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

  if(
    text === null ||
    text === undefined
  ){

    return "";

  }


  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   SAVE CURRENT MESSAGE
===================================================== */

function saveCurrentMessage(
  role,
  content,
  image = null
){

  if(!currentChat){

    currentChat =
      createLocalChat();

  }


  if(
    !currentChat.messages
  ){

    currentChat.messages =
      [];

  }


  currentChat.messages.push({

    role:
      role,

    content:
      content || "",

    image:
      image || null,

    timestamp:
      new Date().toISOString()

  });


  currentChat.updatedAt =
    new Date().toISOString();


  if(
    role === "user" &&
    content &&
    (
      !currentChat.title ||
      currentChat.title === "New Chat"
    )
  ){

    currentChat.title =
      makeTitle(
        content
      );

  }


  saveChats();

  renderHistory();

}

    );


  typing.id =
    "typingIndicator";


  typing.className =
    "message aiMessage";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.innerHTML = `

    <div class="typing">

      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  `;


  typing.appendChild(
    bubble
  );


  chatMessages.appendChild(
    typing
  );


  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


/* =====================================================
   HIDE TYPING
===================================================== */

function hideTyping(){

  const typing =
    document.getElementById(
      "typingIndicator"
    );


  if(typing){

    typing.remove();

  }

}


/* =====================================================
   CAMERA BUTTON
===================================================== */

cameraBtn.addEventListener(
  "click",

    imageInput.click();

  }
);


/* =====================================================
   IMAGE UPLOAD
===================================================== */

imageInput.addEventListener(
  "change",
  function(event){

    const file =
      event.target.files &&
      event.target.files[0];


    if(!file){

      return;

    }


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      alert(
        "Please select an image file."
      );

      imageInput.value =
        "";

      return;

    }


    const maxSize =
      10 * 1024 * 1024;


    if(
      file.size > maxSize
    ){

      alert(
        "Image 10MB से छोटी होनी चाहिए।"
      );

      imageInput.value =
        "";

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(e){

        selectedImage =
          e.target.result;


        imagePreview.innerHTML = `

          <div
            style="
              position:relative;
              display:inline-block;
            "
          >

            <img
              src="${selectedImage}"
              alt="Selected image"
            >

            <button
              type="button"
              id="removeImageBtn"
              style="
                position:absolute;
                top:-8px;
                right:-8px;
                width:24px;
                height:24px;
                border:none;
                border-radius:50%;
                background:#ff3b30;
                color:white;
                cursor:pointer;
                font-size:17px;
              "
            >
              ×
            </button>

          </div>

        `;


        imagePreview.style.display =
          "block";


        const removeBtn =
          document.getElementById(
            "removeImageBtn"
          );


        if(removeBtn){

          removeBtn.addEventListener(
            "click",
            function(){

              selectedImage =
                null;

              imageInput.value =
                "";

              imagePreview.innerHTML =
                "";

              imagePreview.style.display =
                "none";

            }
          );

        }

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =====================================================
   VISITOR ID
===================================================== */

function getVisitorId(){

  let visitorId =
    localStorage.getItem(
      "baatai-visitor-id"
    );


  if(!visitorId){

    try{

      visitorId =
        crypto.randomUUID();

    }catch(error){

      visitorId =
        "visitor-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2);

    }


    localStorage.setItem(
      "baatai-visitor-id",
      visitorId
    );

  }


  return visitorId;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const message =
    messageInput.value.trim();

  const imageToSend =
    selectedImage;


  if(
    !message &&
    !imageToSend
  ){

    return;

  }


  const visitorId =
    getVisitorId();


  if(!currentChat){

    currentChat =
      createLocalChat();

  }


  addMessage(
    "user",
    message,
    imageToSend
  );


  saveCurrentMessage(
    "user",
    message,
    imageToSend
  );


  messageInput.value =
    "";

  messageInput.style.height =
    "42px";


  selectedImage =
    null;

  imageInput.value =
    "";

  imagePreview.innerHTML =
    "";

  imagePreview.style.display =
    "none";


  sendBtn.disabled =
    true;


  showTyping();


  try{

    const conversation =
      currentChat.messages
        .map(
          function(item){

            return {

              role:
                item.role,

              content:
                item.content || ""

            };

          }
        );


    const response =
      await fetch(
        API_BASE +
        "/api/chat",
        {
          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                message,

              image:
                imageToSend || null,

              conversation:
                conversation,

              visitorId:
                visitorId

            })

        }
      );


    const responseText =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(
          responseText
        );

    }catch(error){

      throw new Error(
        responseText ||
        "Server ने सही response नहीं दिया।"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI response नहीं मिला।"
      );

    }


    const reply =
      data.reply;


    if(
      typeof reply !== "string" ||
      !reply.trim()
    ){

      throw new Error(
        "AI ने कोई जवाब नहीं दिया।"
      );

    }


    hideTyping();


    addMessage(
      "assistant",
      reply.trim()
    );


    saveCurrentMessage(
      "assistant",
      reply.trim()
    );


  }catch(error){

    hideTyping();


    console.error(
      "CHAT ERROR:",
      error
    );


    addMessage(
      "assistant",
      "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।"
    );

  }finally{

    sendBtn.disabled =
      false;

    messageInput.focus();

  }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendBtn.addEventListener(
  "click",
  function(){

    sendMessage();

  }
);


/* =====================================================
   ENTER TO SEND

messageInput.addEventListener(

/* =====================================================
   MIC / VOICE
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "hi-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  let listening =
    false;


  micBtn.addEventListener(
    "click",
    function(){

      if(listening){

        recognition.stop();

        return;

      }


      try{

        recognition.start();

      }catch(error){

        console.log(
          "Mic start error:",
          error
        );

      }

    }
  );


  recognition.onstart =
    function(){

      listening =
        true;


      micBtn.classList.add(
        "listening"
      );

    };


  recognition.onend =
    function(){

      listening =
        false;


      micBtn.classList.remove(
        "listening"
      );

    };


  recognition.onresult =
    function(event){

      const transcript =
        event.results[0][0]
          .transcript;


      messageInput.value =
        transcript;


      messageInput.dispatchEvent(
        new Event(
          "input"
        )
      );

    };


  recognition.onerror =
    function(event){

      console.log(
        "Speech recognition error:",
        event.error
      );


      listening =
        false;


      micBtn.classList.remove(
        "listening"
      );

    };

}else{

  micBtn.addEventListener(
    "click",
    function(){

      alert(
        "Aapke browser me voice input support nahi hai."
      );

    }
  );

}
