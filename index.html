<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Cartoon Story Maker</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff3e0,#e3f2fd);
  color:#222;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#6a1b9a,#1565c0);
  color:white;
  padding:25px 15px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.2);
}

header h1{
  font-size:28px;
  margin-bottom:8px;
}

header p{
  font-size:14px;
  opacity:.9;
}

.container{
  width:95%;
  max-width:900px;
  margin:20px auto;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.card h2{
  color:#6a1b9a;
  margin-bottom:15px;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 7px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

textarea{
  min-height:130px;
  resize:vertical;
}

input:focus,textarea:focus,select:focus{
  border-color:#6a1b9a;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

.primary{
  background:linear-gradient(135deg,#7b1fa2,#1976d2);
  color:white;
  width:100%;
}

.secondary{
  background:#eeeeee;
  color:#333;
}

.success{
  background:#2e7d32;
  color:white;
}

button:active{
  transform:scale(.98);
}

.result{
  display:none;
}

.story-box{
  background:#f7f7ff;
  border-left:5px solid #7b1fa2;
  padding:15px;
  border-radius:10px;
  margin-top:12px;
  white-space:pre-wrap;
  line-height:1.6;
}

.scene{
  background:#fff8e1;
  border-radius:14px;
  padding:16px;
  margin-top:15px;
  border:1px solid #ffe082;
}

.scene h3{
  color:#e65100;
  margin-bottom:10px;
}

.prompt{
  background:#f3e5f5;
  padding:12px;
  border-radius:10px;
  line-height:1.5;
  margin-top:8px;
}

.dialogue{
  background:#e8f5e9;
  padding:12px;
  border-radius:10px;
  line-height:1.5;
  margin-top:8px;
}

.character{
  background:#e3f2fd;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
  line-height:1.5;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.actions button{
  width:100%;
}

footer{
  text-align:center;
  padding:25px;
  color:#666;
  font-size:13px;
}

.loading{
  display:none;
  text-align:center;
  padding:20px;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #ddd;
  border-top:4px solid #7b1fa2;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

@media(max-width:600px){
  header h1{
    font-size:23px;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎬 AI Cartoon Story Maker</h1>
  <p>कहानी से Cartoon Scenes, Image Prompts और Dialogues बनाएं ✨</p>
</header>

<div class="container">

  <div class="card">
    <h2>📝 अपनी कहानी बनाएं</h2>

    <label>कहानी का विषय</label>
    <input
      id="topic"
      type="text"
      placeholder="जैसे: बरसात में एक छोटे बच्चे की कहानी"
    >

    <label>कहानी की भाषा</label>
    <select id="language">
      <option value="Hindi">हिंदी</option>
      <option value="English">English</option>
    </select>

    <label>कहानी की लंबाई</label>
    <select id="length">
      <option value="30">30 सेकंड</option>
      <option value="40" selected>40 सेकंड</option>
      <option value="60">60 सेकंड</option>
    </select>

    <label>Style</label>
    <select id="style">
      <option value="2D Ghibli inspired cartoon style">
        2D Ghibli inspired cartoon style
      </option>
      <option value="2D colorful children's cartoon">
        2D Colorful Children's Cartoon
      </option>
      <option value="3D cartoon">
        3D Cartoon
      </option>
    </select>

    <button class="primary" onclick="generateStory()">
      ✨ कहानी तैयार करें
    </button>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top:10px">कहानी तैयार हो रही है...</p>
    </div>
  </div>

  <div class="card result" id="result">

    <h2>📖 आपकी कहानी</h2>

    <div class="story-box" id="story"></div>

    <h2 style="margin-top:25px">👤 Characters</h2>

    <div id="characters"></div>

    <h2 style="margin-top:25px">🎬 Scenes</h2>

    <div id="scenes"></div>

    <div class="actions">
      <button class="secondary" onclick="copyAll()">
        📋 Copy
      </button>

      <button class="success" onclick="downloadStory()">
        📥 Download
      </button>
    </div>

  </div>

</div>

<footer>
  ❤️ AI Cartoon Story Maker
  <br>
  बच्चों के लिए मजेदार और creative stories बनाएं 🎨
</footer>

<script>

function generateStory(){

  const topic =
    document.getElementById("topic").value.trim();

  const language =
    document.getElementById("language").value;

  const length =
    document.getElementById("length").value;

  const style =
    document.getElementById("style").value;

  if(!topic){
    alert("कृपया पहले कहानी का विषय लिखें।");
    return;
  }

  document.getElementById("loading").style.display="block";

  setTimeout(function(){

    const story =
`एक छोटे से गाँव में आरव नाम का प्यारा बच्चा रहता था।
एक दिन ${topic} शुरू हुई।

आरव ने अपने दोस्तों के साथ मिलकर एक मजेदार काम करने का फैसला किया।
रास्ते में उसे एक छोटी सी परेशानी दिखाई दी।

आरव ने हिम्मत नहीं छोड़ी और अपने दोस्तों की मदद से समस्या को हल कर दिया।
अंत में सभी बच्चे खुशी-खुशी घर लौटे।

सीख: मिल-जुलकर काम करने से बड़ी से बड़ी परेशानी आसान हो जाती है।`;

    document.getElementById("story").innerText=story;

    const characters = [

      {
        name:"आरव 👦",
        detail:
        `8 साल का प्यारा भारतीय बच्चा, गोल चेहरा, बड़ी चमकदार आंखें,
छोटे काले बाल, पीली टी-शर्ट, नीली शॉर्ट्स, छोटे जूते,
friendly smile, ${style}`
      },

      {
        name:"आरव का दोस्त 👦",
        detail:
        `8 साल का खुशमिजाज बच्चा, छोटे काले बाल,
हरा टी-शर्ट, भूरे शॉर्ट्स, मासूम चेहरा,
${style}`
      },

      {
        name:"छोटी बिल्ली 🐱",
        detail:
        `छोटी प्यारी सफेद बिल्ली, बड़ी गोल आंखें,
छोटे कान, fluffy tail, cute expression,
${style}`
      }

    ];

    let characterHTML="";

    characters.forEach(function(c){

      characterHTML += `
        <div class="character">
          <strong>${c.name}</strong>
          <p>${c.detail}</p>
        </div>
      `;

    });

    document.getElementById("characters").innerHTML=characterHTML;

    const scenes = [

      {
        title:"Scene 1 — गाँव का दृश्य 🌳",
        description:
        "सुबह का सुंदर गाँव, छोटे घर, हरे पेड़ और हल्की धूप। आरव अपने घर के बाहर खड़ा है।",
        prompt:
        `Beautiful Indian village, small colorful houses, green trees,
morning sunlight, cute little boy standing outside his home,
child friendly atmosphere, ${style}, cinematic composition`,
        dialogue:
        `आरव: "वाह! आज का दिन कितना सुंदर है!"`
      },

      {
        title:"Scene 2 — कहानी की शुरुआत 🌧️",
        description:
        `आरव देखता है कि ${topic} हो रही है।`,
        prompt:
        `Cute little Indian boy watching the situation,
emotional but happy expression, beautiful environment,
soft lighting, colorful children's cartoon,
${style}`,
        dialogue:
        `आरव: "हमें कुछ करना चाहिए!"`
      },

      {
        title:"Scene 3 — दोस्तों की मदद 🤝",
        description:
        "आरव अपने दोस्त के साथ मिलकर समस्या को हल करने की कोशिश करता है।",
        prompt:
        `Two cute children working together,
helping each other, positive emotions,
bright colorful background, expressive faces,
${style}`,
        dialogue:
        `दोस्त: "चिंता मत करो आरव, हम मिलकर इसे ठीक कर देंगे!"`
      },

      {
        title:"Scene 4 — खुशी का पल 😊",
        description:
        "समस्या हल हो जाती है और सभी बच्चे खुशी से मुस्कुराते हैं।",
        prompt:
        `Happy children smiling together after solving a problem,
warm sunlight, joyful atmosphere,
cute expressions, colorful environment,
${style}`,
        dialogue:
        `आरव: "देखा! साथ मिलकर हम कुछ भी कर सकते हैं!"`
      },

      {
        title:"Scene 5 — Ending 🌈",
        description:
        "आरव और उसके दोस्त खुशी-खुशी घर की ओर जाते हैं।",
        prompt:
        `Cute children walking home together,
beautiful sunset, colorful sky, peaceful village,
heartwarming ending, children's cartoon,
${style}`,
        dialogue:
        `सभी: "दोस्ती और मदद सबसे बड़ी ताकत है!"`
      }

    ];

    let sceneHTML="";

    scenes.forEach(function(scene){

      sceneHTML += `
        <div class="scene">

          <h3>${scene.title}</h3>

          <p>
            <strong>📌 Scene:</strong>
            ${scene.description}
          </p>

          <div class="prompt">
            <strong>🎨 Image Prompt:</strong>
            <br>
            ${scene.prompt}
          </div>

          <div class="dialogue">
            <strong>🎙️ Dialogue:</strong>
            <br>
            ${scene.dialogue}
          </div>

        </div>
      `;

    });

    document.getElementById("scenes").innerHTML=sceneHTML;

    document.getElementById("loading").style.display="none";
    document.getElementById("result").style.display="block";

    document.getElementById("result")
      .scrollIntoView({behavior:"smooth"});

  },1000);

}


function getAllText(){

  const story =
    document.getElementById("story").innerText;

  const characters =
    document.getElementById("characters").innerText;

  const scenes =
    document.getElementById("scenes").innerText;

  return `
AI CARTOON STORY MAKER

====================
STORY
====================

${story}

====================
CHARACTERS
====================

${characters}

====================
SCENES
====================

${scenes}

====================
Generated by AI Cartoon Story Maker
====================
`;

}


function copyAll(){

  navigator.clipboard.writeText(getAllText())
    .then(function(){

      alert("✅ पूरा content copy हो गया!");

    })
    .catch(function(){

      alert("Copy नहीं हो पाया।");

    });

}


function downloadStory(){

  const text=getAllText();

  const blob=new Blob(
    [text],
    {type:"text/plain;charset=utf-8"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="cartoon-story.txt";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);

}


</script>

</body>
</html>
