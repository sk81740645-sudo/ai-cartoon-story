<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BaatAI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   BACKGROUND VIDEO
========================= */

#bgVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

.video-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,8,15,0.45);
    z-index:-2;
}

/* =========================
   MAIN APP
========================= */

.app{
    width:100%;
    height:100vh;
    color:white;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* =========================
   HEADER
========================= */

.header{
    height:112px;
    min-height:112px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 28px;

    border-bottom:1px solid rgba(0,220,255,0.20);

    background:rgba(0,5,10,0.70);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

/* LEFT */

.header-left{
    display:flex;
    align-items:center;
    gap:22px;
}

.menu{
    width:55px;
    height:55px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:7px;

    cursor:pointer;
}

.menu span{
    width:42px;
    height:4px;

    border-radius:10px;

    background:white;

    display:block;
}

/* LOGO */

.logo-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:42px;
}

.brand{
    font-size:34px;
    font-weight:700;
    line-height:1;
}

.subtitle{
    color:#00eaff;
    font-size:20px;
    margin-top:5px;
}

/* RIGHT */

.header-right{
    display:flex;
    align-items:center;
    gap:14px;
}

.theme-btn{
    height:58px;
    padding:0 20px;

    border:1px solid rgba(0,238,255,0.65);
    border-radius:18px;

    background:rgba(0,20,25,0.55);
    color:white;

    font-size:22px;

    cursor:pointer;
}

.profile{
    width:58px;
    height:58px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;

    border:1px solid #00dff5;

    background:rgba(0,65,75,0.65);
}

/* =========================
   CHAT AREA
========================= */

.chat-area{
    flex:1;
    overflow-y:auto;

    padding:20px 30px 145px;

    scroll-behavior:smooth;
}

.chat-area::-webkit-scrollbar{
    width:5px;
}

.chat-area::-webkit-scrollbar-thumb{
    background:#00dce8;
    border-radius:10px;
}

/* =========================
   WELCOME
========================= */

.welcome-title{
    height:65px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:18px;

    color:#00efff;

    font-size:31px;
    font-weight:600;

    margin-bottom:10px;
}

.welcome-title::before,
.welcome-title::after{
    content:"";

    width:150px;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        #00eaff
    );
}

.welcome-title::after{
    background:linear-gradient(
        90deg,
        #00eaff,
        transparent
    );
}

/* =========================
   MESSAGES
========================= */

.message{
    display:flex;
    margin:14px 0;
}

.message.user{
    justify-content:flex-end;
}

.message.ai{
    justify-content:flex-start;
}

.bubble{
    max-width:70%;

    padding:22px 30px;

    border-radius:28px;

    font-size:21px;
    line-height:1.65;

    white-space:pre-wrap;

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

/* USER */

.user .bubble{
    border:1px solid #00eaff;

    background:rgba(0,40,48,0.65);

    border-top-right-radius:8px;
}

/* AI */

.ai .bubble{
    border:1px solid rgba(0,235,255,0.55);

    background:rgba(0,20,25,0.62);

    border-top-left-radius:8px;
}

/* =========================
   IMAGE MESSAGE
========================= */

.chat-image{
    max-width:300px;
    width:100%;

    display:block;

    margin-top:12px;

    border-radius:18px;

    border:1px solid #00eaff;
}

/* =========================
   BOTTOM INPUT
========================= */

.input-area{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:125px;

    display:flex;
    align-items:center;

    padding:15px 22px;

    background:rgba(0,7,12,0.82);

    border-top:1px solid rgba(0,230,255,0.25);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    z-index:20;
}

/* INPUT BOX */

.input-box{
    width:100%;
    height:82px;

    display:flex;
    align-items:center;

    border:1px solid rgba(0,235,255,0.60);

    border-radius:42px;

    background:rgba(0,20,25,0.72);

    padding:8px 12px 8px 18px;
}

/* CAMERA */

.icon-btn{
    width:64px;
    height:64px;

    flex-shrink:0;

    border-radius:50%;

    border:1px solid #00eaff;

    background:rgba(0,50,60,0.55);

    color:#00eaff;

    font-size:29px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.icon-btn:active{
    transform:scale(.94);
}

/* TEXT INPUT */

#messageInput{
    flex:1;

    height:60px;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-size:22px;

    padding:0 18px;

    min-width:0;
}

#messageInput::placeholder{
    color:#9da9ad;
}

/* MIC */

.mic-btn{
    width:60px;
    height:60px;

    border:none;

    border-radius:50%;

    background:transparent;

    color:#00eaff;

    font-size:29px;

    cursor:pointer;
}

.mic-btn.listening{
    background:#00eaff;
    color:#001014;
}

/* SEND */

.send-btn{
    width:70px;
    height:70px;

    flex-shrink:0;

    border:none;

    border-radius:50%;

    background:white;

    color:#000;

    font-size:37px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 15px rgba(255,255,255,0.25);
}

.send-btn:active{
    transform:scale(.92);
}

.send-btn:disabled{
    opacity:.5;
}

/* =========================
   TYPING
========================= */

.typing{
    display:inline-flex;
    gap:5px;
    padding:5px;
}

.typing span{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#00eaff;

    animation:blink 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.2s;
}

.typing span:nth-child(3){
    animation-delay:.4s;
}

@keyframes blink{
    0%,100%{
        opacity:.2;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-4px);
    }
}

/* =========================
   LIGHT MODE
========================= */

body.light .video-overlay{
    background:rgba(255,255,255,0.68);
}

body.light .header{
    background:rgba(255,255,255,0.80);
    color:#111;
}

body.light .menu span{
    background:#111;
}

body.light .brand{
    color:#111;
}

body.light .theme-btn{
    color:#111;
    background:rgba(255,255,255,0.75);
}

body.light .profile{
    color:#111;
}

body.light .input-area{
    background:rgba(255,255,255,0.82);
}

body.light .input-box{
    background:rgba(255,255,255,0.72);
}

body.light #messageInput{
    color:#111;
}

body.light .ai .bubble{
    color:#111;
    background:rgba(255,255,255,0.72);
}

body.light .user .bubble{
    color:#111;
    background:rgba(255,255,255,0.70);
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header{
        height:110px;
        min-height:110px;
        padding:12px 18px;
    }

    .header-left{
        gap:12px;
    }

    .menu{
        width:42px;
    }

    .menu span{
        width:35px;
        height:4px;
    }

    .logo{
        font-size:32px;
    }

    .brand{
        font-size:29px;
    }

    .subtitle{
        font-size:17px;
    }

    .theme-btn{
        height:54px;
        padding:0 14px;
        font-size:18px;
    }

    .profile{
        width:54px;
        height:54px;
    }

    .chat-area{
        padding:12px 16px 135px;
    }

    .welcome-title{
        font-size:28px;
        height:62px;
    }

    .welcome-title::before,
    .welcome-title::after{
        width:75px;
    }

    .bubble{
        max-width:76%;
        padding:17px 22px;
        font-size:20px;
        line-height:1.55;
    }

    .input-area{
        height:115px;
        padding:10px 15px;
    }

    .input-box{
        height:72px;
        padding:5px 8px 5px 10px;
    }

    .icon-btn{
        width:54px;
        height:54px;
        font-size:25px;
    }

    .mic-btn{
        width:52px;
        height:52px;
        font-size:25px;
    }

    #messageInput{
        font-size:18px;
        padding:0 8px;
    }

    .send-btn{
        width:62px;
        height:62px;
        font-size:32px;
    }
}

@media(max-width:430px){

    .theme-btn{
        padding:0 10px;
        font-size:16px;
    }

    .profile{
        width:48px;
        height:48px;
    }

    .brand{
        font-size:25px;
    }

    .logo{
        font-size:28px;
    }

    .subtitle{
        font-size:14px;
    }

    .header{
        padding:10px 12px;
    }

    .header-right{
        gap:7px;
    }

    .welcome-title{
        font-size:25px;
    }

    .bubble{
        max-width:84%;
        font-size:18px;
    }
}
</style>
</head>

<body>

<!-- =========================
     BACKGROUND VIDEO
========================= -->

<video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline
    preload="auto">

    <source src="background.mp4" type="video/mp4">

</video>

<div class="video-overlay"></div>

<!-- =========================
     APP
========================= -->

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <div class="menu" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="logo-box">

                <div class="logo">🤖</div>

                <div>
                    <div class="brand">BaatAI</div>
                    <div class="subtitle">AI Study</div>
                </div>

            </div>

        </div>


        <div class="header-right">

            <button
                class="theme-btn"
                id="themeBtn"
                onclick="toggleTheme()">

                ☀️ Light

            </button>

            <div
                class="profile"
                id="profile">

                S

            </div>

        </div>

    </header>


    <!-- CHAT -->

    <main
        class="chat-area"
        id="chatArea">

        <!-- WELCOME -->

        <div class="welcome-title">
            Welcome
        </div>


        <!-- INITIAL AI MESSAGE -->

        <div class="message ai">

            <div class="bubble">

Hello! 👋 I am your AI Study Buddy.

How can I help you today?

Whether you want to understand a tricky school/college concept, learn about the Indian Constitution, or practice your English speaking skills, I've got your back!

Bataiye, kya padhna hai?

            </div>

        </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-box">

            <!-- CAMERA -->

            <button
                class="icon-btn"
                onclick="openImagePicker()"
                title="Upload image">

                📷

            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
                onchange="handleImage(event)"
            >


            <!-- TEXT -->

            <input
                id="messageInput"
                type="text"
                placeholder="Type your message..."
                autocomplete="off"
            >


            <!-- MIC -->

            <button
                class="mic-btn"
                id="micBtn"
                onclick="startVoice()"
                title="Voice input">

                🎙️

            </button>


            <!-- SEND -->

            <button
                class="send-btn"
                id="sendBtn"
                onclick="sendMessage()">

                ➤

            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

const chatArea =
    document.getElementById("chatArea");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const imageInput =
    document.getElementById("imageInput");

const micBtn =
    document.getElementById("micBtn");

let selectedImage = null;


/* =========================
   OPEN IMAGE PICKER
========================= */

function openImagePicker(){

    imageInput.click();

}


/* =========================
   HANDLE IMAGE
========================= */

function handleImage(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        selectedImage =
            e.target.result;

        input.placeholder =
            "Ask something about this image...";

    };

    reader.readAsDataURL(file);

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    text,
    type,
    image = null
){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    if(text){
        bubble.textContent = text;
    }

    if(image){

        const img =
            document.createElement("img");

        img.src = image;

        img.className =
            "chat-image";

        bubble.appendChild(img);

    }

    message.appendChild(bubble);

    chatArea.appendChild(message);

    scrollBottom();

}


/* =========================
   TYPING
========================= */

function showTyping(){

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.id =
        "typingMessage";

    message.innerHTML = `
        <div class="bubble">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    chatArea.appendChild(message);

    scrollBottom();

}


/* =========================
   REMOVE TYPING
========================= */

function removeTyping(){

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if(typing){
        typing.remove();
    }

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const message =
        input.value.trim();

    if(!message && !selectedImage){
        return;
    }

    const image =
        selectedImage;

    addMessage(
        message || "Image",
        "user",
        image
    );

    input.value = "";

    selectedImage = null;

    imageInput.value = "";

    input.placeholder =
        "Type your message...";

    sendBtn.disabled = true;

    showTyping();

    try{

        const response =
            await fetch(
                "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:
                            message || "Please analyze this image.",

                        image:
                            image || null

                    })
                }
            );


        const data =
            await response.json();


        removeTyping();


        if(!response.ok){

            addMessage(
                data.error ||
                "Something went wrong. Please try again.",
                "ai"
            );

            return;
        }


        addMessage(
            data.reply ||
            "I could not generate a response.",
            "ai"
        );


    }catch(error){

        console.error(error);

        removeTyping();

        addMessage(
            "Unable to connect to BaatAI server. Please try again.",
            "ai"
        );

    }finally{

        sendBtn.disabled = false;

        input.focus();

    }

}


/* =========================
   ENTER TO SEND
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   SCROLL
========================= */

function scrollBottom(){

    setTimeout(() => {

        chatArea.scrollTop =
            chatArea.scrollHeight;

    },50);

}


/* =========================
   LIGHT / DARK
========================= */

function toggleTheme(){

    document.body.classList.toggle(
        "light"
    );

    const btn =
        document.getElementById(
            "themeBtn"
        );

    if(
        document.body.classList.contains(
            "light"
        )
    ){

        btn.textContent =
            "🌙 Dark";

    }else{

        btn.textContent =
            "☀️ Light";

    }

}


/* =========================
   MENU
========================= */

function toggleMenu(){

    alert(
        "BaatAI Menu"
    );

}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";

    recognition.interimResults =
        false;

    recognition.continuous =
        false;


    micBtn.classList.add(
        "listening"
    );


    recognition.start();


    recognition.onresult =
        function(event){

            const transcript =
                event.results[0][0].transcript;

            input.value =
                transcript;

        };


    recognition.onerror =
        function(error){

            console.log(
                "Voice error:",
                error
            );

        };


    recognition.onend =
        function(){

            micBtn.classList.remove(
                "listening"
            );

        };

}


/* =========================
   PROFILE LETTER
========================= */

function setProfile(){

    try{

        const user =
            JSON.parse(
                localStorage.getItem(
                    "user"
                )
            );

        if(user && user.name){

            document.getElementById(
                "profile"
            ).textContent =
                user.name
                    .charAt(0)
                    .toUpperCase();

        }

    }catch(e){

        console.log(e);

    }

}

setProfile();


/* =========================
   VIDEO PLAY
========================= */

const video =
    document.getElementById(
        "bgVideo"
    );

video.play().catch(() => {

    console.log(
        "Video autoplay waiting..."
    );

});

</script>

</body>
</html>
