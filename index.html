<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BaatAI - AI Assistant</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  height:100vh;
}

button,input{
  font-family:Arial,sans-serif;
}

.hidden{
  display:none!important;
}

/* =========================
AUTH
========================= */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f5f7fb;
}

.auth-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.auth-logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px;
}

.auth-subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  margin-bottom:22px;
  border-bottom:1px solid #e5e7eb;
}

.tab{
  flex:1;
  padding:12px;
  border:none;
  background:transparent;
  cursor:pointer;
  font-size:16px;
}

.tab.active{
  color:#2563eb;
  border-bottom:2px solid #2563eb;
  font-weight:bold;
}

.auth-form label{
  display:block;
  margin:12px 0 6px;
  font-size:14px;
  font-weight:bold;
}

.auth-form input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.auth-submit{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.auth-message{
  text-align:center;
  margin-top:15px;
  min-height:20px;
  font-size:14px;
}

.switch-text{
  text-align:center;
  margin-top:15px;
  color:#555;
  font-size:14px;
}

.switch-btn{
  border:none;
  background:none;
  color:#2563eb;
  cursor:pointer;
  font-weight:bold;
}

/* =========================
APP
========================= */

.app{
  height:100vh;
  display:flex;
}

.sidebar{
  width:270px;
  background:#111827;
  color:white;
  padding:20px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.logo{
  font-size:27px;
  font-weight:bold;
  margin-bottom:20px;
}

.new-chat,
.logout-btn{
  width:100%;
  padding:13px;
  border:1px solid #374151;
  background:#1f2937;
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.new-chat:hover,
.logout-btn:hover{
  background:#374151;
}

.chat-history-title{
  margin-top:25px;
  margin-bottom:10px;
  color:#9ca3af;
  font-size:13px;
  font-weight:bold;
}

.chat-list{
  flex:1;
  overflow-y:auto;
  padding-right:3px;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:7px;
}

.chat-open{
  flex:1;
  min-width:0;
  padding:11px;
  border:none;
  border-radius:8px;
  background:transparent;
  color:#e5e7eb;
  text-align:left;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-open:hover,
.chat-open.active{
  background:#374151;
}

.delete-chat{
  width:32px;
  height:32px;
  border:none;
  border-radius:7px;
  background:transparent;
  color:#9ca3af;
  cursor:pointer;
}

.delete-chat:hover{
  background:#7f1d1d;
  color:white;
}

.no-chats{
  color:#6b7280;
  font-size:13px;
  padding:10px 3px;
}

.logout-btn{
  margin-top:12px;
}

.user-info{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #374151;
  color:#d1d5db;
  font-size:13px;
  word-break:break-word;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.header{
  height:65px;
  background:white;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-size:21px;
  font-weight:bold;
}

.menu-btn{
  display:none;
  border:none;
  background:transparent;
  font-size:28px;
  cursor:pointer;
  margin-right:12px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:25px;
}

.welcome{
  text-align:center;
  margin-top:100px;
}

.welcome h1{
  font-size:34px;
  color:#111827;
  margin-bottom:10px;
}

.welcome p{
  color:#6b7280;
}

.message{
  max-width:850px;
  margin:15px auto;
  display:flex;
}

.user{
  justify-content:flex-end;
}

.bubble{
  max-width:75%;
  padding:13px 17px;
  border-radius:15px;
  line-height:1.5;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user .bubble{
  background:#2563eb;
  color:white;
  border-bottom-right-radius:4px;
}

.ai .bubble{
  background:white;
  color:#111827;
  border:1px solid #e5e7eb;
  border-bottom-left-radius:4px;
}

.input-area{
  background:white;
  border-top:1px solid #e5e7eb;
  padding:15px;
}

.input-box{
  max-width:850px;
  margin:auto;
  display:flex;
  gap:10px;
}

#messageInput{
  flex:1;
  padding:14px 16px;
  border:1px solid #d1d5db;
  border-radius:12px;
  outline:none;
  font-size:16px;
}

#sendBtn{
  width:55px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:20px;
  cursor:pointer;
}

#sendBtn:disabled{
  background:#9ca3af;
}

/* =========================
MOBILE
========================= */

@media(max-width:700px){

  .menu-btn{
    display:block;
  }

  .sidebar{
    display:none;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
  }

  .sidebar.active{
    display:flex;
  }

  .chat{
    padding:15px;
  }

  .bubble{
    max-width:90%;
  }

  .welcome{
    margin-top:70px;
  }

}

</style>
</head>

<body>

<!-- =========================
AUTH SCREEN
========================= -->

<section id="authScreen">

<div class="auth-box">

<div class="auth-logo">
🤖 BaatAI
</div>

<div class="auth-subtitle">
BaatAI इस्तेमाल करने के लिए Login करें
</div>

<div class="tabs">

<button
class="tab active"
id="loginTab"
onclick="showLogin()">
Login
</button>

<button
class="tab"
id="signupTab"
onclick="showSignup()">
Sign Up
</button>

</div>

<form
id="loginForm"
class="auth-form">

<label>Email</label>

<input
id="loginEmail"
type="email"
placeholder="अपना Email डालें"
required>

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="अपना Password डालें"
required>

<button
id="loginBtn"
class="auth-submit"
type="submit">
Login
</button>

</form>

<form
id="signupForm"
class="auth-form hidden">

<label>Name</label>

<input
id="signupName"
type="text"
placeholder="अपना नाम डालें"
required>

<label>Email</label>

<input
id="signupEmail"
type="email"
placeholder="अपना Email डालें"
required>

<label>Password</label>

<input
id="signupPassword"
type="password"
placeholder="कम से कम 6 अक्षर"
minlength="6"
required>

<button
id="signupBtn"
class="auth-submit"
type="submit">
Create Account
</button>

</form>

<div
id="authMessage"
class="auth-message">
</div>

<div
id="loginSwitch"
class="switch-text">

नया account बनाना है?

<button
class="switch-btn"
onclick="showSignup()">
Sign Up
</button>

</div>

<div
id="signupSwitch"
class="switch-text hidden">

पहले से account है?

<button
class="switch-btn"
onclick="showLogin()">
Login
</button>

</div>

</div>
</section>


<!-- =========================
APP
========================= -->

<div
id="appScreen"
class="app hidden">

<aside
id="sidebar"
class="sidebar">

<div class="logo">
🤖 BaatAI
</div>

<button
class="new-chat"
onclick="newChat()">
＋ New Chat
</button>

<div class="chat-history-title">
🕘 Previous Chats
</div>

<div
id="chatList"
class="chat-list">
</div>

<button
class="logout-btn"
onclick="logout()">
🚪 Logout
</button>

<div
id="userInfo"
class="user-info">
</div>

</aside>


<main class="main">

<header class="header">

<button
class="menu-btn"
onclick="toggleMenu()">
☰
</button>

<span>
🤖 BaatAI
</span>

</header>


<section
id="chat"
class="chat">

<div
id="welcome"
class="welcome">

<h1>
Hello 👋
</h1>

<p>
BaatAI से कुछ भी पूछिए...
</p>

</div>

</section>


<div class="input-area">

<div class="input-box">

<input
id="messageInput"
type="text"
placeholder="अपना सवाल लिखें..."
autocomplete="off">

<button
id="sendBtn"
onclick="sendMessage()">
➤
</button>

</div>

</div>

</main>

</div>


<script>

/* =========================
API
========================= */

const CHAT_API="/api/chat";
const LOGIN_API="/api/login";
const SIGNUP_API="/api/signup";


/* =========================
ELEMENTS
========================= */

const authScreen=
document.getElementById("authScreen");

const appScreen=
document.getElementById("appScreen");

const authMessage=
document.getElementById("authMessage");

const loginForm=
document.getElementById("loginForm");

const signupForm=
document.getElementById("signupForm");

const loginBtn=
document.getElementById("loginBtn");

const signupBtn=
document.getElementById("signupBtn");

const input=
document.getElementById("messageInput");

const sendBtn=
document.getElementById("sendBtn");

const chat=
document.getElementById("chat");

const chatList=
document.getElementById("chatList");


/* =========================
CURRENT USER
========================= */

let currentUser=null;
let currentChatId=null;


/* =========================
AUTH MESSAGE
========================= */

function showAuthMessage(
  message,
  success=false
){

  authMessage.textContent=message;

  authMessage.style.color=
    success
      ? "#16a34a"
      : "#dc2626";
}


function clearAuthMessage(){
  authMessage.textContent="";
}


/* =========================
LOGIN / SIGNUP TABS
========================= */

function showLogin(){

  loginForm.classList.remove("hidden");
  signupForm.classList.add("hidden");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("signupTab")
    .classList.remove("active");

  document
    .getElementById("loginSwitch")
    .classList.remove("hidden");

  document
    .getElementById("signupSwitch")
    .classList.add("hidden");

  clearAuthMessage();
}


function showSignup(){

  signupForm.classList.remove("hidden");
  loginForm.classList.add("hidden");

  document
    .getElementById("signupTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  document
    .getElementById("signupSwitch")
    .classList.remove("hidden");

  document
    .getElementById("loginSwitch")
    .classList.add("hidden");

  clearAuthMessage();
}


/* =========================
SAVE USER
========================= */

function saveUser(user){

  localStorage.setItem(
    "baatai_user",
    JSON.stringify(user)
  );
}


/* =========================
SHOW APP
========================= */

function showApp(user){

  currentUser=user;

  authScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");

  const userInfo=
    document.getElementById("userInfo");

  userInfo.textContent=
    "👤 "+
    (user.name || user.email);

  loadChats();

  setTimeout(()=>{
    input.focus();
  },100);
}


/* =========================
LOAD LOGIN
========================= */

window.addEventListener(
"load",
function(){

  const savedUser=
    localStorage.getItem(
      "baatai_user"
    );

  if(!savedUser){

    showLogin();
    return;

  }

  try{

    const user=
      JSON.parse(savedUser);

    if(
      user &&
      user.id
    ){

      showApp(user);

    }else{

      localStorage.removeItem(
        "baatai_user"
      );

      showLogin();

    }

  }catch{

    localStorage.removeItem(
      "baatai_user"
    );

    showLogin();

  }

});


/* =========================
SIGNUP
========================= */

signupForm.addEventListener(
"submit",
async function(event){

  event.preventDefault();

  clearAuthMessage();

  const name=
    document
      .getElementById("signupName")
      .value
      .trim();

  const email=
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password=
    document
      .getElementById("signupPassword")
      .value;

  signupBtn.disabled=true;
  signupBtn.textContent=
    "Account बन रहा है...";

  try{

    const response=
      await fetch(
        SIGNUP_API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            name,
            email,
            password
          })
        }
      );

    const data=
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Account बनाने में समस्या हुई।"
      );

    }

    showLogin();

    document
      .getElementById("loginEmail")
      .value=email;

    showAuthMessage(
      "Account बन गया! अब Login करें। ✅",
      true
    );

  }catch(error){

    showAuthMessage(
      error.message
    );

  }

  signupBtn.disabled=false;
  signupBtn.textContent=
    "Create Account";

});


/* =========================
LOGIN
========================= */

loginForm.addEventListener(
"submit",
async function(event){

  event.preventDefault();

  clearAuthMessage();

  const email=
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password=
    document
      .getElementById("loginPassword")
      .value;

  loginBtn.disabled=true;

  loginBtn.textContent=
    "Login हो रहा है...";

  try{

    const response=
      await fetch(
        LOGIN_API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email,
            password
          })
        }
      );

    const data=
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Login में समस्या हुई।"
      );

    }

    saveUser(data.user);

    showApp(data.user);

  }catch(error){

    showAuthMessage(
      error.message
    );

  }

  loginBtn.disabled=false;
  loginBtn.textContent="Login";

});


/* =========================
LOAD PREVIOUS CHATS
========================= */

async function loadChats(){

  if(!currentUser){
    return;
  }

  try{

    const response=
      await fetch(
        "/api/chats/"+
        currentUser.id
      );

    const data=
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Chats load नहीं हुईं"
      );

    }

    renderChatList(
      data.chats || []
    );

  }catch(error){

    console.error(
      "LOAD CHATS ERROR:",
      error
    );

    chatList.innerHTML=
      `<div class="no-chats">
        Chats load नहीं हो सकीं
      </div>`;
  }
}


/* =========================
RENDER CHAT LIST
========================= */

function renderChatList(chats){

  chatList.innerHTML="";

  if(!chats.length){

    chatList.innerHTML=
      `<div class="no-chats">
        अभी कोई Previous Chat नहीं है।
      </div>`;

    return;
  }

  chats.forEach(item=>{

    const row=
      document.createElement("div");

    row.className="chat-item";

    const openBtn=
      document.createElement("button");

    openBtn.className="chat-open";

    if(
      Number(item.id) ===
      Number(currentChatId)
    ){

      openBtn.classList.add("active");

    }

    openBtn.textContent=
      "💬 "+
      (item.title || "New Chat");

    openBtn.onclick=()=>{
      loadChat(item.id);
    };


    const deleteBtn=
      document.createElement("button");

    deleteBtn.className="delete-chat";

    deleteBtn.textContent="🗑️";

    deleteBtn.title="Delete Chat";

    deleteBtn.onclick=(event)=>{
      event.stopPropagation();
      deleteChat(item.id);
    };


    row.appendChild(openBtn);
    row.appendChild(deleteBtn);

    chatList.appendChild(row);

  });

}


/* =========================
LOAD CHAT
========================= */

async function loadChat(chatId){

  if(!currentUser){
    return;
  }

  try{

    const response=
      await fetch(
        `/api/chats/${chatId}/messages?userId=${currentUser.id}`
      );

    const data=
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Chat load नहीं हुई"
      );

    }

    currentChatId=
      Number(chatId);

    chat.innerHTML="";

    if(
      !data.messages ||
      !data.messages.length
    ){

      showWelcome();

    }else{

      data.messages.forEach(
        item=>{

          const type=
            item.role === "user"
              ? "user"
              : "ai";

          addMessage(
            item.content,
            type
          );

        }
      );

    }

    await loadChats();

    closeMobileMenu();

    input.focus();

  }catch(error){

    console.error(
      "LOAD CHAT ERROR:",
      error
    );

    alert(
      "Chat खोलने में समस्या हुई।"
    );
  }
}


/* =========================
DELETE CHAT
========================= */

async function deleteChat(chatId){

  if(!currentUser){
    return;
  }

  const confirmDelete=
    confirm(
      "क्या आप यह chat delete करना चाहते हैं?"
    );

  if(!confirmDelete){
    return;
  }

  try{

    const response=
      await fetch(
        `/api/chats/${chatId}?userId=${currentUser.id}`,
        {
          method:"DELETE"
        }
      );

    const data=
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Delete failed"
      );

    }

    if(
      Number(currentChatId) ===
      Number(chatId)
    ){

      currentChatId=null;

      showWelcome();

    }

    await loadChats();

  }catch(error){

    console.error(
      "DELETE ERROR:",
      error
    );

    alert(
      "Chat delete नहीं हो सकी।"
    );
  }
}


/* =========================
NEW CHAT
========================= */

function newChat(){

  currentChatId=null;

  showWelcome();

  closeMobileMenu();

  input.value="";
  input.focus();

  loadChats();
}


/* =========================
WELCOME
========================= */

function showWelcome(){

  chat.innerHTML=`

    <div
      id="welcome"
      class="welcome">

      <h1>Hello 👋</h1>

      <p>
        BaatAI से कुछ भी पूछिए...
      </p>

    </div>

  `;

}


/* =========================
SEND MESSAGE
========================= */

async function sendMessage(){

  const message=
    input.value.trim();

  if(!message){
    return;
  }

  const welcome=
    document.getElementById(
      "welcome"
    );

  if(welcome){
    welcome.remove();
  }

  addMessage(
    message,
    "user"
  );

  input.value="";
  sendBtn.disabled=true;

  const typing=
    addMessage(
      "🤖 सोच रहा हूँ...",
      "ai"
    );

  try{

    const response=
      await fetch(
        CHAT_API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message,

            userId:
              currentUser.id,

            chatId:
              currentChatId

          })
        }
      );

    const data=
      await response.json();

    typing.remove();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Server error"
      );

    }

    currentChatId=
      Number(data.chatId);

    addMessage(
      data.reply ||
      "मुझे कोई जवाब नहीं मिला।",
      "ai"
    );

    await loadChats();

  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );

    typing.remove();

    addMessage(
      "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।",
      "ai"
    );

  }

  sendBtn.disabled=false;
  input.focus();

}


/* =========================
ADD MESSAGE
========================= */

function addMessage(
  text,
  type
){

  const messageDiv=
    document.createElement(
      "div"
    );

  messageDiv.className=
    "message "+
    type;

  const bubble=
    document.createElement(
      "div"
    );

  bubble.className=
    "bubble";

  bubble.textContent=
    text;

  messageDiv.appendChild(
    bubble
  );

  chat.appendChild(
    messageDiv
  );

  chat.scrollTop=
    chat.scrollHeight;

  return messageDiv;
}


/* =========================
ENTER
========================= */

input.addEventListener(
"keydown",
function(event){

  if(
    event.key === "Enter"
  ){

    event.preventDefault();

    sendMessage();

  }

});


/* =========================
MENU
========================= */

function toggleMenu(){

  document
    .getElementById("sidebar")
    .classList.toggle("active");

}


function closeMobileMenu(){

  document
    .getElementById("sidebar")
    .classList.remove("active");

}


/* =========================
LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "baatai_user"
  );

  currentUser=null;
  currentChatId=null;

  appScreen.classList.add(
    "hidden"
  );

  authScreen.classList.remove(
    "hidden"
  );

  chatList.innerHTML="";

  showLogin();

}

</script>
