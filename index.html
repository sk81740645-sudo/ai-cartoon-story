<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaatAI - AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .new-chat:hover {
      background: #374151;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      height: 65px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 20px;
      font-weight: bold;
    }

    /* Chat */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .welcome {
      text-align: center;
      margin-top: 100px;
      color: #374151;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #6b7280;
    }

    .message {
      max-width: 800px;
      margin: 15px auto;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      padding: 13px 17px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai .bubble {
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    /* Input */
    .input-area {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 15px;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    #messageInput:focus {
      border-color: #2563eb;
    }

    #sendBtn {
      width: 55px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #1d4ed8;
    }

    #sendBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .typing {
      color: #6b7280;
      font-style: italic;
    }

    /* Mobile */
    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .header {
        justify-content: center;
      }

      .chat {
        padding: 15px;
      }

      .welcome {
        margin-top: 70px;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .input-area {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">🤖 BaatAI</div>

      <button class="new-chat" onclick="newChat()">
        ＋ New Chat
      </button>
    </aside>

    <!-- Main -->
    <main class="main">

      <header class="header">
        🤖 BaatAI
      </header>

      <!-- Chat Area -->
      <section class="chat" id="chat">

        <div class="welcome" id="welcome">
          <h1>Hello 👋</h1>
          <p>BaatAI से कुछ भी पूछिए...</p>
        </div>

      </section>

      <!-- Input -->
      <div class="input-area">
        <div class="input-box">

          <input
            type="text"
            id="messageInput"
            placeholder="अपना सवाल लिखें..."
            autocomplete="off"
          >

          <button id="sendBtn" onclick="sendMessage()">
            ➤
          </button>

        </div>
      </div>

    </main>
  </div>


  <script>

    // IMPORTANT:
    // हमारा working Render backend
    const API_URL = "https://baatai-ai.onrender.com/api/chat";


    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");


    // Enter दबाने पर message भेजना
    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }

    });


    // Message भेजना
    async function sendMessage() {

      const message = input.value.trim();

      if (!message) {
        return;
      }


      // Welcome हटाओ
      if (welcome) {
        welcome.remove();
      }


      // User message
      addMessage(message, "user");

      input.value = "";

      sendBtn.disabled = true;


      // Typing message
      const typing = addMessage("🤖 सोच रहा हूँ...", "ai");


      try {

        console.log("Sending request:", message);


        const response = await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })

        });


        console.log("HTTP Status:", response.status);


        // Server response
        const data = await response.json();

        console.log("Server response:", data);


        // Typing हटाओ
        typing.remove();


        if (!response.ok) {

          throw new Error(
            data.error || "Server error"
          );

        }


        // AI reply
        addMessage(
          data.reply || "मुझे कोई जवाब नहीं मिला।",
          "ai"
        );


      } catch (error) {

        console.error("Chat Error:", error);

        typing.remove();


        addMessage(
          "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।",
          "ai"
        );

      }


      sendBtn.disabled = false;

      input.focus();

    }


    // Message screen पर दिखाना
    function addMessage(text, type) {

      const messageDiv = document.createElement("div");

      messageDiv.className = "message " + type;


      const bubble = document.createElement("div");

      bubble.className = "bubble";

      bubble.textContent = text;


      messageDiv.appendChild(bubble);

      chat.appendChild(messageDiv);


      // नीचे scroll
      chat.scrollTop = chat.scrollHeight;


      return messageDiv;

    }


    // New Chat
    function newChat() {

      chat.innerHTML = `
        <div class="welcome" id="welcome">
          <h1>Hello 👋</h1>
          <p>BaatAI से कुछ भी पूछिए...</p>
        </div>
      `;

      input.value = "";

      input.focus();

    }

  </script>

</body>
</html>
