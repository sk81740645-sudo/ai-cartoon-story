<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/baatai-logo.png?v=2">
  <link rel="shortcut icon" href="/baatai-logo.png?v=2">
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>BaatAI - AI Assistant | Study, Coding, Stories & Ideas</title>

<meta
  name="description"
  content="BaatAI एक AI Assistant है जो study, coding, stories, ideas और रोज़मर्रा के सवालों में आपकी मदद करता है।"
>

<meta
  name="robots"
  content="index, follow"
>

<link
  rel="canonical"
  href="https://baatai-ai.onrender.com/"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#000;
}

body{
  position:relative;
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#000;
}


/* =====================================================
   BACKGROUND VIDEO
===================================================== */

#bgVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  pointer-events:none;
  background:#000;
}

.videoOverlay{
  position:fixed;
  inset:0;
  z-index:1;
  background:rgba(0,8,12,.62);
  pointer-events:none;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  position:relative;
  z-index:30;
  width:100%;
  height:72px;
  display:flex;
  align-items:center;
  padding:0 14px;
  background:rgba(0,8,12,.72);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(0,229,255,.25);
}

.menuBtn{
  width:42px;
  height:42px;
  margin-right:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:32px;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.robot{
  font-size:30px;
  line-height:1;
}

.brandName{
  color:#fff;
  font-size:22px;
  font-weight:700;
  line-height:24px;
}

.brandSub{
  color:#00e5ff;
  font-size:11px;
  line-height:14px;
}

.headerRight{
  display:flex;
  align-items:center;
  margin-left:auto;
}

.lightBtn{
  height:42px;
  padding:0 12px;
  border:1px solid #00e5ff;
  border-radius:11px;
  background:rgba(0,40,48,.7);
  color:#fff;
  font-size:14px;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.profileBtn{
  width:42px;
  height:42px;
  margin-left:8px;
  border:1px solid #00e5ff;
  border-radius:50%;
  background:rgba(0,50,60,.75);
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  z-index:100;
}


/* =====================================================
   MAIN
===================================================== */

.main{
  position:relative;
  z-index:10;
  width:100%;
  height:calc(100dvh - 72px);
  overflow:hidden;
}

.welcome{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:3px;
}

.welcome h1{
  color:#00e5ff;
  font-size:27px;
  font-weight:600;
  text-shadow:0 0 12px rgba(0,229,255,.45);
}

.welcomeLine{
  width:52px;
  height:1px;
  background:#00e5ff;
  margin:0 10px 3px;
}


/* =====================================================
   CHAT
===================================================== */

.chat{
  width:100%;
  height:calc(100% - 60px);
  padding:4px 18px 120px;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:rgba(0,229,255,.35);
  border-radius:10px;
}

.message{
  width:100%;
  display:flex;
  margin:10px 0;
}

.message.user{
  justify-content:flex-end;
}

.message.assistant{
  justify-content:flex-start;
}

.bubble{
  max-width:86%;
  padding:12px 15px;
  border-radius:17px;
  color:#f5ffff;
  font-size:16px;
  line-height:1.5;
  word-break:break-word;
  white-space:pre-wrap;
  background:rgba(0,15,20,.78);
  border:1px solid rgba(0,229,255,.35);
  backdrop-filter:blur(5px);
}

.message.user .bubble{
  background:rgba(0,65,75,.45);
  border-color:rgba(0,229,255,.7);
  border-bottom-right-radius:5px;
}

.message.assistant .bubble{
  border-bottom-left-radius:5px;
}


/* =====================================================
   WELCOME MESSAGE
===================================================== */

.welcomeMessage{
  width:100%;
  max-width:600px;
  margin:15px auto;
  padding:22px 18px;
  text-align:left;
  border:1px solid rgba(0,229,255,.45);
  border-radius:20px;
  background:rgba(0,18,23,.72);
  color:#f1ffff;
  font-size:16px;
  line-height:1.65;
  backdrop-filter:blur(7px);
}

.welcomeMessage strong{
  font-size:18px;
}


/* =====================================================
   TYPING
===================================================== */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#00e5ff;
  animation:typing 1s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes typing{

  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }

  30%{
    transform:translateY(-5px);
    opacity:1;
  }

}


/* =====================================================
   INPUT AREA
===================================================== */

.inputArea{
  position:absolute;
  z-index:50;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  padding:7px 12px max(8px,env(safe-area-inset-bottom));
  background:linear-gradient(
    transparent,
    rgba(0,7,10,.98) 45%
  );
  pointer-events:none;
}

.inputBox{
  width:100%;
  max-width:700px;
  min-height:58px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 6px;
  border:1px solid #00e5ff;
  border-radius:30px;
  background:rgba(0,20,25,.9);
  box-shadow:0 0 15px rgba(0,229,255,.08);
  backdrop-filter:blur(10px);
  pointer-events:auto;
}

.iconBtn{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #00e5ff;
  border-radius:50%;
  background:rgba(0,45,55,.75);
  color:#00e5ff;
  font-size:19px;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.iconBtn:active{
  transform:scale(.93);
}

#messageInput{
  flex:1;
  min-width:0;
  height:42px;
  max-height:100px;
  resize:none;
  overflow-y:auto;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px 5px;
  font-size:16px;
  line-height:22px;
}

#messageInput::placeholder{
  color:#9aaeb2;
}

.sendBtn{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#001014;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.sendBtn:active{
  transform:scale(.92);
}

#imageInput{
  display:none;
}

.uploadedImage{
  display:block;
  width:100%;
  max-width:270px;
  max-height:320px;
  object-fit:cover;
  margin-bottom:8px;
  border-radius:13px;
  border:1px solid rgba(0,229,255,.4);
}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

.imagePreview{
  width:100%;
  max-width:700px;
  margin:0 auto 7px;
  display:none;
  pointer-events:auto;
}

.imagePreviewBox{
  position:relative;
  display:inline-block;
}

.imagePreviewBox img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #00e5ff;
}

.removeImageBtn{
  position:absolute;
  top:-8px;
  right:-8px;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:#ff3b30;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}


/* =====================================================
   MIC
===================================================== */

.micBtn{
  color:#fff;
  background:rgba(35,35,35,.85);
  border:1px solid rgba(255,255,255,.18);
}

.micBtn svg{
  width:21px;
  height:21px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.micBtn.listening{
  background:rgba(255,50,50,.18);
  border-color:#ff4444;
  color:#ff4444;
  animation:micPulse 1s infinite;
}

@keyframes micPulse{

  50%{
    box-shadow:0 0 15px rgba(255,60,60,.55);
  }

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  position:fixed;
  top:0;
  left:-285px;
  width:275px;
  height:100dvh;
  z-index:90;
  padding:82px 14px 20px;
  overflow-y:auto;
  background:rgba(0,12,17,.98);
  border-right:1px solid #00e5ff;
  box-shadow:8px 0 30px rgba(0,0,0,.5);
  transition:left .25s ease;
}

.sidebar.open{
  left:0;
}

.newChatBtn,
.menuItem{
  width:100%;
  min-height:45px;
  margin-bottom:8px;
  padding:10px 13px;
  border:1px solid rgba(0,229,255,.45);
  border-radius:10px;
  background:rgba(0,40,48,.72);
  color:#fff;
  text-align:left;
  font-size:14px;
  cursor:pointer;
  position:relative;
  z-index:100;
}

.newChatBtn:hover,
.menuItem:hover{
  background:rgba(0,229,255,.15);
}


/* =====================================================
   HISTORY
===================================================== */

.historyTitle{
  margin:18px 4px 9px;
  color:#00e5ff;
  font-size:13px;
  font-weight:bold;
}

.historyList{
  width:100%;
}

.historyItem{
  width:100%;
  padding:11px;
  margin-bottom:7px;
  border-radius:10px;
  background:rgba(255,255,255,.06);
  color:#ddd;
  cursor:pointer;
  overflow:hidden;
  transition:.2s;
}

.historyItem:hover{
  background:rgba(0,229,255,.12);
}

.historyItem.active{
  background:rgba(0,229,255,.15);
  border:1px solid rgba(0,229,255,.35);
}

.historyItemTitle{
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#fff;
}

.historyItemTime{
  margin-top:5px;
  font-size:10px;
  color:#00e5ff;
}

.historyEmpty{
  color:#7f9295;
  font-size:12px;
  padding:10px 4px;
}


/* =====================================================
   PROFILE POPUP
===================================================== */

.profilePopup{
  position:fixed;
  z-index:120;
  top:78px;
  right:12px;
  width:220px;
  padding:15px;
  border:1px solid #00e5ff;
  border-radius:14px;
  background:rgba(0,15,20,.98);
  box-shadow:0 8px 30px rgba(0,0,0,.45);
  display:none;
}

.profilePopup.show{
  display:block;
}

.profilePopup h3{
  color:#00e5ff;
  font-size:16px;
  margin-bottom:8px;
}

.profilePopup p{
  color:#ddd;
  font-size:13px;
  line-height:1.5;
  margin-bottom:10px;
}

.closePopup{
  width:100%;
  padding:9px;
  border:1px solid #00e5ff;
  border-radius:9px;
  background:transparent;
  color:#fff;
  cursor:pointer;
}


/* =====================================================
   AUTH
===================================================== */

.authOverlay{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.authOverlay.show{
  display:flex;
}

.authBox{
  width:100%;
  max-width:390px;
  padding:25px;
  border:1px solid #00e5ff;
  border-radius:22px;
  background:rgba(0,18,24,.97);
  box-shadow:0 0 35px rgba(0,229,255,.18);
}

.authLogo{
  text-align:center;
  margin-bottom:8px;
  font-size:38px;
}

.authTitle{
  text-align:center;
  color:#fff;
  font-size:25px;
  font-weight:bold;
}

.authSubtitle{
  text-align:center;
  color:#91a6aa;
  font-size:13px;
  margin:7px 0 20px;
}

.authTabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.authTab{
  flex:1;
  padding:11px;
  border:1px solid rgba(0,229,255,.4);
  border-radius:10px;
  background:rgba(0,40,48,.7);
  color:#fff;
  cursor:pointer;
}

.authTab.active{
  background:#00e5ff;
  color:#001014;
  font-weight:bold;
}

.authInput{
  width:100%;
  height:46px;
  margin-bottom:12px;
  padding:0 13px;
  border:1px solid rgba(0,229,255,.4);
  border-radius:10px;
  outline:none;
  background:rgba(0,8,12,.8);
  color:#fff;
  font-size:15px;
}

.authInput::placeholder{
  color:#819397;
}

.authSubmit{
  width:100%;
  height:47px;
  border:0;
  border-radius:11px;
  background:#00e5ff;
  color:#001014;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.authSubmit:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.authClose{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:1px solid rgba(0,229,255,.4);
  border-radius:10px;
  background:transparent;
  color:#fff;
  cursor:pointer;
}

.authMessage{
  display:none;
  margin-bottom:12px;
  padding:10px;
  border-radius:9px;
  font-size:13px;
  text-align:center;
}

.authMessage.show{
  display:block;
}

.authMessage.error{
  background:rgba(255,60,60,.15);
  color:#ff8585;
}

.authMessage.success{
  background:rgba(0,255,150,.12);
  color:#6fffc0;
}


/* =====================================================
   LIGHT MODE
===================================================== */

body.light{
  background:#f4fbfc;
}

body.light .videoOverlay{
  background:rgba(235,250,252,.82);
}

body.light .header{
  background:rgba(255,255,255,.88);
  border-bottom-color:rgba(0,140,160,.25);
}

body.light .menuBtn,
body.light .brandName{
  color:#111;
}

body.light .brandSub{
  color:#008fa5;
}

body.light .lightBtn{
  background:rgba(255,255,255,.9);
  color:#111;
}

body.light .profileBtn{
  background:rgba(220,248,250,.9);
  color:#111;
}

body.light .welcome h1{
  color:#008da3;
}

body.light .welcomeMessage{
  background:rgba(255,255,255,.82);
  color:#111;
}

body.light .bubble{
  color:#111;
  background:rgba(255,255,255,.8);
}

body.light .inputArea{
  background:linear-gradient(
    transparent,
    rgba(245,252,253,.98) 45%
  );
}

body.light .inputBox{
  background:rgba(255,255,255,.92);
}

body.light #messageInput{
  color:#111;
}

body.light #messageInput::placeholder{
  color:#667;
}

body.light .sidebar{
  background:rgba(248,253,254,.99);
}

body.light .newChatBtn,
body.light .menuItem{
  color:#111;
  background:rgba(220,245,247,.75);
}

body.light .historyItem{
  color:#222;
  background:rgba(0,0,0,.05);
}

body.light .historyItemTitle{
  color:#111;
}

body.light .profilePopup{
  background:rgba(255,255,255,.98);
}

body.light .profilePopup p{
  color:#333;
}

body.light .closePopup{
  color:#111;
}

body.light .authBox{
  background:rgba(255,255,255,.98);
}

body.light .authTitle{
  color:#111;
}

body.light .authInput{
  background:#fff;
  color:#111;
}

body.light .authClose{
  color:#111;
}


/* =====================================================
   CLICK FIX
===================================================== */

.videoOverlay,
#bgVideo{
  pointer-events:none !important;
}

button,
input,
textarea{
  pointer-events:auto;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .header{
    height:64px;
    padding:0 9px;
  }

  .main{
    height:calc(100dvh - 64px);
  }

  .menuBtn{
    width:39px;
    height:39px;
    font-size:29px;
  }

  .robot{
    font-size:27px;
  }

  .brandName{
    font-size:20px;
  }

  .brandSub{
    font-size:10px;
  }

  .lightBtn{
    height:38px;
    padding:0 9px;
    font-size:12px;
  }

  .profileBtn{
    width:38px;
    height:38px;
  }

  .welcome{
    height:57px;
  }

  .welcome h1{
    font-size:25px;
  }

  .welcomeLine{
    width:38px;
  }

  .chat{
    height:calc(100% - 57px);
    padding:4px 10px 105px;
  }

  .welcomeMessage{
    padding:17px 14px;
    margin:10px auto;
    font-size:15px;
  }

  .bubble{
    max-width:88%;
    font-size:15px;
    padding:10px 12px;
  }

  .inputArea{
    padding:5px 8px max(7px,env(safe-area-inset-bottom));
  }

  .inputBox{
    min-height:55px;
    padding:4px 5px;
    gap:3px;
  }

  .iconBtn{
    width:40px;
    height:40px;
    flex-basis:40px;
    font-size:17px;
  }

  #messageInput{
    height:39px;
    font-size:15px;
    padding:8px 4px;
  }

  .sendBtn{
    width:42px;
    height:42px;
    flex-basis:42px;
    font-size:21px;
  }

  .sidebar{
    width:270px;
    padding-top:72px;
  }

  .profilePopup{
    top:58px;
    right:8px;
    width:195px;
  }

}

@media(max-width:380px){

  .brandName{
    font-size:18px;
  }

  .brandSub{
    font-size:9px;
  }

  .lightBtn{
    padding:0 7px;
    font-size:11px;
  }

  .profileBtn{
    width:36px;
    height:36px;
  }

  .iconBtn{
    width:38px;
    height:38px;
    flex-basis:38px;
  }

  .sendBtn{
    width:40px;
    height:40px;
    flex-basis:40px;
  }

}

</style>

</head>

<body>

<div class="app">

  <video
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline
  >
    <source
      src="background.mp4"
      type="video/mp4"
    >
  </video>

  <div class="videoOverlay"></div>


  <!-- =====================================================
       SIDEBAR
  ===================================================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <button
      class="newChatBtn"
      id="newChatBtn"
      type="button"
    >
      ＋ New Chat
    </button>

    <button
      class="menuItem"
      id="clearHistoryBtn"
      type="button"
    >
      🗑️ Clear History
    </button>

    <button
      class="menuItem"
      id="themeMenuBtn"
      type="button"
    >
      ☀️ Light / Dark
    </button>

    <div class="historyTitle">
      CHATS
    </div>

    <div
      id="historyList"
      class="historyList"
    ></div>

  </aside>


  <!-- =====================================================
       HEADER
  ===================================================== -->

  <header class="header">

    <button
      class="menuBtn"
      id="menuBtn"
      type="button"
    >
      ☰
    </button>

    <div class="brand">

      <div class="robot">
        🤖
      </div>

      <div>

        <div class="brandName">
          BaatAI
        </div>

        <div class="brandSub">
          AI Study
        </div>

      </div>

    </div>

    <div class="headerRight">

      <button
        class="lightBtn"
        id="lightBtn"
        type="button"
      >
        ☀️ Light
      </button>

      <button
        class="profileBtn"
        id="profileBtn"
        type="button"
      >
        S
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ===================================================== -->

  <main class="main">

    <section class="welcome">

      <div class="welcomeLine"></div>

      <h1>
        BaatAI - AI Assistant
      </h1>

      <div class="welcomeLine"></div>

    </section>


    <!-- CHAT -->

    <section
      class="chat"

  /* =====================================================
     API
  ===================================================== */

  const API =
    "https://baatai-ai.onrender.com";


  /* =====================================================
     APP STATE
  ===================================================== */

  let currentChatId = null;

  let currentImage = null;

  let authMode = "login";

  let isSending = false;

  let recognition = null;

  let isListening = false;


  /* =====================================================
     LOCAL STORAGE KEYS
  ===================================================== */

  const CHATS_KEY =
    "baatai-local-chats";

  const USER_KEY =
    "baatai_user";

  const VISITOR_KEY =
    "baatai-visitor-id";


  /* =====================================================
     VISITOR ID
     Anonymous users ke messages ko same visitor se
     connect karne ke liye
  ===================================================== */

  function getVisitorId(){

    let visitorId =
      localStorage.getItem(VISITOR_KEY);

    if(!visitorId){

      if(
        window.crypto &&
        typeof crypto.randomUUID === "function"
      ){

        visitorId =
          crypto.randomUUID();

      }else{

        visitorId =
          "visitor-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .slice(2);

      }

      localStorage.setItem(
        VISITOR_KEY,
        visitorId
      );

    }

    return visitorId;
  }


  /* =====================================================
     CHAT STORAGE
  ===================================================== */

  function getChats(){

    try{

      const data =
        localStorage.getItem(CHATS_KEY);

      if(!data){
        return [];
      }

      const chats =
        JSON.parse(data);

      return Array.isArray(chats)
        ? chats
        : [];

    }catch(error){

      console.error(
        "CHAT STORAGE ERROR:",
        error
      );

      return [];

    }

  }


  function saveChats(chats){

    try{

      localStorage.setItem(
        CHATS_KEY,
        JSON.stringify(chats)
      );

    }catch(error){

      console.error(
        "SAVE CHATS ERROR:",
        error
      );

    }

  }


  function createLocalChat(){

    const chats =
      getChats();

    const chatData = {

      id:
        "chat-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2),

      title:
        "New Chat",

      createdAt:
        new Date().toISOString(),

      updatedAt:
        new Date().toISOString(),

      messages: []

    };

    chats.unshift(chatData);

    saveChats(chats);

    return chatData;

  }


  function getCurrentLocalChat(){

    const chats =
      getChats();

    return chats.find(
      item =>
        item.id === currentChatId
    );

  }


  function updateCurrentLocalChat(){

    if(!currentChatId){
      return;
    }

    const chats =
      getChats();

    const index =
      chats.findIndex(
        item =>
          item.id === currentChatId
      );

    if(index === -1){
      return;
    }

    chats[index].updatedAt =
      new Date().toISOString();

    saveChats(chats);

  }


  function saveMessageLocally(
    role,
    content,
    image = null
  ){

    if(!currentChatId){
      return;
    }

    const chats =
      getChats();

    const index =
      chats.findIndex(
        item =>
          item.id === currentChatId
      );

    if(index === -1){
      return;
    }

    chats[index].messages.push({

      role: role,

      content:
        content || "",

      image:
        image || null,

      createdAt:
        new Date().toISOString()

    });


    /*
      First user message ko chat title bana do
    */

    if(
      role === "user" &&
      chats[index].title === "New Chat" &&
      content &&
      content.trim()
    ){

      let title =
        content.trim();

      if(title.length > 35){

        title =
          title.substring(0,35) +
          "...";

      }

      chats[index].title =
        title;

    }


    chats[index].updatedAt =
      new Date().toISOString();

    saveChats(chats);

    renderHistory();

  }


  /* =====================================================
     HISTORY UI
  ===================================================== */

  function renderHistory(){

    if(!historyList){
      return;
    }

    historyList.innerHTML = "";

    const chats =
      getChats();

    if(chats.length === 0){

      const empty =
        document.createElement("div");

      empty.className =
        "historyEmpty";

      empty.textContent =
        "No previous chats";

      historyList.appendChild(
        empty
      );

      return;

    }


    chats.forEach(item => {

      const historyItem =
        document.createElement("div");

      historyItem.className =
        "historyItem";

      if(
        item.id === currentChatId
      ){

        historyItem.classList.add(
          "active"
        );

      }


      const title =
        document.createElement("div");

      title.className =
        "historyItemTitle";

      title.textContent =
        item.title ||
        "New Chat";


      const time =
        document.createElement("div");

      time.className =
        "historyItemTime";

      time.textContent =
        formatHistoryTime(
          item.updatedAt
        );


      historyItem.appendChild(
        title
      );

      historyItem.appendChild(
        time
      );


      historyItem.addEventListener(
        "click",
        function(){

          openChat(
            item.id
          );

          closeSidebar();

        }
      );


      historyList.appendChild(
        historyItem
      );

    });

  }


  function formatHistoryTime(
    dateString
  ){

    if(!dateString){
      return "";
    }

    try{

      const date =
        new Date(dateString);

      return date.toLocaleString(
        [],
        {
          day:"2-digit",
          month:"short",
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    }catch(error){

      return "";

    }

  }


  /* =====================================================
     OPEN CHAT
  ===================================================== */

  function openChat(chatId){

    const chats =
      getChats();

    const selected =
      chats.find(
        item =>
          item.id === chatId
      );

    if(!selected){
      return;
    }

    currentChatId =
      selected.id;

    chat.innerHTML = "";

    if(
      !selected.messages ||
      selected.messages.length === 0
    ){

      showWelcome();

    }else{

      selected.messages.forEach(
        message => {

          addMessage(
            message.role,
            message.content,
            message.image,
            false
          );

        }
      );

    }

    renderHistory();

    scrollChatToBottom();

  }


  /* =====================================================
     NEW CHAT
  ===================================================== */

  function startNewChat(){

    currentImage = null;

    if(imagePreview){

      imagePreview.innerHTML = "";

      imagePreview.style.display =
        "none";

    }

    if(messageInput){

      messageInput.value = "";

      messageInput.style.height =
        "42px";

    }


    const newChat =
      createLocalChat();

    currentChatId =
      newChat.id;

    showWelcome();

    renderHistory();

    closeSidebar();

    if(messageInput){

      messageInput.focus();

    }

  }

    /* =====================================================
     MESSAGE FORMAT
  ===================================================== */

  function escapeHtml(text){

    if(text === null || text === undefined){
      return "";
    }

    const div =
      document.createElement("div");

    div.textContent =
      String(text);

    return div.innerHTML;

  }


  function formatMessage(text){

    if(!text){
      return "";
    }

    let html =
      escapeHtml(text);

    /*
      Bold
    */
    html =
      html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      );

    /*
      Inline code
    */
    html =
      html.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
      );

    /*
      Line breaks
    */
    html =
      html.replace(
        /\n/g,
        "<br>"
      );

    return html;

  }


  /* =====================================================
     ADD MESSAGE
  ===================================================== */

  function addMessage(
    role,
    content,
    image = null,
    saveLocal = true
  ){

    /*
      Welcome message हटाओ
    */
    if(welcome){
      welcome.style.display =
        "none";
    }


    const messageDiv =
      document.createElement("div");

    messageDiv.className =
      "message " +
      (
        role === "user"
          ? "user"
          : "assistant"
      );


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    /*
      Image
    */
    if(image){

      const img =
        document.createElement("img");

      img.className =
        "uploadedImage";

      img.src =
        image;

      img.alt =
        "Uploaded image";

      img.loading =
        "lazy";

      bubble.appendChild(
        img
      );

    }


    /*
      Text
    */
    if(
      content !== null &&
      content !== undefined &&
      String(content).trim()
    ){

      const textDiv =
        document.createElement("div");

      textDiv.innerHTML =
        formatMessage(
          String(content)
        );

      bubble.appendChild(
        textDiv
      );

    }


    messageDiv.appendChild(
      bubble
    );

    chat.appendChild(
      messageDiv
    );


    /*
      Local history
    */
    if(saveLocal){

      saveMessageLocally(
        role,
        content || "",
        image || null
      );

    }


    scrollChatToBottom();

    return messageDiv;

  }


  /* =====================================================
     SCROLL CHAT

    setTimeout(

        chat.scrollTop =

      i++

    }


    bubble.appendChild(
      typing
    );

    messageDiv.appendChild(
      bubble
    );

    chat.appendChild(
      messageDiv

  }

    currentImage =
      null;

    imageInput.value =
      "";

    imagePreview.innerHTML =
      "";

    imagePreview.style.display =
      "none";

  }


  function showImagePreview(
    dataUrl
  ){

    imagePreview.innerHTML =
      "";

    const previewBox =
      document.createElement("div");

    previewBox.className =
      "imagePreviewBox";


    const img =
      document.createElement("img");

    img.src =
      dataUrl;

    img.alt =
      "Image preview";


    const removeBtn =
      document.createElement("button");

    removeBtn.type =
      "button";

    removeBtn.className =
      "removeImageBtn";

    removeBtn.textContent =
      "×";

    removeBtn.title =
      "Remove image";


    removeBtn.addEventListener(
      "click",
      function(){

        clearImage();

      }
    );


    previewBox.appendChild(
      img
    );

    previewBox.appendChild(
      removeBtn
    );

    imagePreview.appendChild(
      previewBox
    );

    imagePreview.style.display =
      "block";

  }


  /* =====================================================
     IMAGE SELECT
  ===================================================== */

  cameraBtn.addEventListener(
    "click",
    function(){

      imageInput.click();

    }
  );


  imageInput.addEventListener(
    "change",
    function(event){

      const file =
        event.target.files &&
        event.target.files[0];

      if(!file){
        return;
      }


      /*
        Only image files
      */
      if(
        !file.type ||
        !file.type.startsWith("image/")
      ){

        alert(
          "Please select an image file."
        );

        clearImage();

        return;

      }


      /*
        10 MB limit
      */
      if(
        file.size >
        10 * 1024 * 1024
      ){

        alert(
          "Image size 10 MB से कम रखें।"
        );

        clearImage();

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(){

          currentImage =
            reader.result;

          showImagePreview(
            currentImage
          );

        };


      reader.onerror =
        function(){

          alert(
            "Image पढ़ने में समस्या हुई।"
          );

          clearImage();

        };


      reader.readAsDataURL(
        file
      );

    }
  );


  /* =====================================================
     TEXTAREA AUTO RESIZE
  ===================================================== */

  messageInput.addEventListener(
    "input",
    function(){

      this.style.height =
        "42px";

      this.style.height =
        Math.min(
          this.scrollHeight,
          100
        ) + "px";

    }
  );


  /* =====================================================
     ENTER TO SEND
  ===================================================== */

  messageInput.addEventListener(
    "keydown",
    function(event){

      /*
        Enter = Send
        Shift + Enter = New line
      */

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =====================================================
     CLEAR HISTORY
  ===================================================== */

  clearHistoryBtn.addEventListener(
    "click",
    function(){

      const chats =
        getChats();

      if(chats.length === 0){

        alert(
          "Previous chat नहीं है।"
        );

        return;

      }


      const confirmed =
        confirm(
          "क्या आप सभी previous chats delete करना चाहते हैं?"
        );

      if(!confirmed){
        return;
      }


      localStorage.removeItem(
        CHATS_KEY
      );

      currentChatId =
        null;

      chat.innerHTML =
        "";

      startNewChat();

      renderHistory();

    }
  );


  /* =====================================================
     NEW CHAT BUTTON
  ===================================================== */

  newChatBtn.addEventListener(
    "click",
    function(){

      startNewChat();

    }
  );


  /* =====================================================
     VIDEO START
  ===================================================== */

  if(bgVideo){

    bgVideo.muted =
      true;

    const videoPromise =
      bgVideo.play();

    if(
      videoPromise &&
      typeof videoPromise.catch ===
      "function"
    ){

      videoPromise.catch(
        function(error){

          console.log(
            "Background video autoplay blocked:",
            error
          );

        }
      );

    }

  }


  /* =====================================================
     AUTH FORM
  ===================================================== */

  authSubmit.addEventListener(
    "click",
    async function(){

      if(isSending){
        return;
      }


      const name =
        authName.value.trim();

      const email =
        authEmail.value.trim();

      const password =
        authPassword.value;


      /*
        Validation
      */

      if(
        authMode === "signup" &&
        !name
      ){

        showAuthMessage(
          "Please enter your name."
        );

        authName.focus();

        return;

      }


      if(!email){

        showAuthMessage(
          "Please enter your email."
        );

        authEmail.focus();

        return;

      }


      if(!password){

        showAuthMessage(
          "Please enter your password."
        );

        authPassword.focus();

        return;

      }


      if(password.length < 6){

        showAuthMessage(
          "Password कम से कम 6 characters का होना चाहिए।"
        );

        authPassword.focus();

        return;

      }


      isSending =
        true;

      authSubmit.disabled =
        true;

      authSubmit.textContent =
        "Please wait...";


      try{

        const endpoint =
          authMode === "signup"
            ? "/api/signup"
            : "/api/login";


        const body =
          authMode === "signup"
            ? {
                name:
                  name,
                email:
                  email,
                password:
                  password
              }
            : {
                email:
                  email,
                password:
                  password
              };


        const response =
          await fetch(
            API + endpoint,
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(body)
            }
          );


        const data =
          await response.json()
            .catch(
              function(){
                return {};
              }
            );


        if(!response.ok){

          throw new Error(
            data.error ||
            data.message ||
            "Authentication failed."
          );

        }


        if(
          !data.user
        ){

          throw new Error(
            "User information नहीं मिली।"
          );

        }


        /*
          Save logged-in user
        */

        localStorage.setItem(
          USER_KEY,
          JSON.stringify(
            data.user
          )
        );


        updateProfile();


        showAuthMessage(
          authMode === "signup"
            ? "Account successfully created!"
            : "Login successful!",
          "success"
        );


        setTimeout(
          function(){

            closeAuth();

            authName.value =
              "";

            authEmail.value =
              "";

            authPassword.value =
              "";

          },
          700
        );


      }catch(error){

        console.error(
          "AUTH ERROR:",
          error
        );


        showAuthMessage(
          error.message ||
          "Login/Sign Up में समस्या हुई।"
        );


      }finally{

        isSending =
          false;

        authSubmit.disabled =
          false;

        authSubmit.textContent =
          authMode === "login"
            ? "Login"
            : "Create Account";

      }

    }
  );


  /* =====================================================
     AUTH ENTER KEY
  ===================================================== */

  [
    authName,
    authEmail,
    authPassword
  ].forEach(
    function(input){

      input.addEventListener(
        "keydown",
        function(event){

          if(
            event.key === "Enter"
          ){

            event.preventDefault();

            authSubmit.click();

          }

        }
      );

    }
  );


  /* =====================================================
     PROFILE → LOGIN / LOGOUT
  ===================================================== */

  function handleProfileAction(){

    let user = null;

    try{

      const saved =
        localStorage.getItem(
          USER_KEY
        );

      if(saved){

        user =
          JSON.parse(
            saved
          );

      }

    }catch(error){

      user = null;

    }


    if(!user){

      profilePopup.classList.remove(
        "show"
      );

      openAuth(
        "login"
      );

      return;

    }


    const shouldLogout =
      confirm(
        "क्या आप BaatAI से logout करना चाहते हैं?"
      );


    if(shouldLogout){

      logoutUser();

    }

  }


  /*
    Profile popup text/button
  */
  profileText.style.cursor =
    "pointer";

  profileText.addEventListener(
    "click",
    function(){

      handleProfileAction();

    }
  );


  /* =====================================================
     PART 3 END
     PART 4 WILL CONTINUE HERE
  ===================================================== */
    /* =====================================================
     SEND MESSAGE
  ===================================================== */

  async function sendMessage(){

    if(isSending){
      return;
    }


    const text =
      messageInput.value.trim();

    const image =
      currentImage;


    /*
      अगर text और image दोनों नहीं हैं
    */
    if(
      !text &&
      !image
    ){

      messageInput.focus();

      return;

    }


    /*
      Current chat नहीं है तो बनाओ
    */
    if(!currentChatId){

      const newChat =
        createLocalChat();

      currentChatId =
        newChat.id;

    }


    /*
      Visitor ID
    */
    const visitorId =
      getVisitorId();


    /*
      User message screen पर दिखाओ
    */
    addMessage(
      "user",
      text,
      image,
      true
    );


    /*
      Input clear
    */
    messageInput.value =
      "";

    messageInput.style.height =
      "42px";


    /*
      Image clear
    */
    currentImage =
      null;

    imageInput.value =
      "";

    imagePreview.innerHTML =
      "";

    imagePreview.style.display =
      "none";


    /*
      Typing
    */
    showTyping();

    isSending =
      true;

    sendBtn.disabled =
      true;


    try{

      const response =
        await fetch(
          API + "/api/chat",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                message:
                  text,

                image:
                  image,

                visitorId:
                  visitorId,

                conversation:
                  getConversationForAPI()

              })

          }
        );


      /*
        Response JSON
      */
      const data =
        await response.json()
          .catch(
            function(){
              return {};
            }
          );


      /*
        HTTP error
      */
      if(!response.ok){

        throw new Error(
          data.error ||
          data.message ||
          "AI response नहीं मिला।"
        );

      }


      /*
        Backend reply
      */
      const reply =
        typeof data.reply === "string"
          ? data.reply
          : "";


      hideTyping();


      if(!reply.trim()){

        addMessage(
          "assistant",
          "माफ़ कीजिए, अभी AI से कोई जवाब नहीं मिला। कृपया दोबारा कोशिश करें।",
          null,
          true
        );

      }else{

        addMessage(
          "assistant",
          reply,
          null,
          true
        );

      }


      updateCurrentLocalChat();

      renderHistory();

      scrollChatToBottom();


    }catch(error){

      console.error(
        "CHAT ERROR:",
        error
      );


      hideTyping();


      let errorMessage =
        "AI से जवाब लेने में समस्या हुई। कृपया दोबारा कोशिश करें।";


      /*
        Network / server error
      */
      if(
        error &&
        error.message
      ){

        errorMessage =
          error.message;

      }


      addMessage(
        "assistant",
        errorMessage,
        null,
        true
      );

    }finally{

      isSending =
        false;

      sendBtn.disabled =
        false;

      messageInput.focus();

    }

  }


  /* =====================================================
     CONVERSATION FOR API
  ===================================================== */

  function getConversationForAPI(){

    const current =
      getCurrentLocalChat();

    if(
      !current ||
      !Array.isArray(
        current.messages
      )
    ){

      return [];

    }


    /*
      Last messages backend को भेजें
      ताकि AI को previous conversation
      का context मिल सके।
    */

    return current.messages
      .slice(-20)
      .map(
        function(item){

          return {

            role:
              item.role,

            content:
              item.content || ""

          };

        }
      );

  }


  /* =====================================================
     SEND BUTTON
  ===================================================== */

  sendBtn.addEventListener(
    "click",
    function(){

      sendMessage();

    }
  );


  /* =====================================================
     MICROPHONE / VOICE INPUT
  ===================================================== */

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(SpeechRecognition){

    recognition =
      new SpeechRecognition();

    recognition.lang =
      "hi-IN";

    recognition.continuous =
      false;

    recognition.interimResults =
      true;


    recognition.onstart =
      function(){

        isListening =
          true;

        micBtn.classList.add(
          "listening"
        );

        micBtn.title =
          "Listening...";

      };


    recognition.onresult =
      function(event){

        let transcript =
          "";

        for(
          let i =
            event.resultIndex;
          i <
            event.results.length;
          i++
        ){

          transcript +=
            event.results[i][0].transcript;

        }


        if(transcript){

          messageInput.value =
            transcript;

          messageInput.dispatchEvent(
            new Event("input")
          );

        }

      };


    recognition.onerror =
      function(event){

        console.error(
          "MIC ERROR:",
          event.error
        );


        if(
          event.error ===
          "not-allowed"
        ){

          alert(
            "Microphone permission allow करें।"
          );

        }else if(
          event.error ===
          "no-speech"
        ){

          /*
            कोई आवाज़ नहीं मिली
          */

        }else{

          alert(
            "Voice input में समस्या हुई।"
          );

        }

      };


    recognition.onend =
      function(){

        isListening =
          false;

        micBtn.classList.remove(
          "listening"
        );

        micBtn.title =
          "Voice Input";

      };


    micBtn.addEventListener(
      "click",
      function(){

        if(
          isListening
        ){

          recognition.stop();

          return;

        }


        try{

          recognition.start();

        }catch(error){

          console.error(
            "MIC START ERROR:",
            error
          );

        }

      }
    );


  }else{

    /*
      Browser speech recognition
      support नहीं करता।
    */

    micBtn.addEventListener(
      "click",
      function(){

        alert(
          "आपके browser में Voice Input support नहीं है। Chrome में try करें।"
        );

      }
    );

  }


  /* =====================================================
     STOP MIC WHEN PAGE HIDDEN
  ===================================================== */

  document.addEventListener(
    "visibilitychange",
    function(){

      if(
        document.hidden &&
        recognition &&
        isListening
      ){

        try{

          recognition.stop();

        }catch(error){

          console.log(
            error
          );

        }

      }

    }
  );


  /* =====================================================
     AUTH PROFILE BUTTON
     Single tap:
     logged-in user → profile
     logged-out user → login
  ===================================================== */

  profileBtn.addEventListener(
    "click",
    function(event){

      event.stopPropagation();


      let user = null;

      try{

        const saved =
          localStorage.getItem(
            USER_KEY
          );

        if(saved){

          user =
            JSON.parse(
              saved
            );

        }

      }catch(error){

        user = null;

      }


      if(!user){

        profilePopup.classList.remove(
          "show"
        );

        openAuth(
          "login"
        );

        return;

      }


      profilePopup.classList.toggle(
        "show"
      );

    }
  );


  /* =====================================================
     CLOSE AUTH WITH ESC
  ===================================================== */

  document.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Escape"
      ){

        if(
          authOverlay.classList.contains(
            "show"
          )
        ){

          closeAuth();

        }

        if(
          profilePopup.classList.contains(
            "show"
          )
        ){

          profilePopup.classList.remove(
            "show"
          );

        }

        closeSidebar();

      }

    }
  );


  /* =====================================================
     IMAGE PREVIEW CLEANUP
  ===================================================== */

  window.addEventListener(
    "beforeunload",
    function(){

      if(
        recognition &&
        isListening
      ){

        try{

          recognition.stop();

        }catch(error){

          console.log(
            error
          );

        }

      }

    }
  );


  /* =====================================================
     FINAL INITIALIZATION
  ===================================================== */

  getVisitorId();

  updateProfile();

  renderHistory();


  /*
    अगर current chat अभी भी नहीं है
  */
  if(!currentChatId){

    const chats =
      getChats();

    if(chats.length > 0){

      currentChatId =
        chats[0].id;

      openChat(
        currentChatId
      );

    }else{

      startNewChat();

    }

  }


  /*
    Chat को नीचे रखें
  */
  scrollChatToBottom();


  /*
    Input focus
  */
  setTimeout(
    function(){

      if(messageInput){

        messageInput.focus();

      }

    },
    200
  );


  /* =====================================================
     PART 4 COMPLETE
  ===================================================== */

</script>
